---
# Bound VolSync restic mover pods so unbounded restic (BestEffort by default) can't
# saturate the single-node CPU and starve the Longhorn instance-manager (liveness
# timeout -> mass-fault cascade). Discovered 2026-07-21 after VolSync catch-up of 51
# overdue sources repeatedly cascaded the IM.
#
# - The CPU *request* throttles concurrency via the scheduler (only what fits the
#   node's freed headroom runs; the rest queue Pending) — VolSync has no operator
#   concurrency knob, so requests ARE the throttle.
# - The CPU *limit* caps restic burst so it physically cannot starve the IM.
#
# Applied at pod admission by name prefix (volsync-src-*), so it is HR-revert-proof:
# independent of the ReplicationSource spec and the TrueCharts chart (neither of which
# exposes moverResources). Pairs with VM 105 cpuunits=4096 (host CPU priority for Talos)
# and the app-request right-sizing that freed ~800m of scheduling headroom.
# See memory: project_qlc_ssd_migration_2026_07.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: volsync-mover-resources
  annotations:
    policies.kyverno.io/title: Bound VolSync mover resources
    policies.kyverno.io/category: Resource Management
    policies.kyverno.io/description: >-
      Injects CPU/memory requests+limits into VolSync restic mover pods to throttle
      concurrency (via scheduler) and cap restic burst, preventing single-node
      Longhorn instance-manager CPU starvation and mass-fault cascades.
spec:
  background: false
  rules:
    # Make movers preemptible by user-facing pods. The CPU request above is a
    # concurrency semaphore and must NOT be lowered, but it also meant a backup
    # could block an app from scheduling at all: every app and every mover sat at
    # priority 0, so the scheduler found "No preemption victims" and tunarr stayed
    # down (2026-07-30). Movers now sit below default priority, so an app can evict
    # one. See priorityclass-volsync-mover.yaml for the full rationale.
    - name: volsync-mover-preemptible
      match:
        any:
          - resources:
              kinds:
                - Pod
              names:
                - "volsync-src-*"
              # CREATE only. With operations unset, Kyverno mutates on UPDATE too,
              # which makes every mover pod PERMANENTLY UNMODIFIABLE: a metadata-only
              # update (e.g. clearing a stale finalizer) re-triggers these mutations,
              # and the API server then rejects the whole request because pod spec is
              # immutable - "pod updates may not change fields other than image...".
              #
              # That is not theoretical. On 2026-08-08 five movers (tunarr, calibre,
              # cwa, nzbget, overseerr) were stuck Failed since 2026-08-05 holding an
              # orphaned batch.kubernetes.io/job-tracking finalizer. The finalizer
              # could not be removed - every patch was rejected by this rule firing on
              # UPDATE - so their -src clone PVCs stayed Terminating, replacement
              # movers were unschedulable ("PVC is being deleted"), and the
              # ReplicationSources sat at SyncInProgress. Five apps went 45h with no
              # backup and VolSync could not self-heal.
              #
              # These rules only ever needed to fire at admission of a NEW mover.
              operations:
                - CREATE
      mutate:
        patchStrategicMerge:
          spec:
            # BOTH fields are required, and they must agree. The built-in Priority
            # admission plugin runs BEFORE external webhooks, so it stamps
            # `priority: 0` on the incoming pod; Kyverno then sets the class name,
            # and the validating phase rejects the mismatch with:
            #   "the integer value of priority (0) must not be provided in pod spec;
            #    priority admission controller computed -100 from the given
            #    PriorityClass name"
            # Setting priorityClassName ALONE therefore makes every mover pod
            # unadmittable - i.e. all backups silently stop. Caught by an admission
            # probe before the 00:00 backup wave; keep these two values in lockstep
            # with the PriorityClass value in priorityclass-volsync-mover.yaml.
            priorityClassName: volsync-mover-low
            priority: -100
    # Stop kubelet recursively chowning the WHOLE volume on every mover mount.
    #
    # The mover pod is created with fsGroup 1000 and NO fsGroupChangePolicy,
    # which defaults to "Always" - so kubelet walks and chowns every file on
    # every run. On large config volumes that dominates the entire backup:
    # plex-config lastSyncDuration was 3h34m and emby-config 1h48m for ~15 GB,
    # with source movers stuck in ContainerCreating emitting
    # VolumePermissionChangeInProgress once a minute for many minutes.
    #
    # That I/O lands on the same single SSD every Longhorn replica shares
    # (153/153 on ssd-hot) - the same device holding Plex's SQLite DB. See
    # docs/dr/longhorn-single-disk-io-contention.md.
    #
    # OnRootMismatch makes kubelet check the top-level directory's ownership and
    # skip the recursive walk when it already matches. The mover chowns to the
    # same fsGroup every run, so after the first pass the walk is pure waste.
    # Correctness is unchanged: on a genuine mismatch it still recurses.
    #
    # Applied here rather than on the ReplicationSource because TrueCharts sets
    # moverSecurityContext itself (fsGroup: 1000) and does not expose
    # fsGroupChangePolicy - the same reason mover resources are injected here.
    - name: volsync-mover-fsgroup-change-policy
      match:
        any:
          - resources:
              kinds:
                - Pod
              names:
                - "volsync-src-*"
              # CREATE only - see the rule above for why UPDATE wedges backups.
              operations:
                - CREATE
      mutate:
        patchStrategicMerge:
          spec:
            securityContext:
              fsGroupChangePolicy: OnRootMismatch

    - name: cap-volsync-mover-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
              names:
                - "volsync-src-*"
              # CREATE only - see the rule above for why UPDATE wedges backups.
              operations:
                - CREATE
      mutate:
        foreach:
          - list: "request.object.spec.containers"
            patchStrategicMerge:
              spec:
                containers:
                  - name: "{{ element.name }}"
                    resources:
                      requests:
                        cpu: 500m
                        memory: 256Mi
                      limits:
                        cpu: 750m
                        memory: 1Gi
