apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  chart:
    spec:
      chart: traefik
      # renovate: datasource=helm depName=traefik registryUrl=https://traefik.github.io/charts
      version: 40.3.0
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    deployment:
      enabled: true
      replicas: 1

    service:
      enabled: true
      type: LoadBalancer
      annotations:
        metallb.io/loadBalancerIPs: ${TRAEFIK_IP}
      spec:
        externalTrafficPolicy: Cluster

    logs:
      general:
        level: INFO
      access:
        enabled: true
        format: json

    ingressClass:
      enabled: true
      isDefaultClass: true

    tlsOptions:
      default:
        # TLS 1.3 minimum is deliberate hardening (0e2785883). This block is the
        # single source of truth for the `default` TLSOption — the standalone
        # tls-options.yaml CRD was removed because two managers (helm-controller
        # and kustomize-controller) fighting over the same object produced an
        # unintended SSA-merged spec on the live cluster.
        minVersion: VersionTLS13
        maxVersion: VersionTLS13
        sniStrict: true

    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
        allowExternalNameServices: true
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: true

    tlsStore:
      default:
        defaultCertificate:
          secretName: certificate-issuer-wethecommon-wildcard-cert
        # Also register the wildcard cert as a NAMED store certificate so its
        # SANs (wethecommon.com, *.wethecommon.com) enter the SNI match pool.
        # cloudflared presents originServerName=wethecommon.com for every tunnel
        # hostname; with sniStrict the default certificate is never used as a
        # fallback, so without this entry every tunnel request died in the TLS
        # handshake ("tls: unrecognized name", broken since 2026-08-14 22:56Z).
        # This keeps sniStrict enforcement intact — no default-cert fallback for
        # unknown SNI — while making the tunnel's already-certified name match.
        certificates:
          - secretName: certificate-issuer-wethecommon-wildcard-cert

    ports:
      traefik:
        expose:
          default: true
      web:
        expose:
          default: true
        exposedPort: 80
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
      websecure:
        expose:
          default: true
        exposedPort: 443
        # Trust X-Forwarded-For/CF-Connecting-IP from cloudflared pod IPs and
        # node IPs so middleware (CrowdSec bouncer, IP allowlists) can see the
        # real client IP for tunneled traffic.
        # Note: NOT enabling proxyProtocol — MetalLB L2 mode + Cilium kubeProxyReplacement
        # doesn't reliably inject PROXY headers, and enforcing it broke all LAN access.
        # LAN client IPs remain SNAT'd to node IPs (172.16.x.x); allowlists must
        # account for that.
        forwardedHeaders:
          trustedIPs:
            - 172.16.0.0/16    # pod CIDR (cloudflared)
            - 172.17.0.0/16    # service CIDR
            - 192.168.10.0/24  # LAN (Traefik node, MetalLB)
        http:
          tls:
            enabled: true
          middlewares:
            - traefik-bouncer@kubernetescrd

    metrics:
      prometheus:
        serviceMonitor:
          enabled: true

    experimental:
      plugins:
        bouncer:
          moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
          version: v1.5.1

    resources:
      requests:
        cpu: 10m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
