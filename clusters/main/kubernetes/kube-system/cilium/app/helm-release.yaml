apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
  annotations:
    meta.helm.sh/release-name: cilium
    meta.helm.sh/release-namespace: kube-system
  labels:
    app.kubernetes.io/managed-by: Helm
spec:
  interval: 15m
  chart:
    spec:
      chart: cilium
      version: 1.18.6
      sourceRef:
        kind: HelmRepository
        name: home-ops-mirror
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  uninstall:
    keepHistory: false
  values:
    # autoDirectNodeRoutes: true
    # routingMode: native
    hubble:
      enabled: false
      relay:
        enabled: false
    cluster:
      name: ${CLUSTERNAME}
      id: 1
    ipv4NativeRoutingCIDR: ${PODNET}
    securityContext:
      privileged: true
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    cgroup:
      automount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    enableRuntimeDeviceDetection: true
    endpointRoutes:
      enabled: true
    ipam:
      mode: kubernetes
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445
    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    localRedirectPolicy: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
    operator:
      rollOutPods: true
      replicas: 1
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      # 2026-08-04 (SQ-5): cilium-operator ran BestEffort (chart default
      # `operator.resources: {}`). It is the CNI control plane — it allocates
      # security identities, manages the IPAM pool and garbage-collects endpoints.
      # With replicas: 1 there is no second copy, so starving it stalls networking
      # for every NEW pod cluster-wide, which is precisely the condition present
      # during a recovery.
      #
      # Sized from measurement, not guesswork: observed usage is 5m CPU / 83Mi.
      # The request is a scheduling guarantee that moves it out of the first-to-starve
      # tier, not a capacity reservation — a request does NOT consume CPU it does
      # not use. No CPU limit, deliberately: CFS throttling would recreate the
      # starvation this prevents. See [[besteffort-control-plane-starvation]].
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi
    # cilium-envoy is the L7 proxy datapath and had accumulated 21 restarts while
    # BestEffort. Observed usage 4m CPU / 18Mi. cilium-agent already carries a
    # request (Burstable) — envoy was the gap in the same DaemonSet family.
    envoy:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
    rollOutCiliumPods: true
    bgpControlPlane:
      # Disabled: the Cilium↔UDM eBGP peering was redundant — L2 announcements
      # (default-l2-policy, loadBalancerIPs: true) already answer ARP for every
      # LB IP in 192.168.10.192/26, which is entirely on-subnet. The UDM lost its
      # FRR config on a firmware update, leaving the session permanently down and
      # generating false BGPSessionDown alerts. Removed 2026-07 (see #187).
      enabled: false
    l2announcements:
      enabled: true
      leaseDuration: 15s
      leaseRenewDeadline: 5s
      leaseRetryPeriod: 2s
    k8sClientRateLimit:
      qps: 50
      burst: 100
    externalIPs:
      enabled: true