# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homeassistant
  namespace: networking
spec:
  interval: 15m
  chart:
    spec:
      chart: external-service
      version: 17.9.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  releaseName: homeassistant
  values:
    ingress:
      main:
        enabled: true
        hosts:
          - host: homeassistant.${BASE_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: false
            ingressClassName: internal
          traefik:
            enabled: true
            entrypoints:
              - websecure
          certManager:
            enabled: true
            certificateIssuer: wethecommon-prod-cert
          homepage:
            # Verified by `helm template` against external-service 17.8.0: the
            # common-library ingress integration renders all gethomepage.dev/*
            # annotations (incl. widget.*) for this chart, same as for app charts.
            enabled: true
            name: Home Assistant
            group: Lifestyle & Home
            description: Home Automation
            # Explicit icon: empty/omitted falls back to the generic TrueCharts
            # external-service chart icon, not a Home Assistant one.
            icon: homeassistant.png
            widget:
              enabled: true
              # TrueCharts defaults widget type to the chart name
              # ("externalservice"), which Homepage does not recognize —
              # must be set explicitly (same gotcha as apps/media/cwa).
              type: homeassistant
              custom:
                # HA runs outside the cluster; point the widget straight at it
                # (same host as service.main.externalIP below).
                url: http://192.168.10.191:8123
                # Long-lived HA access token, substituted by Flux from the
                # SOPS-encrypted cluster-secrets Secret (flux-system).
                key: ${HOMEASSISTANT_API}
    service:
      main:
        enabled: true
        externalIP: 192.168.10.191
        ports:
          main:
            enabled: true
            port: 8123
            protocol: http
        type: ExternalIP
        useSlice: false
    workload:
      main:
        enabled: false
