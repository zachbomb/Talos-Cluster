---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
#
# changedetection.io — price / stock / content watcher with a real setup+monitoring web UI.
#
# CHOSEN OVER THE ALTERNATIVES ON EVIDENCE, not features (SQ-85 / SQ-86):
#   * PriceGhost      — last commit AND last image push both 2026-02-03; stalled.
#   * streetmerchant  — adding a product means writing a TypeScript store module and
#                       editing config.ts; its dashboard is ops-only, not setup.
#   * PriceBuddy      — actively maintained, but its only auth is a static non-refreshing
#                       cookie, and its documented http-credentials/extra-http-headers
#                       params are parsed and never applied to the driver (dead code).
#   * Discount Bandit — no authentication surface at all, and no LICENSE file.
#
# BROWSER FETCHER: PRESENT, BUT AS A SEPARATE DEPLOYMENT (browser.yaml), NOT A SIDECAR.
# SQ-87 reported and the decision landed in two halves:
#   * UNAUTHENTICATED fetching — ENABLED. B&H (and retail generally) returns 403 to the
#     `requests` fetcher no matter what headers are set; a urllib probe from this same
#     pod and egress IP with identical headers returns 200, so the block is the fetcher's
#     TLS/JA3 fingerprint and header ordering, which header tuning cannot change. Real
#     Chrome is the only fix — but it is set PER WATCH, not globally. SQ-88 measured the
#     retailers from inside this pod: Guitar Center (the only one that reliably works)
#     serves 200 to plain requests on all 11 products and needs no Chrome, while
#     Sweetwater (PerimeterX) and Perfect Circuit (Cloudflare) refuse BOTH fetchers, so a
#     browser buys nothing there either. That leaves only B&H genuinely needing Chrome.
#     With 2 Chrome slots and the node at 88% memory REQUESTS, a global browser default
#     would have every watch contending for the slots B&H depends on; a wrong-fetcher 403
#     sets last_error and shows red in the UI, so it fails VISIBLY with a one-click fix.
#     Global default is therefore html_requests. Do not "helpfully" change it back.
#   * AUTHENTICATED / B2B-portal fetching — REJECTED, and this is the load-bearing half.
#     Browser Steps do log in successfully, but when the credential later fails,
#     changedetection records the LOGIN PAGE TEXT as the new value with
#     `last_error: false` and fires the same notification a genuine price move fires.
#     The documented `conditions` safeguard makes it worse, converting silent-wrong into
#     silent-fail (frozen price, healthy-looking watch, no staleness alarm). Do not add
#     credentialed watches here. The correct answer for B2B pricing is cXML PunchOut /
#     OCI / EDI 832; the barrier there is commercial, not technical.
# Memory was measured, not guessed: app 257.8Mi + browser 342.8Mi peak (cgroup v2
# memory.peak), sized against the in-cluster anchor triparr-bot/chrome-cdp at 720Mi.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: changedetection
  namespace: changedetection
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 18.16.16
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      # renovate: datasource=docker depName=dgtlmoon/changedetection.io
      repository: docker.io/dgtlmoon/changedetection.io
      pullPolicy: IfNotPresent
      tag: "0.55.8"

    # RUNTIME SETTINGS THAT ARE *NOT* IN GIT. Only the env vars below are declarative.
    # The rest of the app's configuration lives in /datastore/changedetection.json and
    # is reachable ONLY through the /settings HTML form: there is no settings API
    # endpoint (flask_app.py registers watch/tag/import/search/notifications/systeminfo
    # /full-spec and nothing else), and hand-editing the JSON is futile because the
    # running app holds it in memory and rewrites the file wholesale on its next save.
    # Driving that form means GET /settings for the flask_wtf CSRF token + session
    # cookie, then POSTing back EVERY control at its current value with only the target
    # field changed — WTForms populates from the POST body alone, so any field you omit
    # is set to empty/False rather than left alone.
    #
    # Currently set that way, and what to restore if the datastore is ever rebuilt:
    #   notification_urls  json://notifiarr-bridge.notifiarr-bridge.svc.cluster.local:8080/webhook/simple
    #                      (the bridge's generic route; the Alertmanager route on plain
    #                      /webhook would parse this fine and emit a content-free
    #                      "[UNKNOWN] Alert" with HTTP 200 — delivered and useless)
    #   notification_format  text   — 'htmlcolor' emits <span style=…> that reaches
    #                                 Discord as literal markup
    #   fetch_backend        html_requests   — see the browser note above; B&H watches
    #                                 carry an explicit PER-WATCH html_webdriver instead
    #   base_url             https://changedetection.${BASE_DOMAIN}
    # Watches use the `restock_diff` processor, which reads schema.org Product/Offer as
    # JSON-LD *or* Microdata (Thomann ships microdata only, no ld+json) rather than
    # diffing raw page text — so banner/recommendation churn cannot fire a false
    # "price changed". changedetection's two shipped DEMO watches (Hacker News, its own
    # CHANGELOG) are muted: with a global notification URL set they would otherwise
    # deliver several junk Discord messages a day.
    # This is covered by the VolSync snapshot below, which is the actual backup of it.
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                # Used to build absolute links inside notifications; without it the
                # alert body points at a bare container hostname nobody can click.
                BASE_URL: https://changedetection.${BASE_DOMAIN}
                # The scheduler default is aggressive for retail sites. 6h is a
                # deliberate floor — see the lockout/ToS note above. Per-watch
                # intervals can still be set in the UI.
                MINIMUM_SECONDS_RECHECK_TIME: "21600"
                # Points at the sockpuppetbrowser Deployment (browser.yaml), NOT a
                # sidecar. app-template SILENTLY IGNORES an inline `image:` on an extra
                # container and reuses the chart's main image: an attempt at a sidecar
                # started a SECOND changedetection.io against this same /datastore, which
                # tried a fresh install and crash-looped on Permission denied. (tunarr's
                # cache-purge has the same latent bug — it declares alpine and actually
                # runs the tunarr image; it only works because it just needs a shell.)
                # A plain Deployment sidesteps the chart abstraction entirely.
                PLAYWRIGHT_DRIVER_URL: ws://changedetection-browser:3000

    service:
      main:
        enabled: true
        # ClusterIP, NOT LoadBalancer: no CHANGEDETECTION_IP exists in clusterenv, and
        # this needs no direct L2 address — Traefik fronts it like every other app.
        type: ClusterIP
        ports:
          main:
            enabled: true
            port: 5000
            protocol: http
            targetPort: 5000

    credentials:
      s3:
        type: s3
        url: ${S3URL}
        bucket: "${S3PREFIX}-changedetection"
        accessKey: ${S3ID}
        secretKey: ${S3KEY}
        encrKey: ${S3KEY}

    persistence:
      datastore:
        enabled: true
        size: 2Gi
        mountPath: /datastore
        volsync:
          - name: datastore
            type: restic
            credentials: s3
            dest:
              # dest disabled: the VolSync mover drops CAP_CHOWN, and this image runs
              # as root, so a restore would fail on lchown. Same treatment as the other
              # root-running apps in this cluster.
              enabled: false
              cacheCapacity: 2Gi
            src:
              enabled: true
              cacheCapacity: 2Gi
              trigger:
                schedule: 22 3 * * *

    ingress:
      main:
        enabled: true
        hosts:
          - host: changedetection.${BASE_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: false
            ingressClassName: internal
          traefik:
            enabled: true
            entrypoints:
              - websecure
            middlewares:
              - name: internal-secure-chain
                namespace: traefik
                expandObjectName: false
          certManager:
            enabled: true
            certificateIssuer: wethecommon-prod-cert
          homepage:
            enabled: true
            name: changedetection
            description: Price / stock / page-change watcher
            group: Tools
            icon: ""

    securityContext:
      container:
        readOnlyRootFilesystem: false
      pod:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch

    metrics:
      main:
        enabled: false
    autoscaling:
      vpa:
        enabled: false
    addons:
      codeserver:
        enabled: false

    resources:
      requests:
        memory: 256Mi
        cpu: 10m
      limits:
        # Memory limit only. NO CPU limit — a CPU limit throttles under pressure, and
        # this cluster has a recorded incident class where CPU starvation trips liveness
        # probes and kills healthy pods. Requests are set so the pod is never BestEffort.
        memory: 768Mi
