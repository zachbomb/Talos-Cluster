apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: triparr-db
  namespace: triparr-bot
spec:
  instances: 1
  postgresql:
    parameters:
      shared_buffers: "256MB"
      effective_cache_size: "512MB"
    pg_hba:
      - host all all 10.0.0.0/8 md5
  bootstrap:
    initdb:
      database: triparr
      owner: triparr_user
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp"
        - CREATE EXTENSION IF NOT EXISTS "pgcrypto"
        - CREATE EXTENSION IF NOT EXISTS "pg_trgm"
  storage:
    size: 120Gi
  # 2026-09-07: separate WAL volume, applied after sonarqube-db deadlocked
  # itself for four months on exactly this exposure. See
  # docs/dr/sonarqube-wal-deadlock-2026-09-07.md
  #
  # If WAL archiving fails, PostgreSQL MAY NOT recycle unarchived segments, so
  # WAL grows without bound. Sharing the data volume makes that terminal: the
  # volume fills, PostgreSQL refuses to start, and a stopped PostgreSQL cannot
  # archive -- so it never drains. On a separate volume the same failure fills
  # only THIS volume; PostgreSQL still stops, but the data volume stays healthy
  # and the fault is isolated and legible rather than self-sealing.
  #
  # 8Gi, not 2Gi (2Gi fills in days on an active cluster). Current WAL here is
  # 577MB, and sonarqube's four-month stranded backlog peaked at 9.7GB, so 8Gi
  # is sized against a real observed worst case. Note the 120Gi data volume is
  # only 5% used -- the WAL exposure was never about total capacity, it was
  # about WAL being able to fill whatever volume it shares.
  #
  # Adding walStorage to a live cluster provisions a new PVC and recycles the
  # instance -- expect a brief outage on reconcile (measured ~3.5 min on
  # sonarqube, single-instance).
  walStorage:
    size: 8Gi
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-triparr/
      endpointURL: ${S3URL}
      s3Credentials:
        accessKeyId:
          name: triparr-db-s3-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: triparr-db-s3-creds
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"
  monitoring:
    # Postgres server metrics (cnpg_*/pg_*: connections, TPS, cache-hit, DB size,
    # locks, replication) via the CNPG native exporter :9187. Prometheus
    # podMonitorSelector={} auto-scrapes the operator-created PodMonitor.
    enablePodMonitor: true
