apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: openwebui-db
  namespace: ollama
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  primaryUpdateStrategy: unsupervised
  storage:
    size: 5Gi
  resources:
    requests:
      memory: 128Mi
      cpu: 10m
    limits:
      memory: 512Mi
      cpu: 500m
  postgresql:
    parameters:
      shared_buffers: "128MB"
      max_connections: "50"
  monitoring:
    # Postgres server metrics (cnpg_*/pg_*) via CNPG native exporter :9187;
    # Prometheus podMonitorSelector={} auto-scrapes the operator PodMonitor.
    enablePodMonitor: true
  bootstrap:
    initdb:
      database: openwebui
      owner: openwebui
