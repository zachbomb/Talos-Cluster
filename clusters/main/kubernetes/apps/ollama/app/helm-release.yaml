# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama
  namespace: ollama
spec:
  releaseName: ollama
  interval: 15m
  timeout: 10m
  chart:
    spec:
      chart: ollama
      version: 9.34.6
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    image:
      repository: docker.io/ollama/ollama
      pullPolicy: IfNotPresent
      tag: 0.40.10@sha256:4c5b27871a3239a717048f9b93057680a51b60c8119a7016aebb57f938e25e35
    rocmImage:
      repository: docker.io/ollama/ollama
      pullPolicy: IfNotPresent
      tag: 0.40.10-rocm@sha256:de07d8eb271c545fca32a8783d069fba94df42f09d6e04ec3015ed8888b073fe
    uiImage:
      repository: ghcr.io/open-webui/open-webui
      pullPolicy: IfNotPresent
      tag: latest@sha256:4860ba005ae8f19f08d1e12b0868855b7b339ea0dad9927f196820fc0de04575
    credentials:
      s3:
        type: s3
        url: ${S3URL}
        bucket: "${S3PREFIX}-ollama"
        accessKey: ${S3ID}
        secretKey: ${S3KEY}
        encrKey: ${S3KEY}
    ingress:
      main:
        enabled: true
        hosts:
          - host: ollama.${BASE_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: false
            ingressClassName: internal
          traefik:
            enabled: true
            entrypoints:
              - websecure
            middlewares:
              - name: internal-secure-chain
                namespace: traefik
                expandObjectName: false
          certManager:
            enabled: true
            certificateIssuer: wethecommon-prod-cert
          homepage:
            enabled: true
            name: Ollama
            description: AI Language Model
            group: Lifestyle & Home
            widget:
              # Homepage's ollama widget hits the native Ollama API (port 11434),
              # not the OpenWebUI frontend (port 10686). Same OLLAMA_IP serves both
              # via the ollama-api LB service.
              custom:
                url: "http://${OLLAMA_IP}:11434"
              enabled: true
    service:
      main:
        enabled: true
        type: LoadBalancer
        annotations:
          metallb.io/loadBalancerIPs: ${OLLAMA_IP}
          metallb.io/allow-shared-ip: "ollama"
        ports:
          main:
            enabled: true
            port: 10686
            targetPort: 10686
            protocol: tcp
      api:
        enabled: true
        type: LoadBalancer
        targetSelector: main
        annotations:
          metallb.io/loadBalancerIPs: ${OLLAMA_IP}
          metallb.io/allow-shared-ip: "ollama"
        ports:
          api:
            enabled: true
            port: 11434
            targetPort: 11434
            protocol: tcp
    ollama:
      registration:
        enabled: true
        def_user_role: "pending"
      whisper:
        model: "base"
      rag:
        embedding_engine: "ollama"
        model: "nomic-embed-text"
        model_device_type: "cuda"
    workload:
      main:
        podSpec:
          runtimeClassName: "nvidia"
          containers:
            main:
              imageSelector: image
              env:
                OLLAMA_BIND_ADDRESS: "0.0.0.0"
                # GPU/VRAM tuning for the single RTX A4000 (16GB), exclusive to
                # Ollama as of 2026-10-23. Flash attention is required for a
                # quantized KV cache; q8_0 halves KV memory vs f16.
                OLLAMA_FLASH_ATTENTION: "1"
                OLLAMA_KV_CACHE_TYPE: "q8_0"
                # Single-user homelab: one parallel slot (each slot multiplies
                # the KV cache); one big primary + the embedding model resident.
                OLLAMA_NUM_PARALLEL: "1"
                OLLAMA_MAX_LOADED_MODELS: "2"
                # Pin loaded models: no cold-start reload off the single Longhorn
                # disk. Nothing else may use the GPU, so idle VRAM costs nothing.
                OLLAMA_KEEP_ALIVE: "-1"
                # Host->GPU copies run at only ~65 MB/s in this passthrough VM
                # (measured 2026-10-23: 14.4GB loaded from page cache in 220s),
                # so a 15-17GB model takes 4-4.5 min to load, right at the 5m
                # default that failed the first gemma4 load. Give loads room.
                OLLAMA_LOAD_TIMEOUT: "15m"
                # Open WebUI RAG is TOP_K 20 x CHUNK 512 (~10K tokens) plus a
                # ~3.5K-token system prompt: Ollama's 4K default silently
                # truncates retrieved context. Gemma 4 uses sliding-window
                # attention, so 32K is cheap in KV memory.
                OLLAMA_CONTEXT_LENGTH: "32768"
              # Preload the primary model as soon as the server answers, so the
              # ~15 min cold start of this passthrough VM (host->GPU ~11-65 MB/s,
              # SQ-190) is paid at deploy time rather than on the first user
              # request. The image has no curl, so the ollama CLI is used; the
              # work is detached with setsid so the hook returns at once and the
              # pod can become Ready. OLLAMA_KEEP_ALIVE=-1 then keeps it resident.
              # Every shell `$$` below is a doubled `$` for Flux envsubst.
              lifecycle:
                postStart:
                  type: exec
                  command:
                    - /bin/sh
                    - -c
                    - |
                      setsid /bin/sh -c '
                        i=0
                        until ollama list >/dev/null 2>&1 || [ "$$i" -ge 120 ]; do
                          i=$$((i+1)); sleep 5
                        done
                        ollama run gemma4:12b-it-qat "Warm-up. Reply with exactly: OK" >/dev/null 2>&1
                      ' >/dev/null 2>&1 &
              probes:
                liveness:
                  enabled: true
                  type: http
                  path: /api/version
                  port: 11434
                readiness:
                  enabled: true
                  type: http
                  path: /api/version
                  port: 11434
                startup:
                  enabled: true
                  type: tcp
                  port: 11434
      ui:
        enabled: true
        type: Deployment
        podSpec:
          containers:
            ui:
              primary: true
              enabled: true
              imageSelector: uiImage
              resources:
                requests:
                  memory: 768Mi
                  cpu: 50m
                limits:
                  memory: 4Gi
                  cpu: "2"
              probes:
                liveness:
                  enabled: true
                  type: http
                  path: /
                  port: 10686
                readiness:
                  enabled: true
                  type: http
                  path: /
                  port: 10686
                startup:
                  enabled: true
                  type: tcp
                  port: 10686
              env:
                PORT: "10686"
                OLLAMA_BASE_URL: "http://${OLLAMA_IP}:11434"
                ENABLE_SIGNUP: "true"
                DEFAULT_USER_ROLE: "pending"
                WHISPER_MODEL: "base"
                RAG_EMBEDDING_ENGINE: "ollama"
                RAG_EMBEDDING_MODEL: "nomic-embed-text"
                RAG_EMBEDDING_MODEL_DEVICE_TYPE: "cuda"
                RAG_SYSTEM_CONTEXT: "true"
                CHUNK_SIZE: "512"
                CHUNK_OVERLAP: "64"
                RAG_TOP_K: "20"
                DATABASE_URL: "postgresql://openwebui:lh0of17euyZs8SOPzSkvEP9wdbxmtqyaKQNEl80dhvhhGRImKgxb4vHThcA8Sa3U@openwebui-db-rw.ollama:5432/openwebui"
                WEBUI_SECRET_KEY:
                  secretKeyRef:
                    name: ollama-secrets
                    key: WEBUI_SECRET_KEY
    configmap:
      tcportal-open:
        enabled: true
        data:
          placeholder: "enabled"
    persistence:
      config:
        enabled: true
        # Bumped 50Gi → 60Gi 2026-06-10 to match the live PVC (had been
        # manually expanded at some point). Helm release was failing with
        # "field can not be less than status.capacity" because helm wanted
        # to set 50Gi while the bound PVC was already 60Gi (Kubernetes
        # rejects PVC shrinks).
        # Bumped 60Gi → 100Gi 2026-10-23: room for the gemma4:12b-it-qat primary
        # (7.2GB) plus gemma4:26b-a4b-it-qat (14.4GB, parked until the Proxmox
        # host->GPU transfer path is fixed) and qwen3.6:27b (16.8GB, slow
        # quality-only A/B) beside the existing roster. Longhorn online expansion;
        # the live PVC was patched to 100Gi the same day so Helm and the bound
        # PVC agree (see the 50→60 note above for why a mismatch fails).
        size: 100Gi
        mountPath: /root/.ollama
        volsync:
          - name: config
            type: restic
            credentials: s3
            src:
              enabled: true
              cacheCapacity: 10Gi
              trigger:
                schedule: "4 9 * * *"
            dest:
              enabled: false
              cacheCapacity: 10Gi
      data:
        enabled: true
        size: 5Gi
        mountPath: /app/backend/data
        volsync:
          - name: data
            type: restic
            credentials: s3
            src:
              enabled: true
              cacheCapacity: 3Gi
              trigger:
                schedule: "26 11 * * *"
            dest:
              enabled: false
              cacheCapacity: 3Gi
    autoscaling:
      vpa:
        enabled: true
    resources:
      requests:
        memory: 2Gi
        cpu: 50m
      limits:
        memory: 24Gi
        cpu: "4"
        nvidia.com/gpu: 1
