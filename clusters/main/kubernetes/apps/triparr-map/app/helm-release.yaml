# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
#
# trans travel-safety map — fully static site (nginx serving a Vite build).
#
# Source + Dockerfile: Triparr-Bot repo, trans-safety-map/ (repo-root sibling of the
# app — deliberately NOT part of the Triparr webapp; see the design doc §0 there).
# Hosting decision 2026-07-30: Triparr side domain now, split-on-monetization, with
# permanent redirects required at any future split (link rot is a safety issue).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: triparr-map
  namespace: triparr-map
spec:
  interval: 5m
  timeout: 10m
  releaseName: triparr-map
  chart:
    spec:
      chart: app-template
      version: 18.16.13
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: ghcr.io/zachbomb/triparr-map
      tag: latest
      pullPolicy: Always
    imagePullSecret:
      ghcr-pull-secret:
        enabled: true
        data:
          registry: ghcr.io
          username: zachbomb
          password: ${TRIPARR_GHCR_TOKEN}
          email: zachbomb@gmail.com
    workload:
      main:
        podSpec:
          containers:
            main:
              probes:
                liveness:
                  enabled: true
                  type: http
                  port: 8080
                  path: /
                readiness:
                  enabled: true
                  type: http
                  port: 8080
                  path: /
    persistence:
      # TrueCharts defaults to a read-only root filesystem (good); nginx needs these
      # two writable. Ephemeral scratch only — the site itself stays immutable.
      nginx-cache:
        enabled: true
        type: emptyDir
        mountPath: /var/cache/nginx
      nginx-run:
        enabled: true
        type: emptyDir
        mountPath: /run
    service:
      main:
        enabled: true
        type: ClusterIP
        ports:
          main:
            enabled: true
            port: 8080
            targetPort: 8080
            protocol: http
    ingress:
      main:
        enabled: true
        hosts:
          - host: transsafetymap.${BASE_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: false
            ingressClassName: internal
          traefik:
            enabled: true
            entrypoints:
              - websecure
          certManager:
            enabled: true
            certificateIssuer: wethecommon-prod-cert
