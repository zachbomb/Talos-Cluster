---
# Standalone exportarr for bazarr — DECOUPLED from the bazarr pod on purpose.
# bazarr has no config.xml, so exportarr can't auto-read the key like the *arr
# charts do; it needs APIKEY passed explicitly. Running it as its own Deployment
# (not a sidecar in the bazarr pod) means a misconfigured/crashing exporter can
# NEVER make bazarr's pod not-ready → no repeat of the 2026-07-27 bazarr outage.
# See memory reference_exportarr_metrics_gotchas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr-exportarr
  namespace: media
  labels:
    app.kubernetes.io/name: bazarr-exportarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bazarr-exportarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bazarr-exportarr
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exportarr
          image: ghcr.io/onedr0p/exportarr:v2.3.0
          args: ["bazarr"]
          env:
            - name: APIKEY
              value: ${BAZARR_API}
            - name: URL
              value: http://bazarr:6767
            - name: PORT
              value: "9709"
            - name: INTERFACE
              value: 0.0.0.0
          ports:
            - name: metrics
              containerPort: 9709
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bazarr-exportarr
  namespace: media
  labels:
    app.kubernetes.io/name: bazarr-exportarr
spec:
  selector:
    app.kubernetes.io/name: bazarr-exportarr
  ports:
    - name: metrics
      port: 9709
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bazarr-exportarr
  namespace: media
  labels:
    app.kubernetes.io/name: bazarr-exportarr
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bazarr-exportarr
  endpoints:
    - port: metrics
      # bazarr's /api/movies is slow (it tracks the full ~2.4k-movie library
      # for subtitles), so the full exportarr scrape exceeds the default 10s
      # timeout. Originally raised to 90s/45s when that call took ~9s.
      #
      # 2026-08-07: raised again, 90s/45s -> 5m/2m. Measured directly today the
      # full scrape takes 49.6s and returns HTTP 200 - it COMPLETES, it just
      # overran the 45s budget. Every scrape was failing with
      # `context deadline exceeded`, so every bazarr_* metric was absent and
      # the subtitle-gap panels rendered blank.
      #
      # Note how this failed: not loudly, but as an empty panel. A missing
      # metric reads as "nothing wrong", which is why it went unnoticed until
      # a dashboard build validated every expression and found the hole.
      #
      # scrapeTimeout MUST be <= interval or Prometheus rejects the config.
      interval: 5m
      scrapeTimeout: 2m
