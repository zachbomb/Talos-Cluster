apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bazarr
  namespace: media
spec:
  interval: 5m
  timeout: 10m
  chart:
    spec:
      chart: bazarr
      version: 24.8.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    image:
      repository: ghcr.io/home-operations/bazarr
      pullPolicy: IfNotPresent
      tag: 1.6.0
    credentials:
      s3:
        type: s3
        url: ${S3URL}
        bucket: "${S3PREFIX}-bazarr"
        accessKey: ${S3ID}
        secretKey: ${S3KEY}
        encrKey: ${S3KEY}
    # exportarr sidecar → Prometheus metrics (mirrors the sonarr wiring). exportarr
    # supports bazarr; it reads the API key from /config (mounted read-only below).
    exportarrImage:
      pullPolicy: IfNotPresent
      repository: ghcr.io/onedr0p/exportarr
      tag: v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
    ingress:
      main:
        enabled: true
        hosts:
          - host: bazarr.${BASE_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: false
            ingressClassName: internal
          traefik:
            enabled: true
            entrypoints:
              - websecure
            middlewares:
              - name: internal-secure-chain
                namespace: traefik
                expandObjectName: false
          certManager:
            enabled: true
            certificateIssuer: wethecommon-prod-cert
          homepage:
            enabled: true
            name: Bazarr
            description: Subtitle Downloader/Manager
            group: -*rrs
            icon: ""
            widget:
              enabled: true
              custom:
                key: ${BAZARR_API}
    service:
      main:
        enabled: true
        type: LoadBalancer
        loadBalancerIP: ${BAZARR_IP}
        annotations:
          metallb.io/loadBalancerIPs: ${BAZARR_IP}
        ports:
          main:
            enabled: true
            port: 6767
            targetPort: 6767
            protocol: http
    workload:
      main:
        podSpec:
          initContainers:
            initconfig:
              enabled: false
    metrics:
      main:
        enabled: true
        endpoints:
          - path: /metrics
            port: metrics
        prometheusRule:
          enabled: false
        targetSelector: metrics
        type: servicemonitor
    persistence:
      config:
        enabled: true
        size: 2Gi
        # main gets /config rw; exportarr sidecar gets it read-only (to read the API key)
        main:
          enabled: true
          mountPath: /config
        exportarr:
          mountPath: /config
          readOnly: true
        volsync:
          - name: config
            type: restic
            credentials: s3
            dest:
              enabled: true
              cacheCapacity: 2Gi
            src:
              enabled: true
              cacheCapacity: 2Gi
              trigger:
                schedule: "24 1 * * *"
      media:
        enabled: true
        type: nfs
        path: /mnt/Pibbs-Horde/media/data
        server: 192.168.10.123
        mountPath: /media
        mountOptions:
          - nfsvers=4
          - tcp
          - intr
          - hard
          - noatime
          - nodiratime
          - nolock
    autoscaling:
      vpa:
        enabled: false
    securityContext:
      container:
        UMASK: "0022"
        runAsUser: 1000
        runAsGroup: 1000
      pod:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    resources:
      requests:
        memory: 256Mi
        cpu: 10m
      limits:
        memory: 1Gi
        cpu: 500m
