# Nightly: map any Tunarr channel that Plex's DVR has not mapped yet.
# Plex never maps new HDHomeRun channels on its own, so every channel we build
# stayed invisible in Plex Live TV until someone remembered (2026-08-28,
# 2026-09-17, 2026-09-24). The script only ADDS missing channels or corrects stale
# guide keys; it re-sends every existing mapping unchanged, never removes one, and
# verifies afterwards. Source: plex-dvr-sync.py beside this file (also reachable as
# tools/media/plex_dvr_sync.py for ad-hoc runs; use --dry-run to only report).
# Memory: reference_plex_dvr_channel_mapping.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: plex-dvr-sync
  namespace: media
  labels:
    app.kubernetes.io/name: plex-dvr-sync
spec:
  # 04:30 Pacific: after the VolSync window (00:00-04:32 UTC) and before the Plex
  # butler (06:00-09:00 PDT). Once a day keeps CronJob container churn negligible
  # (see the kubelet cadvisor goroutine-leak note on tunarr-token-heal).
  schedule: "30 4 * * *"
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: plex-dvr-sync
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: python:3.14-alpine
              imagePullPolicy: IfNotPresent
              command: ["python3", "/script/plex-dvr-sync.py"]
              env:
                - name: PLEX_API
                  value: "${PLEX_API}"
                - name: PLEX_URL
                  value: "http://plex:32400"
                - name: TUNARR_URL
                  value: "http://tunarr-app-template:8000"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 5m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: plex-dvr-sync-script
