---
# Standalone Tunarr metrics exporter — decoupled from the tunarr pod (see
# reference_exportarr_metrics_gotchas: a crashing sidecar takes the app down via
# pod-readiness, so exporters live in their own Deployment). No Tunarr exporter
# exists upstream, so this uses the prometheus-community json_exporter
# (maintained, multi-arch) against Tunarr's JSON API (no auth). Config +
# JSONPath validated locally with json_exporter v0.7.0 against the live Tunarr
# API (2026-08-05): 78 series across 26 channels, zero exporter errors.
#
# Deliberately OMITTED: /api/sessions. Its response is keyed by channel uuid,
# and JSONPath cannot lift a map key into a label — two same-type sessions on
# different channels then collide into one series and the whole probe 500s
# (reproduced locally). Session-level visibility needs a bespoke exporter or an
# upstream /metrics endpoint; scrape liveness (up) plus channel inventory is
# the coverage this probe provides.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tunarr-exporter-config
  namespace: media
  labels:
    app.kubernetes.io/name: tunarr-exporter
data:
  config.yml: |
    ---
    modules:
      channels:
        metrics:
          # One series per configured channel; count(tunarr_channel_info) =
          # channel count. duration_ms is total programmed runtime; a channel
          # whose lineup stops growing shows as a flat duration_ms (the stale
          # perpetual-flex lineup failure mode).
          - name: tunarr_channel
            type: object
            help: Tunarr channel inventory (one series per configured channel)
            path: '{ [*] }'
            labels:
              name: '{ .name }'
              number: '{ .number }'
            values:
              info: 1
              duration_ms: '{ .duration }'
              stealth: '{ .stealth }'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunarr-exporter
  namespace: media
  labels:
    app.kubernetes.io/name: tunarr-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tunarr-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tunarr-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          # renovate: datasource=docker depName=quay.io/prometheuscommunity/json-exporter
          image: quay.io/prometheuscommunity/json-exporter:v0.7.0@sha256:3a777171d39ad435cb39519e84e0a8b5c63c7e716cc06011f8140cfaabfc1baf
          args:
            - --config.file=/etc/json_exporter/config.yml
            - --web.listen-address=:7979
          ports:
            - name: metrics
              containerPort: 7979
          volumeMounts:
            - name: config
              mountPath: /etc/json_exporter
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: tunarr-exporter-config
---
apiVersion: v1
kind: Service
metadata:
  name: tunarr-exporter
  namespace: media
  labels:
    app.kubernetes.io/name: tunarr-exporter
spec:
  selector:
    app.kubernetes.io/name: tunarr-exporter
  ports:
    - name: metrics
      port: 7979
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tunarr-exporter
  namespace: media
  labels:
    app.kubernetes.io/name: tunarr-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tunarr-exporter
  endpoints:
    - port: metrics
      path: /probe
      interval: 60s
      scrapeTimeout: 30s
      params:
        module: [channels]
        # The tunarr HelmRelease uses the app-template chart, so its service is
        # tunarr-app-template (verified live), not tunarr.
        target: ["http://tunarr-app-template:8000/api/channels"]
      relabelings:
        - targetLabel: probe
          replacement: channels
