# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tunarr
  namespace: media
spec:
  interval: 5m
  timeout: 15m
  releaseName: tunarr
  chart:
    spec:
      chart: app-template
      version: 18.20.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      # renovate: datasource=github-releases depName=chrisbenincasa/tunarr extractVersion=^v(?<version>.+)$
      repository: ghcr.io/chrisbenincasa/tunarr
      tag: 1.3.14
      pullPolicy: IfNotPresent
    env:
      TZ: America/Los_Angeles
      TUNARR__TV_DIR: /tv
      TUNARR__MOVIES_DIR: /movies
      TUNARR__MUSIC_DIR: /music
      TUNARR__PORT: "8000"
    workload:
      main:
        args:
          - "--port"
          - "8000"
        podSpec:
          containers:
            main:
              # GitOps durability for the double-`-ss` ffmpeg wrapper.
              # The wrapper lives on the `local` PVC (/root/.local), so a VolSync
              # restore silently removes it and EVERY transcode breaks - while Tunarr
              # itself looks perfectly healthy. This rewrites it on every container
              # start, so the shim can never go missing.
              # Written with literal paths and NO shell variables: Flux runs strict
              # envsubst over this manifest, and the script is base64 so its own `$1`
              # / `$@` / `$preval` can never collide with substitution.
              # Atomic (temp + mv) so a container killed mid-write cannot leave a
              # truncated wrapper for ffmpeg to exec. Always exits 0 - a failing
              # postStart hook would make Kubernetes kill the container.
              lifecycle:
                postStart:
                  type: exec
                  command:
                    - /bin/sh
                    - -c
                    - |
                      mkdir -p /root/.local/share/tunarr 2>/dev/null
                      printf %s '' | base64 -d > /root/.local/share/tunarr/.ffmpeg-wrap.new 2>/dev/null
                      chmod 0755 /root/.local/share/tunarr/.ffmpeg-wrap.new 2>/dev/null
                      mv -f /root/.local/share/tunarr/.ffmpeg-wrap.new /root/.local/share/tunarr/ffmpeg-wrap 2>/dev/null
                      exit 0
              resources:
                requests:
                  memory: 2Gi
                  # Right-sized 2026-07-21: reserved 500m, idle ~3m. Transcode is VAAPI/iGPU,
                  # so streaming CPU is muxing/IO (~150-250m). 250m GUARANTEES that under node
                  # contention (request = guaranteed floor); 4-core limit still covers peaks.
                  cpu: 250m
                limits:
                  gpu.intel.com/i915: 1
                  memory: 8Gi
                  cpu: "4"
            cache-purge:
              enabled: true
              image:
                repository: alpine
                tag: "3.24"
              command:
                - /bin/sh
                - -c
                - |
                  echo "Cache purge sidecar started (2m interval; transcode>2m, caches>30m; subtitle cache NEVER purged; zombie-transcode reaper armed)"
                  # curl is needed for the reaper's DELETE (busybox wget cannot send DELETE).
                  # If this fails (no network at start), the reaper self-disables and the
                  # purge loop below still runs — fail-safe, never fail-dangerous.
                  command -v curl >/dev/null 2>&1 || apk add --no-cache curl >/dev/null 2>&1
                  while true; do
                    # HLS transcode segments are the runaway growth vector (~8.8GB/hr per active
                    # stream, and streams linger after client disconnect). Purge tightly so
                    # /.transcode stays well under its 5Gi PVC even during heavy channel-surfing.
                    # Purge per-directory, deciding by whether the SESSION is alive -
                    # not by file type. Both naive versions were wrong:
                    #
                    #  1. blanket `-type f -mmin +2` (original) also ate subs.m3u8 and
                    #     every .vtt. Tunarr's subtitle output is not readrate-throttled
                    #     (only input 0 is), so subtitle segments run ahead of video;
                    #     the .vtt a player still needs is ALREADY >2min old and got
                    #     deleted before the video reached it. Subtitles vanished
                    #     mid-program and it looked like a client bug.
                    #  2. scoping to `*.ts` only (my first fix) stopped that, but left
                    #     stream.m3u8 behind FOREVER. Stream dirs are keyed by CHANNEL
                    #     UUID, so they are reused across sessions - leaving an orphaned
                    #     playlist with `EXT-X-MEDIA-SEQUENCE:0` and zero entries sitting
                    #     where the next session lands. Consecutive fetches then alternate
                    #     between the live playlist and the stale corpse, so the served
                    #     media sequence WALKS BACKWARD (observed 35->18->8->0, 27->0).
                    #     A live media sequence must never decrease; players die ~3min in.
                    #
                    # Correct rule: while a session is producing segments, keep its
                    # playlists and subtitles and only age out .ts. Once it stops
                    # producing, the whole directory is dead - remove everything so no
                    # stale playlist can outlive its segments.
                    for d in /.transcode/stream_*/; do
                      [ -d "$$d" ] || continue
                      if [ -n "$$(find "$$d" -maxdepth 1 -name '*.ts' -mmin -2 2>/dev/null | head -1)" ]; then
                        # 10 MINUTES, not 2. Upstream `trimPlaylist` pins the SERVED
                        # video window to minSegmentRequested; when nothing advances
                        # that anchor it stays at 0 and the served playlist is frozen
                        # at data000000..019 forever - MEASURED: on-disk playlist grew
                        # 21->42 entries while the served one never left 20 entries
                        # starting at data000000. Meanwhile subs.m3u8 is served raw and
                        # advances normally, which is why a live subtitle playlist sits
                        # beside a corpse video playlist in the SAME directory.
                        #
                        # A frozen window is survivable on its own (it replays). This
                        # purge is survivable on its own (a live window outruns it).
                        # Together they kill the session: the frozen 20-entry window is
                        # 80s of content created at t=0..80, and a 2-minute floor
                        # deletes its head on the first tick after t=120 - so every
                        # entry 404s and playback dies. Client measured deaths at 152s,
                        # 187s, 188s; predicted window t=120..240s. That is the match.
                        #
                        # 10 min moves death to ~11 min and, more usefully, SEPARATES
                        # the two failures: with segments retained, any remaining stall
                        # is attributable to the frozen window alone. Cost ~1.5GB per
                        # stream (8.8GB/hr); the 5Gi PVC holds 2-3 concurrent.
                        # Retire this once upstream anchors to the live edge.
                        find "$$d" -maxdepth 1 -type f -name '*.ts' -mmin +10 -delete 2>/dev/null
                      else
                        find "$$d" -maxdepth 1 -type f -mmin +2 -delete 2>/dev/null
                      fi
                    done
                    # mtime guard is CRITICAL: Tunarr creates stream_<ch>/ then launches
                    # ffmpeg, leaving the dir empty for several seconds (HEVC-QSV encoder
                    # init is slow). An unguarded `-type d -empty -delete` deletes that
                    # live dir mid-tune → ffmpeg writes to nothing → "No master playlist" →
                    # 500. Only reap empty dirs untouched >2m (abandoned), never live ones.
                    find /.transcode -mindepth 1 -type d -empty -mmin +2 -delete 2>/dev/null
                    # Image/misc caches grow slowly; purge gently to preserve cache hit-rate.
                    find /.cache -type f -mmin +30 -delete 2>/dev/null
                    # EXCLUDE Tunarr's log dir: at logLevel=debug the log is written
                    # constantly so mtime stayed fresh and it survived — but dropping to
                    # info made writes sparse, the 30m rule deleted tunarr.log, and the
                    # then-empty dir was reaped too. Tunarr's own settings API 500s with
                    # ENOENT scandir when logsDirectory is missing, and ALL diagnostics
                    # are lost. Log size is now bounded by Tunarr's own rolling
                    # (50MB x 3, enabled 2026-07-30), so this purge must not touch it.
                    find /.local -type f -mmin +30 -not -path "/.local/share/tunarr/logs/*" -delete 2>/dev/null
                    # DO NOT purge /root/.local/share/tunarr/cache: it is Tunarr's SUBTITLE
                    # EXTRACTION cache (tiny .srt files — ~18M for 400+ entries on a 5Gi PVC,
                    # and the tree contains nothing else). Purging it capped subtitle coverage
                    # to a rolling 2h window (why "cached this morning, gone this afternoon")
                    # and its unguarded empty-dir delete raced the extractor's mkdir->copy
                    # (ENOENT "Failed to copy tmp subtitles"). Extractions must persist.
                    # Empty-dir reaping needs the same mtime guard as /.transcode above —
                    # an unguarded `-type d -empty -delete` deletes freshly-mkdir'd dirs
                    # that a process is about to write into.
                    find /.cache -mindepth 1 -type d -empty -mmin +2 -delete 2>/dev/null
                    find /.local -mindepth 1 -type d -empty -mmin +2 -delete 2>/dev/null

                    # Subtitle-extraction STAGING files (SQ-84). Tunarr extracts each
                    # candidate track to /tmp/tmp-<worker>-<rand>-.<ext> (srt and ass
                    # observed) and copies it into the persistent cache only on success.
                    # A failed or killed extraction orphans the staging file and nothing
                    # in Tunarr cleans it up: measured 1,574 files before the first manual
                    # purge.
                    #
                    # This is a RAM leak, not disk noise. /tmp here is a MEMORY-backed
                    # emptyDir (tmpfs, 8Gi, noswap) shared by all three containers, so
                    # unbounded growth ends in OOM rather than ENOSPC.
                    #
                    # +180, NOT +30. Extraction demuxes the WHOLE container to collect
                    # sparse subtitle packets, so runtime scales with file size, not with
                    # subtitle size: an 87.7GB remux ran ~25m before failing, an 83.8GB one
                    # occupied a full hourly batch pass, and a 51.7GB one was still running
                    # at 37m with its staging files still 0 bytes. A 30m threshold would
                    # delete those mid-write and reproduce the ENOENT "Failed to copy tmp
                    # subtitles" race documented above — the very failure this file already
                    # carries a warning about. 3h clears the longest observed run by ~3x and
                    # still bounds growth (days to reach 74MB).
                    #
                    # Scoped to the exact staging pattern, never a bare tmp-* glob: /tmp is
                    # shared with codeserver and apk, whose files must not be touched.
                    # Structurally disjoint from /root/.local/share/tunarr/cache (mounted
                    # separately as icache) — the persistent extraction cache is NEVER
                    # purged here.
                    find /tmp -maxdepth 1 -type f \( -name 'tmp-*-*-.srt' -o -name 'tmp-*-*-.ass' \) -mmin +180 -delete 2>/dev/null

                    # ---- ZOMBIE-TRANSCODE REAPER -------------------------------------
                    # 2026-07-30 incident: Tunarr marked a session "stopped" and shut down
                    # its connection tracker, but the ffmpeg kept transcoding at ~82% CPU
                    # with no viewer. That pinned the node at 96%, which dropped the
                    # longhorn-admission-webhook endpoints, which blocked Longhorn
                    # mutations, which wedged VolSync clones -> stale backups + a faulted
                    # volume. One orphan cascaded into a storage incident.
                    #
                    # DETECTION (no PID namespace needed - sidecars cannot see the main
                    # container's processes): a stream dir still producing .ts segments
                    # (mtime <1m) while its channel uuid is ABSENT from /api/sessions.
                    # Absence is a plain substring test - no JSON parsing to get wrong.
                    #
                    # DELIBERATELY CONSERVATIVE:
                    #  * sessions API unreachable/empty -> do nothing (fail safe)
                    #  * a session that EXISTS with 0 connections is NOT reaped (that is
                    #    the held-tuner case; a paused/buffering client looks identical)
                    #  * requires 3 consecutive checks (~6 min) before acting
                    #  * teardown via Tunarr's own DELETE, never kill -9
                    # A naive signal (per-channel GET returning 404) was measured and
                    # REJECTED: it 404s for healthy sessions too and would kill live streams.
                    # NOTE: every shell variable sigil below is DOUBLED. Flux runs strict
                    # envsubst over this manifest, so a single-sigil shell variable is
                    # treated as a cluster variable and fails the build with
                    # "variable substitution failed: variable not set (strict mode)".
                    # A doubled sigil renders to a single literal one for the shell.
                    # This applies to comments too - do not write a single sigil anywhere.
                    SESS=$$(curl -sf --max-time 10 http://localhost:8000/api/sessions 2>/dev/null)
                    if [ -n "$$SESS" ]; then
                      for d in /.transcode/stream_*/; do
                        [ -d "$$d" ] || continue
                        u=$$(basename "$$d"); u=$${u#stream_}
                        if [ -n "$$(find "$$d" -maxdepth 1 -name '*.ts' -mmin -1 2>/dev/null | head -1)" ]; then
                          if echo "$$SESS" | grep -q "$$u"; then
                            rm -f "/tmp/zombie_$$u"
                          else
                            n=$$(cat "/tmp/zombie_$$u" 2>/dev/null || echo 0); n=$$((n+1))
                            echo "$$n" > "/tmp/zombie_$$u"
                            if [ "$$n" -ge 3 ]; then
                              echo "REAPER: channel $$u producing segments with no session for $$n checks - tearing down"
                              curl -sf -X DELETE --max-time 10 "http://localhost:8000/api/channels/$$u/sessions" >/dev/null 2>&1
                              rm -f "/tmp/zombie_$$u"
                            fi
                          fi
                        else
                          rm -f "/tmp/zombie_$$u"
                        fi
                      done
                    fi
                    sleep 120
                  done
              probes:
                liveness:
                  enabled: false
                readiness:
                  enabled: false
                startup:
                  enabled: false
              resources:
                requests:
                  cpu: 5m
                  memory: 32Mi
                limits:
                  cpu: 50m
                  memory: 64Mi
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                readOnlyRootFilesystem: false
    autoscaling:
      vpa:
        enabled: true
        mode: Auto
    scheduling:
      topologyKey: kubernetes.io/hostname
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: tunarr
              topologyKey: kubernetes.io/hostname
    credentials:
      s3:
        type: s3
        url: ${S3URL}
        bucket: "${S3PREFIX}-tunarr"
        accessKey: ${S3ID}
        secretKey: ${S3KEY}
        encrKey: ${S3KEY}
    service:
      main:
        enabled: true
        type: LoadBalancer
        loadBalancerIP: ${TUNARR_IP}
        annotations:
          metallb.io/loadBalancerIPs: ${TUNARR_IP}
        ports:
          main:
            enabled: true
            port: 8000
            targetPort: 8000
          codeserver:
            enabled: true
            port: 12321
            targetPort: 12321
    ingress:
      main:
        enabled: true
        hosts:
          - host: tunarr.${BASE_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: false
            ingressClassName: internal
          traefik:
            enabled: true
            entrypoints:
              - websecure
            middlewares:
              - name: internal-secure-chain
                namespace: traefik
                expandObjectName: false
          certManager:
            enabled: true
            certificateIssuer: wethecommon-prod-cert
          homepage:
            enabled: true
            icon: https://tunarr.com/assets/tunarr.png
            name: Tunarr
            description: Custom IPTV-like server
            group: Media Players
            widget:
              custom:
                key: ""
              enabled: false
    persistence:
      config:
        enabled: true
        size: 5Gi
        mountPath: /root
        volsync:
          - name: config
            type: restic
            credentials: s3
            src:
              enabled: true
              cacheCapacity: 8Gi
              trigger:
                schedule: "55 10 * * *"
            dest:
              enabled: false
              cacheCapacity: 8Gi
      streams:
        enabled: true
        size: 2Gi
        mountPath: /tunarr/streams
        volsync:
          - name: streams
            type: restic
            credentials: s3
            src:
              enabled: true
              cacheCapacity: 8Gi
              trigger:
                schedule: "16 12 * * *"
            dest:
              enabled: false
              cacheCapacity: 8Gi
      local:
        enabled: true
        size: 5Gi
        mountPath: /root/.local
        volsync:
          - name: local
            type: restic
            credentials: s3
            src:
              enabled: true
              cacheCapacity: 8Gi
              trigger:
                schedule: "47 10 * * *"
            dest:
              enabled: false
              cacheCapacity: 8Gi
      cache:
        enabled: true
        size: 2Gi
        mountPath: /.cache
        # cache-purge sidecar also purges /.cache (30m) — must be mounted there too.
        targetSelector:
          main:
            main: { mountPath: /.cache }
            cache-purge: { mountPath: /.cache }
      local-root:
        enabled: true
        size: 2Gi
        mountPath: /.local
        # cache-purge sidecar also purges /.local (30m) — must be mounted there too.
        targetSelector:
          main:
            main: { mountPath: /.local }
            cache-purge: { mountPath: /.local }
      icache:
        enabled: true
        size: 5Gi
        mountPath: /root/.local/share/tunarr/cache
        # cache-purge sidecar also purges the image cache (120m) — mount there too.
        targetSelector:
          main:
            main: { mountPath: /root/.local/share/tunarr/cache }
            cache-purge: { mountPath: /root/.local/share/tunarr/cache }
      msidx:
        enabled: true
        size: 5Gi
        mountPath: /root/.local/share/tunarr/data.ms
      media:
        enabled: true
        type: nfs
        path: /mnt/Pibbs-Horde/media/data
        server: 192.168.10.123
        mountPath: /media
        mountOptions:
          - nfsvers=4
          - tcp
          - intr
          - hard
          - noatime
          - nodiratime
          - nolock
      movies:
        enabled: true
        type: nfs
        path: /mnt/Pibbs-Horde/media/data/media/movies
        server: 192.168.10.123
        mountPath: /movies
        mountOptions:
          - nfsvers=4
          - tcp
          - intr
          - hard
          - noatime
          - nodiratime
          - nolock
      tv:
        enabled: true
        type: nfs
        path: /mnt/Pibbs-Horde/media/data/media/tv
        server: 192.168.10.123
        mountPath: /tv
        mountOptions:
          - nfsvers=4
          - tcp
          - intr
          - hard
          - noatime
          - nodiratime
          - nolock
      music:
        enabled: true
        type: nfs
        path: /mnt/Pibbs-Horde/media/data/media/music
        server: 192.168.10.123
        mountPath: /music
        mountOptions:
          - nfsvers=4
          - tcp
          - intr
          - hard
          - noatime
          - nodiratime
          - nolock
      xmltv:
        enabled: true
        type: nfs
        path: /mnt/Pibbs-Horde/media/data/app_backups/DizqueTV_Backups/xmltv
        server: 192.168.10.123
        mountPath: /xmltv
        mountOptions:
          - nfsvers=4
          - tcp
          - intr
          - hard
          - noatime
          - nodiratime
          - nolock
      dizquetv:
        enabled: true
        type: nfs
        path: /mnt/Pibbs-Horde/media/data/app_backups/DizqueTV_Backups/.dizquetv
        server: 192.168.10.123
        mountPath: /.dizquetv
        mountOptions:
          - nfsvers=4
          - tcp
          - intr
          - hard
          - noatime
          - nodiratime
          - nolock
      backups:
        enabled: true
        type: nfs
        path: /mnt/Pibbs-Horde/media/data/app_backups/DizqueTV_Backups/backups
        server: 192.168.10.123
        mountPath: /backups
        mountOptions:
          - nfsvers=4
          - tcp
          - intr
          - hard
          - noatime
          - nodiratime
          - nolock
      transcoding:
        enabled: true
        size: 5Gi
        mountPath: /.transcode
        # Mount into the cache-purge sidecar too (chart default is main-only). Without
        # this, the sidecar's `find /.transcode -mmin +2 -delete` loop ran against its
        # OWN empty ephemeral dir → purged nothing → PVC filled to 100% (root-caused
        # 2026-07-28; verified via helm-render that targetSelector mounts into both).
        targetSelector:
          main:
            main: { mountPath: /.transcode }
            cache-purge: { mountPath: /.transcode }
    securityContext:
      container:
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        readOnlyRootFilesystem: false
        privileged: true
      pod:
        fsGroup: 0
    resources:
      requests:
        memory: 2Gi
        cpu: 500m
      limits:
        memory: 8Gi
        cpu: "4"
    podOptions:
      hostUsers: true
    addons:
      codeserver:
        enabled: true
        # Right-sized 2026-07-30 after this addon made tunarr UNSCHEDULABLE.
        # It was inheriting a 500m/2Gi default - 10-20x every other codeserver in
        # the cluster (homepage 10m, notifiarr/recyclarr/tautulli 25m, sabnzbd 50m)
        # and 2/3 of tunarr's entire 755m request, for a browser IDE that idles.
        # With the node at 97% CPU requests, that surplus alone blocked scheduling:
        # the old pod released its slot, the new one could never claim one, and
        # Tunarr was hard-down until this was cut. Keep it modest - it is an
        # occasional-use editor, and CPU requests are a GUARANTEED reservation
        # held whether or not the process is doing anything.
        # NOTE: must be under `container:` - the chart does
        # `set podSpec.containers "codeserver" $codeSrv.container`
        # (common/templates/addons/_codeserver.tpl:21), so `resources:` one level
        # up is silently IGNORED. Verified by helm-render, not assumed.
        container:
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
        service:
          enabled: false # Don't create a separate service
        ingress:
          enabled: true
          targetSelector:
            main: codeserver
          integrations:
            nginx:
              enabled: false
              ingressClassName: internal
            traefik:
              enabled: true
              entrypoints:
                - websecure
            certManager:
              enabled: true
              certificateIssuer: wethecommon-prod-cert
          hosts:
            - host: tunarr-code.${BASE_DOMAIN}
              paths:
                - path: /
                  pathType: Prefix
