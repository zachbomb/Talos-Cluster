apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flaresolverr
  namespace: media
spec:
  interval: 15m
  timeout: 20m
  releaseName: flaresolverr
  chart:
    spec:
      # renovate: datasource=docker depName=oci.trueforge.org/truecharts/flaresolverr
      chart: flaresolverr
      version: 17.11.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    TZ: America/Los_Angeles

    credentials:
      s3:
        type: s3
        url: ${S3URL}
        bucket: "${S3PREFIX}-flaresolverr"
        accessKey: ${S3ID}
        secretKey: ${S3KEY}
        encrKey: ${S3KEY}

    service:
      main:
        enabled: true
        type: LoadBalancer
        loadBalancerIP: ${FLARESOLVERR_IP}
        annotations:
          metallb.io/loadBalancerIPs: ${FLARESOLVERR_IP}
        ports:
          main:
            enabled: true
            port: 8191

    persistence:
      # 2026-10-01 (SQ-177): /tmp is TrueCharts' default medium:Memory emptyDir, charged to
      # the 1Gi memory limit and kept across container restarts. Orphaned Chromium and
      # undetected-chromedriver profiles (tmpXXXX + org.chromium.Chromium.*) piled up
      # there: 7 OOMKills in 4.7d with /tmp at 243MB+ and growing. Working-set graphs
      # can't see tmpfs. Disk-backed instead, capped so it can't fill node ephemeral
      # storage: hitting the cap evicts the pod, which recreates /tmp empty.
      tmp:
        enabled: true
        type: emptyDir
        medium: ""
        size: 2Gi
        mountPath: /tmp
      config:
        enabled: true
        size: 2Gi
        mountPath: /config
        volsync:
          - name: config
            type: restic
            credentials: s3
            dest:
              enabled: true
              cacheCapacity: 2Gi
            src:
              enabled: true
              cacheCapacity: 2Gi
              trigger:
                schedule: "37 9 * * *"

    resources:
      requests:
        memory: 256Mi
        cpu: 10m
      limits:
        memory: 1Gi
        cpu: 1000m

    autoscaling:
      vpa:
        enabled: false

    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                BROWSER_TIMEOUT: "240000"
                HEADLESS: "true"
                LOG_LEVEL: "info"
                LOG_HTML: "false"
                CAPTCHA_SOLVER: "none"
              probes:
                liveness:
                  enabled: false
                readiness:
                  enabled: false
                startup:
                  enabled: false
