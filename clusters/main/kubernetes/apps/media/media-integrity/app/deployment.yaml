---
# Media content-integrity exporter (SQ-48).
#
# WHY THIS EXISTS: on 2026-08-07 a scan looking for something else found 17
# movie files that could not be demuxed at all - several 10-16 GB, unplayable
# since April 2025. Radarr reported hasFile=true, quality Bluray-1080p,
# monitored, for every one; Plex and Emby listed them as available. The whole
# stack tracks PRESENCE and METADATA and nothing opens a file, so no dashboard
# or alert could have caught it.
#
# IMAGE: the probe needs python3 AND ffprobe. Rather than apt-installing at
# runtime (fragile, repeated on every restart), a static ffprobe is copied in
# by an initContainer from mwader/static-ffmpeg and put on PATH.
#
# The media share is mounted READ-ONLY. This process must never be able to
# modify the library it is auditing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-integrity
  namespace: media
  labels:
    app.kubernetes.io/name: media-integrity
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: media-integrity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-integrity
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fetch-ffprobe
          image: mwader/static-ffmpeg:7.1
          command: ["/bin/sh", "-c"]
          args:
            - cp /ffprobe /bin-shared/ffprobe && chmod 0755 /bin-shared/ffprobe
          volumeMounts:
            - name: binshared
              mountPath: /bin-shared
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      containers:
        - name: exporter
          image: python:3.12-slim
          command: ["python3"]
          args:
            - /probe/integrity_probe.py
            # One process covers every library. A container per library would
            # multiply the scrape surface and make "which library stopped
            # being scanned" hard to see - the exact question this component
            # must always be able to answer.
            - --lib=movies=/media/movies
            - --lib=tv=/media/tv
            # Music is three SEPARATE libraries, one per Lidarr instance, and
            # they must stay separate: a single "music" number would hide
            # which one degraded.
            - --lib=music_main=/media/music/Main
            - --lib=music_flac=/media/music/FLAC
            - --lib=music_liz=/media/music/Liz iTunes
            # NOT scanned, on purpose:
            #   music/RoonBackups - Roon backup data (_roon_backup_root_,
            #     UUID dirs), not playable media. Probing it would report
            #     permanent corruption.
            #   music/SuperSync   - an iTunes-style library no Lidarr manages.
            #     Real media, but adding it implies it should be tracked;
            #     that is an open decision, not an oversight.
            - --port=9838
            # Daily. A full pass is ~4.5h (movies ~10m, tv ~75m at 8,276
            # files, music ~3h at 111k). A 6h interval would leave it scanning
            # almost continuously against a node that already runs at 90%+ CPU.
            - --interval=86400
            - --list                 # offending paths to stderr for the log
          env:
            - name: PATH
              value: /bin-shared:/usr/local/bin:/usr/bin:/bin
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: metrics
              containerPort: 9838
          volumeMounts:
            - name: probe
              mountPath: /probe
              readOnly: true
            - name: binshared
              mountPath: /bin-shared
              readOnly: true
            - name: media
              mountPath: /media
              readOnly: true
          # Deliberately NOT BestEffort. A resources:{} pod here would be first
          # to be evicted under pressure and, worse, could trip a probe on
          # healthy infrastructure - the recurring failure class documented for
          # this cluster. No CPU limit, only a request.
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          startupProbe:
            httpGet: { path: /, port: metrics }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /, port: metrics }
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: probe
          configMap:
            name: media-integrity-probe
        - name: binshared
          emptyDir: {}
        - name: media
          persistentVolumeClaim:
            claimName: media-nfs-pvc
            readOnly: true
