---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
  namespace: media
spec:
  interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  chart:
    spec:
      chart: plex
      version: 22.10.5
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    credentials:
      s3:
        type: s3
        url: ${S3URL}
        bucket: "${S3PREFIX}-plex"
        accessKey: ${S3ID}
        secretKey: ${S3KEY}
        encrKey: ${S3KEY}
    TZ: America/Los_Angeles
    image:
      repository: ghcr.io/home-operations/plex
      pullPolicy: IfNotPresent
      tag: 1.43.4.10903
      existingPullSecret: ""
    persistence:
      config:
        size: 25Gi
        volsync:
          - name: config
            type: restic
            credentials: s3
            dest:
              enabled: true
              cacheCapacity: 5Gi
            src:
              enabled: true
              cacheCapacity: 5Gi
              trigger:
                schedule: "0 6 * * *"
      media:
        enabled: true
        type: nfs
        path: /mnt/Pibbs-Horde/media/data
        server: 192.168.10.123
        mountPath: /media
        mountOptions:
          - nfsvers=4
          - tcp
          - intr
          - hard
          - noatime
          - nodiratime
          - nolock
      movies:
        enabled: true
        type: nfs
        path: /mnt/Pibbs-Horde/media/data/media/movies
        server: 192.168.10.123
        mountPath: /movies
        mountOptions:
          - nfsvers=4
          - tcp
          - intr
          - hard
          - noatime
          - nodiratime
          - nolock
      tv:
        enabled: true
        type: nfs
        path: /mnt/Pibbs-Horde/media/data/media/tv
        server: 192.168.10.123
        mountPath: /tv
        mountOptions:
          - nfsvers=4
          - tcp
          - intr
          - hard
          - noatime
          - nodiratime
          - nolock
      music:
        enabled: true
        type: nfs
        path: /mnt/Pibbs-Horde/media/data/media/music
        server: 192.168.10.123
        mountPath: /music
        mountOptions:
          - nfsvers=4
          - tcp
          - intr
          - hard
          - noatime
          - nodiratime
          - nolock
      downloads:
        enabled: true
        type: nfs
        path: /mnt/Pibbs-Horde/media/data/usenet
        server: 192.168.10.123
        mountPath: /usenet
        mountOptions:
          - nfsvers=4
          - tcp
          - intr
          - hard
          - noatime
          - nodiratime
          - nolock
      # Live TV hardware decode (see plex-transcoder-wrap.sh). Names are kept short
      # because of the TrueCharts ≤63-byte label limit.
      pmscopy:
        enabled: true
        type: emptyDir
        targetSelector:
          main:
            main:
              mountPath: /opt/pmscopy
            pmscopy:
              mountPath: /opt/pmscopy
      txwrap:
        enabled: true
        type: configmap
        objectName: plex-transcoder-wrap
        expandObjectName: false
        defaultMode: "0755"
        mountPath: /usr/lib/plexmediaserver/Plex Transcoder
        subPath: plex-transcoder-wrap.sh
        readOnly: true
      backup:
        enabled: true
        size: 5Gi
        mountPath: /config/Backups
        volsync:
          - name: backup
            type: restic
            credentials: s3
            dest:
              enabled: true
              cacheCapacity: 3Gi
            src:
              enabled: true
              cacheCapacity: 3Gi
              trigger:
                schedule: "4 10 * * *"
    plex:
      additionalAdvertiseURL: ""
      disableGDM: false
      requireHTTPS: false
      serverIP: ${PLEX_IP}
    securityContext:
      container:
        runAsUser: 1000
        runAsGroup: 1000
        UMASK: "0022"
      pod:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    ingress:
      main:
        enabled: true
        hosts:
          - host: plex.${BASE_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: false
            ingressClassName: internal
          traefik:
            enabled: true
            entrypoints:
              - websecure
          certManager:
            enabled: true
            certificateIssuer: wethecommon-prod-cert
          homepage:
            enabled: true
            name: Plex
            description: Media Player
            group: Media Players
            widget:
              enabled: true
              custom:
                key: ${PLEX_API}
    service:
      main:
        enabled: true
        type: LoadBalancer
        loadBalancerIP: ${PLEX_IP}
        annotations:
          metallb.io/loadBalancerIPs: ${PLEX_IP}
        ports:
          main:
            enabled: true
            port: 32400
            targetPort: 32400
            protocol: http
    workload:
      main:
        podSpec:
          initContainers:
            # Live TV hardware decode (2026-09-28): copies the Plex install tree out
            # of THIS pod's image on every start, so the real transcoder the wrapper
            # execs always matches the running PMS version. See
            # plex-transcoder-wrap.sh and the pmscopy/txwrap persistence below.
            pmscopy:
              enabled: true
              type: init
              imageSelector: image
              command:
                - /bin/sh
                - -c
                - >-
                  set -e;
                  cp -a /usr/lib/plexmediaserver /opt/pmscopy/pms;
                  test -x "/opt/pmscopy/pms/Plex Transcoder";
                  echo "pmscopy ok"
          containers:
            main:
              resources:
                requests:
                  memory: 2Gi
                  # Right-sized 2026-07-21: reserved 500m, used ~7m idle; HW transcode was
                  # assumed to run on the iGPU.
                  # 2026-09-25: 250m -> 1000m. That assumption fails for Live TV: the Plex
                  # tvOS app sends directPlay=0&directStream=0 for Live TV regardless of its
                  # settings, and PMS DECODES in software ("no hardware decode accelerator
                  # found"; only the encode is VAAPI). Under node contention the request is
                  # the CFS weight: at 250m the Apple TV re-encode ran 0.1-0.4x (stutter).
                  # Same fix as Tunarr's 250m -> 1000m (0.73x -> 1.00x). Node requests
                  # 83% -> ~91%, under the ~97% exhaustion line.
                  cpu: 1000m
                limits:
                  memory: 8Gi
                  cpu: "4"
                  gpu.intel.com/i915: 1
              probes:
                startup:
                  enabled: true
                  type: http
                  path: /identity
                  port: 32400
                  spec:
                    initialDelaySeconds: 30
                    periodSeconds: 10
                    failureThreshold: 90
                    timeoutSeconds: 5
                liveness:
                  enabled: true
                  type: http
                  path: /identity
                  port: 32400
                  spec:
                    initialDelaySeconds: 30
                    periodSeconds: 30
                    failureThreshold: 10
                    timeoutSeconds: 10
                readiness:
                  enabled: true
                  type: http
                  path: /identity
                  port: 32400
                  spec:
                    initialDelaySeconds: 30
                    periodSeconds: 15
                    failureThreshold: 10
                    timeoutSeconds: 10
        replicas: 1
    scheduling:
      topologyKey: kubernetes.io/hostname
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: plex
              topologyKey: kubernetes.io/hostname
    resources:
      requests:
        memory: 2Gi
        cpu: 1000m  # 2026-09-25: was 250m; see container-level note (Live TV sw decode)
      limits:
        memory: 8Gi
        cpu: "4"
