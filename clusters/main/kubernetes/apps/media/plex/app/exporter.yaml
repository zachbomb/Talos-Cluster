---
# Standalone Plex metrics exporter — decoupled from the plex pod (see
# reference_exportarr_metrics_gotchas). Go-based jsclayton/prometheus-plex-exporter
# (the Ruby axsuul image ships an ARM-only Gemfile.lock, broken on this x86_64 node).
# Talks to PMS :32400 with ${PLEX_API}; serves /metrics on :9000. Only latest/main
# tags upstream → digest-pinned.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex-exporter
  namespace: media
  labels:
    app.kubernetes.io/name: plex-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plex-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plex-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          # renovate: datasource=docker depName=ghcr.io/jsclayton/prometheus-plex-exporter
          image: ghcr.io/jsclayton/prometheus-plex-exporter:latest@sha256:18ef1b2197efbcb75bd7276380955760995f10a9fbe55106809a6fcff91c2940
          env:
            - name: PLEX_SERVER
              value: http://plex:32400
            - name: PLEX_TOKEN
              value: ${PLEX_API}
          ports:
            - name: metrics
              containerPort: 9000
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: plex-exporter
  namespace: media
  labels:
    app.kubernetes.io/name: plex-exporter
spec:
  selector:
    app.kubernetes.io/name: plex-exporter
  ports:
    - name: metrics
      port: 9000
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: plex-exporter
  namespace: media
  labels:
    app.kubernetes.io/name: plex-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: plex-exporter
  endpoints:
    - port: metrics
      interval: 90s
      scrapeTimeout: 45s
