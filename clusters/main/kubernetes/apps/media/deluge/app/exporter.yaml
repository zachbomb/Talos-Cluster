---
# Standalone deluge metrics exporter — decoupled from deluge (see
# reference_exportarr_metrics_gotchas). ngosang/deluge-exporter talks to the Deluge
# Web UI (:8112) with the web password (${DELUGE_PASSWORD}); serves /metrics on :8011.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deluge-exporter
  namespace: media
  labels:
    app.kubernetes.io/name: deluge-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: deluge-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deluge-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          # renovate: datasource=docker depName=ngosang/deluge-exporter
          image: docker.io/ngosang/deluge-exporter:1.0.2@sha256:cf4f28424ff921bd86ef4729f2d505ebe077b7701389316ee54f0e3523f50599
          env:
            - name: DELUGE_URL
              value: http://deluge:8112
            - name: DELUGE_PASSWORD
              value: ${DELUGE_PASSWORD}
            - name: LISTEN_PORT
              value: "8011"
          ports:
            - name: metrics
              containerPort: 8011
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 96Mi
---
apiVersion: v1
kind: Service
metadata:
  name: deluge-exporter
  namespace: media
  labels:
    app.kubernetes.io/name: deluge-exporter
spec:
  selector:
    app.kubernetes.io/name: deluge-exporter
  ports:
    - name: metrics
      port: 8011
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: deluge-exporter
  namespace: media
  labels:
    app.kubernetes.io/name: deluge-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: deluge-exporter
  endpoints:
    - port: metrics
      interval: 60s
      scrapeTimeout: 30s
