apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: deluge
  namespace: media
spec:
  interval: 15m
  timeout: 30m
  releaseName: deluge
  chart:
    spec:
      chart: deluge
      # renovate: datasource=helm depName=deluge registryUrl=oci://oci.trueforge.org/truecharts
      version: 22.8.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    TZ: America/Los_Angeles
    credentials:
      s3:
        type: s3
        url: ${S3URL}
        bucket: "${S3PREFIX}-deluge"
        accessKey: ${S3ID}
        secretKey: ${S3KEY}
        encrKey: ${S3KEY}
    ingress:
      main:
        enabled: true
        hosts:
          - host: deluge.${BASE_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: false
            ingressClassName: internal
          traefik:
            enabled: true
            entrypoints:
              - websecure
            middlewares:
              - name: internal-secure-chain
                namespace: traefik
                expandObjectName: false
          certManager:
            enabled: true
            certificateIssuer: wethecommon-prod-cert
          homepage:
            enabled: true
            name: Deluge
            group: Media Downloaders
            description: Torrent Downloader
            icon: ""
            widget:
              enabled: true
              custom:
                url: "http://${DELUGE_IP}:8112"
                password: ${DELUGE_PASSWORD}
    service:
      main:
        enabled: true
        type: LoadBalancer
        loadBalancerIP: ${DELUGE_IP}
        annotations:
          metallb.io/loadBalancerIPs: ${DELUGE_IP}
          metallb.io/allow-shared-ip: "deluge"
        ports:
          main:
            enabled: true
            port: 8112
            protocol: http
      torrent:
        enabled: true
        type: LoadBalancer
        loadBalancerIP: ${DELUGE_IP}
        annotations:
          metallb.io/loadBalancerIPs: ${DELUGE_IP}
          metallb.io/allow-shared-ip: "deluge"
    persistence:
      config:
        enabled: true
        size: 2Gi
        mountPath: /config
        volsync:
          - name: config
            type: restic
            credentials: s3
            dest:
              enabled: false
              cacheCapacity: 2Gi
            src:
              enabled: true
              cacheCapacity: 2Gi
              trigger:
                schedule: "8 0 * * *"
      media:
        enabled: true
        type: nfs
        server: 192.168.10.123
        path: /mnt/Pibbs-Horde/media/data
        mountPath: /media
        mountOptions:
          - nfsvers=4
          - tcp
          - intr
          - hard
          - noatime
          - nodiratime
          - nolock
      movies:
        enabled: true
        type: nfs
        server: 192.168.10.123
        path: /mnt/Pibbs-Horde/media/data/media/movies
        mountPath: /movies
        mountOptions:
          - nfsvers=4
          - tcp
          - intr
          - hard
          - noatime
          - nodiratime
          - nolock
      tv:
        enabled: true
        type: nfs
        server: 192.168.10.123
        path: /mnt/Pibbs-Horde/media/data/media/tv
        mountPath: /tv
        mountOptions:
          - nfsvers=4
          - tcp
          - intr
          - hard
          - noatime
          - nodiratime
          - nolock
      music:
        enabled: true
        type: nfs
        server: 192.168.10.123
        path: /mnt/Pibbs-Horde/media/data/media/music
        mountPath: /music
        mountOptions:
          - nfsvers=4
          - tcp
          - intr
          - hard
          - noatime
          - nodiratime
          - nolock
      downloads:
        enabled: true
        type: nfs
        server: 192.168.10.123
        path: /mnt/Pibbs-Horde/media/data/torrents
        mountPath: /torrents
        mountOptions:
          - nfsvers=4
          - tcp
          - intr
          - hard
          - noatime
          - nodiratime
          - nolock
    addons:
      gluetun:
        enabled: true
        container:
          env:
            VPN_SERVICE_PROVIDER: nordvpn
            VPN_TYPE: openvpn
            OPENVPN_USER: ${NORD_VPN_USER}
            OPENVPN_PASSWORD: ${NORD_VPN_PASS}
            # Pinned to specific US servers rather than SERVER_COUNTRIES purely for
            # stability - a fixed set gluetun can fail over between. All five are in
            # gluetun's bundled servers.json.
            #
            # RETRACTION: an earlier revision of this comment claimed NordVPN
            # "silently drops peer traffic" on non-P2P servers and presented this
            # pin as the fix for zero-peer downloads. That was WRONG on both counts.
            # SQ-64 proved the real cause was a per-torrent save_path of /downloads
            # (a directory that does not exist and that deluged, uid 568, cannot
            # create): libtorrent's first write fails, it sets upload_mode=True, and
            # a torrent in upload_mode never expresses interest in any peer. Fixed
            # by core.move_storage to /torrents - peers went 0 -> 6 and throughput
            # 0 -> 688 K/s immediately, with no VPN change at all.
            #
            # Also disproven by SQ-64: NordVPN does NOT block P2P here. A standalone
            # libtorrent session in this same pod, through this same tunnel, pulled
            # 210 MB in 4 minutes. NordVPN has retired the P2P server category -
            # "All standard NordVPN servers now support P2P activities"
            # (support.nordvpn.com/hc/en-us/articles/45840292778897).
            #
            # Still true: NordVPN offers no port forwarding on any protocol, so there
            # is no inbound peer port. That limits seeding and hard-to-reach peers,
            # but SQ-64 measured downloads at 0.1-2 MB/s without one, so it does not
            # prevent downloading. See SQ-63 if torrents become a priority.
            SERVER_HOSTNAMES: "us5099.nordvpn.com,us5100.nordvpn.com,us5102.nordvpn.com,us5103.nordvpn.com,us5104.nordvpn.com"
            FIREWALL: "on"
            FIREWALL_OUTBOUND_SUBNETS: "192.168.10.0/24"
            # The chart leaves this "on", which makes gluetun log:
            #   "keeping the default container nameservers, this will likely leak
            #    DNS traffic outside the VPN tunnel"
            # A torrent client behind a kill switch resolving tracker names outside
            # the tunnel defeats the point of the tunnel. Off = gluetun's own DoT
            # resolver inside the VPN. Cluster-local traffic is unaffected: the chart
            # already adds the pod/service CIDRs to FIREWALL_OUTBOUND_SUBNETS.
            DNS_KEEP_NAMESERVER: "off"
          resources:
            limits:
              truecharts.org/tun: 1
        killSwitch: true
        excludedNetworks_IPv4:
          - 192.168.10.0/24
    resources:
      requests:
        memory: 256Mi
        cpu: 10m
      limits:
        memory: 1Gi
        cpu: 500m
    autoscaling:
      vpa:
        enabled: false
    securityContext:
      container:
        UMASK: "0022"
      pod:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    workload:
      main:
        podSpec:
          containers:
            main:
              probes:
                liveness:
                  enabled: false
                readiness:
                  enabled: false
                startup:
                  enabled: false
