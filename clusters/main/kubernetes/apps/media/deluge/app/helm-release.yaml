apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: deluge
  namespace: media
spec:
  interval: 15m
  timeout: 30m
  releaseName: deluge
  chart:
    spec:
      chart: deluge
      # renovate: datasource=helm depName=deluge registryUrl=oci://oci.trueforge.org/truecharts
      version: 22.7.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    TZ: America/Los_Angeles
    credentials:
      s3:
        type: s3
        url: ${S3URL}
        bucket: "${S3PREFIX}-deluge"
        accessKey: ${S3ID}
        secretKey: ${S3KEY}
        encrKey: ${S3KEY}
    ingress:
      main:
        enabled: true
        hosts:
          - host: deluge.${BASE_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
        integrations:
          nginx:
            enabled: false
            ingressClassName: internal
          traefik:
            enabled: true
            entrypoints:
              - websecure
            middlewares:
              - name: internal-secure-chain
                namespace: traefik
                expandObjectName: false
          certManager:
            enabled: true
            certificateIssuer: wethecommon-prod-cert
          homepage:
            enabled: true
            name: Deluge
            group: Media Downloaders
            description: Torrent Downloader
            icon: ""
            widget:
              enabled: true
              custom:
                url: "http://${DELUGE_IP}:8112"
                password: ${DELUGE_PASSWORD}
    service:
      main:
        enabled: true
        type: LoadBalancer
        loadBalancerIP: ${DELUGE_IP}
        annotations:
          metallb.io/loadBalancerIPs: ${DELUGE_IP}
          metallb.io/allow-shared-ip: "deluge"
        ports:
          main:
            enabled: true
            port: 8112
            protocol: http
      torrent:
        enabled: true
        type: LoadBalancer
        loadBalancerIP: ${DELUGE_IP}
        annotations:
          metallb.io/loadBalancerIPs: ${DELUGE_IP}
          metallb.io/allow-shared-ip: "deluge"
    persistence:
      config:
        enabled: true
        size: 2Gi
        mountPath: /config
        volsync:
          - name: config
            type: restic
            credentials: s3
            dest:
              enabled: false
              cacheCapacity: 2Gi
            src:
              enabled: true
              cacheCapacity: 2Gi
              trigger:
                schedule: "8 0 * * *"
      media:
        enabled: true
        type: nfs
        server: 192.168.10.123
        path: /mnt/Pibbs-Horde/media/data
        mountPath: /media
        mountOptions:
          - nfsvers=4
          - tcp
          - intr
          - hard
          - noatime
          - nodiratime
          - nolock
      movies:
        enabled: true
        type: nfs
        server: 192.168.10.123
        path: /mnt/Pibbs-Horde/media/data/media/movies
        mountPath: /movies
        mountOptions:
          - nfsvers=4
          - tcp
          - intr
          - hard
          - noatime
          - nodiratime
          - nolock
      tv:
        enabled: true
        type: nfs
        server: 192.168.10.123
        path: /mnt/Pibbs-Horde/media/data/media/tv
        mountPath: /tv
        mountOptions:
          - nfsvers=4
          - tcp
          - intr
          - hard
          - noatime
          - nodiratime
          - nolock
      music:
        enabled: true
        type: nfs
        server: 192.168.10.123
        path: /mnt/Pibbs-Horde/media/data/media/music
        mountPath: /music
        mountOptions:
          - nfsvers=4
          - tcp
          - intr
          - hard
          - noatime
          - nodiratime
          - nolock
      downloads:
        enabled: true
        type: nfs
        server: 192.168.10.123
        path: /mnt/Pibbs-Horde/media/data/torrents
        mountPath: /torrents
        mountOptions:
          - nfsvers=4
          - tcp
          - intr
          - hard
          - noatime
          - nodiratime
          - nolock
    addons:
      gluetun:
        enabled: true
        container:
          env:
            VPN_SERVICE_PROVIDER: nordvpn
            # AUTH_FAILED since 2026-08-08 10:26 - see SQ-63. NordVPN moved manual/
            # OpenVPN setup from account username+password to SERVICE CREDENTIALS,
            # so the NORD_VPN_USER / NORD_VPN_PASS values are rejected and gluetun
            # sits in an auth-fail -> healthcheck-fail -> restart loop.
            # (Those names are written as bare words, not as substitution refs: Flux runs
            #  envsubst over the whole rendered manifest, comments included, so the
            #  substituted form here would bake the real credentials into the applied
            #  resource where `kubectl get helmrelease` would expose them.)
            #
            # The loop is INVISIBLE to Kubernetes: both containers stay ready=true
            # with 0 restarts while every torrent stalls. Measured cost: King of the
            # Hill S15 moved 74.5MB -> 76.2MB in 9h17m while Deluge displayed a
            # 2.2 M/s rate. An instantaneous rate is not evidence of progress.
            #
            # NordVPN also offers NO port forwarding on any protocol, so torrents on
            # low-seeded material stay unviable here even once auth is fixed.
            # Options are recorded in SQ-63: service credentials, WireGuard, or a
            # provider that forwards ports.
            VPN_TYPE: openvpn
            OPENVPN_USER: ${NORD_VPN_USER}
            OPENVPN_PASSWORD: ${NORD_VPN_PASS}
            SERVER_COUNTRIES: "United States"
            FIREWALL: "on"
            FIREWALL_OUTBOUND_SUBNETS: "192.168.10.0/24"
            # The chart leaves this "on", which makes gluetun log:
            #   "keeping the default container nameservers, this will likely leak
            #    DNS traffic outside the VPN tunnel"
            # A torrent client behind a kill switch resolving tracker names outside
            # the tunnel defeats the point of the tunnel. Off = gluetun's own DoT
            # resolver inside the VPN. Cluster-local traffic is unaffected: the chart
            # already adds the pod/service CIDRs to FIREWALL_OUTBOUND_SUBNETS.
            DNS_KEEP_NAMESERVER: "off"
          resources:
            limits:
              truecharts.org/tun: 1
        killSwitch: true
        excludedNetworks_IPv4:
          - 192.168.10.0/24
    resources:
      requests:
        memory: 256Mi
        cpu: 10m
      limits:
        memory: 1Gi
        cpu: 500m
    autoscaling:
      vpa:
        enabled: false
    securityContext:
      container:
        UMASK: "0022"
      pod:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    workload:
      main:
        podSpec:
          containers:
            main:
              probes:
                liveness:
                  enabled: false
                readiness:
                  enabled: false
                startup:
                  enabled: false
