---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubernetes-dashboard
  namespace: kubernetes-dashboard
spec:
  interval: 15m
  chart:
    spec:
      chart: kubernetes-dashboard
      version: 4.10.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    service:
      main:
        type: LoadBalancer
        loadBalancerIP: ${DASHBOARD_IP}
        annotations:
          metallb.io/loadBalancerIPs: ${DASHBOARD_IP}
        ports:
          main:
            port: 80

    workload:
      main:
        enabled: true
        podSpec:
          hostUsers: true
      web:
        enabled: true
        podSpec:
          hostUsers: true
      api:
        enabled: true
        podSpec:
          hostUsers: true
      auth:
        enabled: true
        podSpec:
          hostUsers: true
      scraper:
        enabled: true
        podSpec:
          hostUsers: true

    securityContext:
      readOnlyRootFilesystem: false

    autoscaling:
      vpa:
        enabled: false

    resources:
      requests:
        memory: 64Mi
        cpu: 10m
      limits:
        memory: 256Mi
        cpu: 500m
    podOptions:
      hostUsers: true

    # 2026-09-09: kong is a SUBCHART -- the top-level `resources:` above applies
    # to this chart's own workloads (main/web/api/auth/scraper) and never
    # reaches it, so the kong proxy pod was the last BestEffort pod here. It had
    # 654 restarts, the highest count in the cluster; they all stopped the
    # moment a leaking kubelet was restarted, so it was being reaped under node
    # memory pressure (BestEffort = highest oom_score_adj), not failing on its
    # own. Same class as the six pods fixed 2026-08-03/04.
    #
    # Verified with `helm template -f` that `kong.resources` renders onto the
    # kong deployment's container before committing -- the top-level block does
    # not, which is exactly why this was missed.
    #
    # Requests only: no cpu limit (throttling trips probes) and no memory limit
    # (would add an OOMKill risk that does not exist today). Kong runs with
    # nginx_worker_processes: 1 here, so it is light.
    kong:
      resources:
        requests:
          cpu: 25m
          memory: 128Mi