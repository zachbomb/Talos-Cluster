---
# Periodic fstrim of the Talos EPHEMERAL (/var) filesystem on the single node.
#
# WHY (#158 disk-move, 2026-07-27): etcd was moved off the dying QLC pool onto a
# 444 GB Solidigm pool via a Proxmox-level `zfs send`. The Talos system disk is now a
# 2 TB **thin** zvol on that 444 GB pool, and Talos does NOT issue discard/TRIM on
# EPHEMERAL (proven: the zvol had accumulated ~1 TB of freed-but-referenced blocks
# before the move). The kubelet age-GCs unused images (imageMaximumGCAge=168h in
# patches/all.yaml), which frees blocks in xfs — but without TRIM those blocks are
# never returned to ZFS, so the thin pool creeps toward FULL. If it fills, ZFS can't
# allocate and etcd writes fail — a worse outage than #158 itself.
#
# This CronJob discards freed blocks back to ZFS so the pool self-manages, making the
# kubelet's image GC actually reclaim pool space. Mechanism verified 2026-07-27 (a
# privileged busybox pod fstrim'd /var cleanly on Talos). Runs in kube-system, which
# is Kyverno-excluded (resourceFilters) and PSA-privileged-capable.
# See docs/runbooks/2026-07-27-etcd-solidigm-diskmove.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: node-fstrim
  namespace: kube-system
  labels:
    app.kubernetes.io/name: node-fstrim
spec:
  schedule: "23 5 * * *"          # daily 05:23 — off-peak, after the VolSync backup window
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: node-fstrim
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          tolerations:
            - operator: Exists            # single control-plane node
          containers:
            - name: fstrim
              # renovate: datasource=docker depName=busybox
              image: busybox:1.37.0
              command: ["sh", "-c", "fstrim -v /host-var"]
              securityContext:
                privileged: true          # FITRIM ioctl needs CAP_SYS_ADMIN
                runAsUser: 0
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
              volumeMounts:
                - name: var
                  mountPath: /host-var
          volumes:
            - name: var
              hostPath:
                path: /var
                type: Directory
