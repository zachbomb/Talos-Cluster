---
# Periodic fstrim of the Talos EPHEMERAL (/var) filesystem on the single node.
#
# WHY (#158 disk-move, 2026-07-27): etcd was moved off the dying QLC pool onto a
# 444 GB Solidigm pool via a Proxmox-level `zfs send`. The Talos system disk is now a
# 2 TB **thin** zvol on that 444 GB pool, and Talos does NOT issue discard/TRIM on
# EPHEMERAL (proven: the zvol had accumulated ~1 TB of freed-but-referenced blocks
# before the move). The kubelet age-GCs unused images (imageMaximumGCAge=168h in
# patches/all.yaml), which frees blocks in xfs — but without TRIM those blocks are
# never returned to ZFS, so the thin pool creeps toward FULL. If it fills, ZFS can't
# allocate and etcd writes fail — a worse outage than #158 itself.
#
# WHY (#158 disk-move): the system disk is a thin zvol on the 444GB Solidigm pool, and
# Talos doesn't auto-discard EPHEMERAL, so the kubelet's image GC frees xfs blocks that
# need an explicit fstrim to return to ZFS. VERIFIED EFFECTIVE 2026-07-27: fstrim DOES
# reclaim to the zvol (a run took the pool 203→194G) — the discard path works.
# NOTE: zvol volblocksize=16K vs xfs 4K leaves a FIXED ~35%-of-data fragmentation floor
# fstrim can't reclaim (inherent, non-growing — not a leak).
# ⚠️ CRITICAL LESSON (the acute bloat that triggered the whole 2026-07-27 audit): a
# LEFTOVER `@migrate` zfs snapshot from the send/recv pinned 185G of freed blocks (pool
# stuck at 87% despite only 144G real data). `zfs destroy solidigm/vm-105-disk-0@migrate`
# dropped it to 43% instantly. ALWAYS destroy the @migrate snapshot after a send-based
# disk move (now in the disk-move runbook Phase 5). Snapshots pin freed blocks — check
# `zfs list -t snapshot` BEFORE diagnosing any "discard/reclaim" problem.
# Runs in kube-system (Kyverno-excluded + PSA-privileged-capable).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: node-fstrim
  namespace: kube-system
  labels:
    app.kubernetes.io/name: node-fstrim
spec:
  schedule: "15 13 * * *"         # daily 13:15 UTC (06:15 PT) — after the VolSync
                                  # backup window (06:00-12:48 UTC). fstrim issues discards
                                  # across every Longhorn volume; overlapping the movers puts
                                  # heavy I/O on the single SSD they already saturate.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: node-fstrim
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          tolerations:
            - operator: Exists            # single control-plane node
          containers:
            - name: fstrim
              # renovate: datasource=docker depName=busybox
              image: busybox:1.37.0
              command: ["sh", "-c", "fstrim -v /host-var"]
              securityContext:
                privileged: true          # FITRIM ioctl needs CAP_SYS_ADMIN
                runAsUser: 0
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
              volumeMounts:
                - name: var
                  mountPath: /host-var
          volumes:
            - name: var
              hostPath:
                path: /var
                type: Directory
