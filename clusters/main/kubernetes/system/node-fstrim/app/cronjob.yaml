---
# Periodic fstrim of the Talos EPHEMERAL (/var) filesystem on the single node.
#
# WHY (#158 disk-move, 2026-07-27): etcd was moved off the dying QLC pool onto a
# 444 GB Solidigm pool via a Proxmox-level `zfs send`. The Talos system disk is now a
# 2 TB **thin** zvol on that 444 GB pool, and Talos does NOT issue discard/TRIM on
# EPHEMERAL (proven: the zvol had accumulated ~1 TB of freed-but-referenced blocks
# before the move). The kubelet age-GCs unused images (imageMaximumGCAge=168h in
# patches/all.yaml), which frees blocks in xfs — but without TRIM those blocks are
# never returned to ZFS, so the thin pool creeps toward FULL. If it fills, ZFS can't
# allocate and etcd writes fail — a worse outage than #158 itself.
#
# ⚠️ LIMITED EFFECTIVENESS — read this. Deep audit 2026-07-27 found the in-guest fstrim
# reclaims almost NOTHING to the zvol: the zvol is volblocksize=16K but the guest xfs
# writes/discards at 4K, so ZFS only frees a 16K volblock when all four 4K sub-blocks
# are free — and post-churn scatter means ~none are (also suspect QEMU virtio-scsi +
# iothread not cleanly propagating the guest UNMAP). Observed: /var dropped 202→144G
# but pool ALLOC stayed 388G (0 reclaimed). This CronJob is therefore BEST-EFFORT ONLY
# — it reclaims large *contiguous* freed regions (rare) and is a no-op for fine-grained
# containerd churn. The RELIABLE reclaim is an OFFLINE host-side fstrim (VM off → mount
# zd0p6 → fstrim → on) or the raw-disk-passthrough re-architecture. Kept as harmless
# best-effort; do NOT rely on it to bound the pool.
# See docs/runbooks/2026-07-27-etcd-raw-passthrough-rearchitecture.md (the real fix)
# and project_etcd_solidigm_diskmove_done_2026_07_27 memory for the full root-cause.
# Runs in kube-system (Kyverno-excluded + PSA-privileged-capable).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: node-fstrim
  namespace: kube-system
  labels:
    app.kubernetes.io/name: node-fstrim
spec:
  schedule: "23 5 * * *"          # daily 05:23 — off-peak, after the VolSync backup window
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: node-fstrim
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          tolerations:
            - operator: Exists            # single control-plane node
          containers:
            - name: fstrim
              # renovate: datasource=docker depName=busybox
              image: busybox:1.37.0
              command: ["sh", "-c", "fstrim -v /host-var"]
              securityContext:
                privileged: true          # FITRIM ioctl needs CAP_SYS_ADMIN
                runAsUser: 0
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
              volumeMounts:
                - name: var
                  mountPath: /host-var
          volumes:
            - name: var
              hostPath:
                path: /var
                type: Directory
