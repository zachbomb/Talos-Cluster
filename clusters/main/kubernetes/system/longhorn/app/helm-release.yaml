apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 5m
  timeout: 20m
  maxHistory: 3
  releaseName: longhorn
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: longhorn
      version: 1.12.1
      sourceRef:
        kind: HelmRepository
        name: home-ops-mirror
        namespace: flux-system
  values:
    defaultSettings:
      defaultReplicaCount: "1"
      storageOverProvisioningPercentage: "100000"
      guaranteedInstanceManagerCPU: 8
      # Raised 10s→30s during the 2026-06-14 IM crash-loop outage. After a
      # cascade, the instance-manager liveness probe (nc localhost 8500-8503)
      # timed out at 10s while bringing up ~100 engines, so kubelet killed the
      # IM before it could stabilize → permanent death spiral (every ~90s).
      # 30s lets the IM survive the attach storm. Root trigger was the Longhorn
      # 1.11.2→1.12.0 auto-upgrade (#4177, June 2) — Renovate is supposed to be
      # disabled for this chart but the automerge-action bypassed it; re-block.
      instanceManagerPodLivenessProbeTimeout: "30"
      # Same fix, one layer down — applied 2026-08-03 after the engine-image
      # DaemonSet crash-looped 57/40/28 times and froze the ENTIRE attach pipeline:
      # 29 volumes stuck `attaching`, 41 pods not-ready, and `attached` pinned at
      # exactly 70 for minutes while nothing progressed.
      #
      # Identical mechanism to the June IM outage. engine-image pods run BestEffort
      # (the chart sets no resources for them) behind a FOUR SECOND liveness timeout.
      # At 93-95% node CPU the probe command
      #     sh -c "/data/longhorn version --client-only"
      # could not complete in 4s, so kubelet SIGKILLed them (exit 137), repeatedly.
      # With no engine-image pod there is NO engine binary, so no volume can attach
      # at all — storage stops cluster-wide from a CPU spike.
      #
      # The control experiment was already present: instance-manager is the only
      # Longhorn pod with a CPU request (636m via guaranteedInstanceManagerCPU
      # above) and logged ZERO restarts through the same event.
      #
      # 30s matches the IM value. This probe only checks a version string; if that
      # needs >30s the node is in far worse trouble than a probe can express, and
      # killing the pod that gates all volume attachment is never the right response
      # to CPU pressure.
      engineImagePodLivenessProbeTimeout: "30"
      # Enable the revision counter. With it DISABLED (Longhorn's default since
      # 1.2), a single-replica volume that faults on an unclean node reboot will
      # NOT auto-salvage — Longhorn can't confirm the lone replica is consistent,
      # so auto-salvage logs "bringing up 0 replicas" and the volume stays
      # detached/faulted until failedAt is cleared by hand. On 2026-07-03 a Talos
      # reboot faulted ~50 single-replica volumes this way (Longhorn #2309/#7714).
      # On a single-node cluster the lone replica IS the data, so salvaging it is
      # always correct. NOTE: this applies to NEW volumes only; pre-existing
      # volumes keep their setting until rebuilt — see the salvage runbook.
      disableRevisionCounter: false
      # Throttle concurrent clone/rebuild + heavy-snapshot ops so a VolSync
      # bulk-resume (or any burst of ReplicationSource clones) can't stampede the
      # single-node instance-manager. 2026-07-13: resuming VolSync after a long
      # suspension fired ~51 clone-volume creations at once → node 54→93% CPU,
      # 49 clone volumes faulting. The etcd SLOG (added same day) kept the IM
      # ALIVE through it, but these caps meter the burst so it never gets severe
      # in the first place (belt + suspenders). Default is 5 each; 2 is the
      # single-node-safe value — less thrash, slightly slower rebuilds (an
      # acceptable trade on 1 node). See [[volsync-operational-procedures]] and
      # [[longhorn-mass-salvage-im-deathspiral-2026-07]].
      concurrentReplicaRebuildPerNodeLimit: "2"
      snapshotHeavyTaskConcurrentLimit: "2"
      # 2026-08-03: the LAST unfixed instance of the BestEffort starvation class
      # (SQ-14). longhorn-csi-plugin ran BestEffort behind a FOUR SECOND liveness
      # probe, and unlike engine-image and instance-manager that probe has NO chart
      # setting -- there is no `csiPluginPodLivenessProbeTimeout`. Verified against
      # `helm show values longhorn/longhorn --version 1.12.0`: only
      # engineImagePodLivenessProbeTimeout and instanceManagerPodLivenessProbeTimeout
      # exist. The 4s is hardcoded in the DaemonSet, so a CPU request is the ONLY
      # available lever.
      #
      # Blast radius is the reason this matters more than its restart count suggests.
      # longhorn-csi-plugin serves /csi/csi.sock. When it dies, that socket vanishes
      # and ALL EIGHT CSI sidecars exit 1 by design:
      #     E connection.go:116] "Lost connection to CSI driver, exiting"
      # So attach, detach, provision, resize and snapshot stop cluster-wide from one
      # pod being starved. The sidecars' own restart counts (attacher 14/10,
      # snapshotter 9/8, provisioner 7/5) are DOWNSTREAM SYMPTOMS -- they have no
      # liveness probes at all. Do not try to fix them in isolation.
      #
      # Two triggers were observed. A Cilium eBPF drop killed it fatally at startup
      # ("connect: operation not permitted" to longhorn-backend:9500, believed
      # transient endpoint regeneration during the cascade), and separately the probe
      # itself began failing under load -- "context deadline exceeded" and "HTTP probe
      # failed with statuscode: 500" -- at 94-97% node CPU. The probe never hit its
      # failureThreshold of 3, so it did not kill; it came close.
      #
      # QoS is computed PER POD, so all three containers in the DaemonSet are listed:
      # longhorn-csi-plugin owns :9808/healthz and answers the probe (it is the
      # longhorn-manager binary in csi mode, NOT the livenessprobe sidecar), and the
      # other two get small requests so they are not share-starved inside the pod.
      #
      # ~150m total across every component listed (8 vCPU node = 1.9%). No CPU limits,
      # same reasoning as longhornManager below: CFS throttling would recreate the
      # starvation this is meant to prevent. Memory is not compressible, so caps there
      # are safe. Renders to the `system-managed-csi-components-resource-limits`
      # setting; verified via `helm template` that this JSON string serializes intact.
      #
      # WARNING, per the chart's own docs: changing this RESTARTS the CSI components
      # and temporarily interrupts provisioning and attach/detach. Never apply it
      # during the VolSync window (staggered 00:00-04:32 UTC) -- interrupting the
      # snapshot pipeline mid-flight is precisely how plex/bazarr/homepage ended up
      # wedged for 4-8 days on 2026-08-03 (Jobs stuck holding job-tracking
      # finalizers). See [[besteffort-control-plane-starvation]].
      systemManagedCSIComponentsResourceLimits: >-
        {"longhorn-csi-plugin":{"requests":{"cpu":"50m","memory":"64Mi"},"limits":{"memory":"256Mi"}},
        "node-driver-registrar":{"requests":{"cpu":"10m","memory":"16Mi"},"limits":{"memory":"64Mi"}},
        "longhorn-liveness-probe":{"requests":{"cpu":"10m","memory":"16Mi"},"limits":{"memory":"64Mi"}},
        "csi-attacher":{"requests":{"cpu":"10m","memory":"32Mi"},"limits":{"memory":"128Mi"}},
        "csi-provisioner":{"requests":{"cpu":"10m","memory":"32Mi"},"limits":{"memory":"128Mi"}},
        "csi-resizer":{"requests":{"cpu":"10m","memory":"32Mi"},"limits":{"memory":"128Mi"}},
        "csi-snapshotter":{"requests":{"cpu":"10m","memory":"32Mi"},"limits":{"memory":"128Mi"}}}
      # v2DataEngine: true
    persistence:
      defaultClass: true
      defaultClassReplicaCount: "1"
    csi:
      attacherReplicaCount: 2
      provisionerReplicaCount: 2
      resizerReplicaCount: 2
      snapshotterReplicaCount: 2
    longhornManager:
      # 2026-08-03: longhorn-manager ran BestEffort (chart default is `resources: ~`)
      # and had accumulated 37 restarts. It is the control plane for every volume
      # operation — attach, detach, replica scheduling, snapshot orchestration — so
      # when CPU pressure starves it, volume operations stall cluster-wide even
      # though the instance-manager itself is healthy.
      #
      # A request does NOT reserve capacity it will not use; it buys a scheduling
      # guarantee and moves the pod out of the first-to-starve tier. The same
      # reasoning already applies to instance-manager via guaranteedInstanceManagerCPU,
      # and that pod rode out tonight's event with zero restarts.
      #
      # No CPU limit, deliberately: CFS throttling would recreate the starvation this
      # is meant to prevent. Memory is not compressible, so a cap there is safe.
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
    longhornUI:
      replicas: 1
    metrics:
      serviceMonitor:
        enabled: true
        # 2026-08-03: longhorn-backend was the WORST scrape target in the cluster —
        # only 79.6% of scrapes succeeded over 7d (75.1% over 24h), every failure
        # "context deadline exceeded" with lastScrapeDuration pinned at exactly the
        # 10s timeout. Measured the endpoint directly: /metrics returns HTTP 200 but
        # takes 6.0s and 26.8s on back-to-back samples. The endpoint is genuinely slow
        # and highly variable (longhorn-manager exports per-volume series over ~113
        # volumes), so roughly half of all scrapes simply ran out of time.
        # That left ~20% blind spots in the metrics for the storage layer that has
        # caused this cluster's repeated outages — precisely the data needed to
        # investigate them. Prometheus requires scrapeTimeout <= interval, so the
        # interval widens too; per-volume Longhorn metrics do not need 30s
        # granularity.
        interval: 60s
        scrapeTimeout: 45s
    service:
      ui:
        type: LoadBalancer
        # MetalLB v0.13+ rejects setting both spec.loadBalancerIP AND the
        # annotation. spec.loadBalancerIP is deprecated in K8s 1.24+;
        # annotation-only is the modern pattern for upstream charts.
        annotations:
          metallb.io/loadBalancerIPs: ${LONGHORN_IP}
        port: 80
