---
# Talos ServiceAccount — mints a k8s Secret ("talos-backup-secrets") in system-upgrade
# containing a talosconfig, so the talos-backup pod can call the Talos etcd-snapshot API.
# Requires machine.features.kubernetesTalosAPIAccess (enabled in patches/controlplane.yaml
# for the system-upgrade namespace).
#
# ⚠️ ROLE = os:admin because the cluster's allowedRoles is [os:admin]. The least-privilege
# role for this is `os:etcd:backup` — FOLLOW-UP: add it to
# patches/controlplane.yaml kubernetesTalosAPIAccess.allowedRoles (via surgical
# `talosctl patch mc`), then switch the role below to os:etcd:backup so a compromised
# backup pod can't reboot/reset the node.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talos-backup-secrets
  namespace: system-upgrade
spec:
  roles:
    - os:admin
