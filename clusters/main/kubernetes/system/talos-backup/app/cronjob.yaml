---
# Scheduled encrypted etcd snapshots → MinIO (the single-node DR backstop / accelerator).
# Uses siderolabs/talos-backup: snapshots etcd via the Talos API (talosconfig from the
# ServiceAccount), AGE-encrypts the snapshot (it contains EVERY cluster secret, incl. the
# SOPS age-key secret — must never land on S3 in cleartext), then uploads to MinIO.
# Decrypt with the SOPS age PRIVATE key (1Password): `age -d -i <key> <snapshot.age>`.
#
# See docs/runbooks/single-node-disaster-recovery.md (restore = talosctl bootstrap
# --recover-from-snapshot after decrypting).
#
# ⚠️ FIRST-RUN VERIFY (trigger manually, read logs):
#   - CUSTOM_S3_ENDPOINT must be the AWS-SDK endpoint form (https://host, NO `s3:` prefix).
#     ${S3URL} is the restic-style value — if it carries an `s3:` prefix this will fail;
#     adjust to a literal endpoint if so.
#   - The BUCKET must ALREADY EXIST on MinIO (talos-backup does not create it).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: talos-backup
  namespace: system-upgrade
  labels:
    app.kubernetes.io/name: talos-backup
spec:
  schedule: "0 */6 * * *"          # every 6h
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: talos-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: talos-backup
              # renovate: datasource=docker depName=ghcr.io/siderolabs/talos-backup
              image: ghcr.io/siderolabs/talos-backup:v0.1.0-beta.3-10-gb9fd478
              env:
                - name: AWS_ACCESS_KEY_ID
                  value: "${S3ID}"
                - name: AWS_SECRET_ACCESS_KEY
                  value: "${S3KEY}"
                - name: AWS_REGION
                  value: "us-east-1"          # dummy for MinIO
                - name: CUSTOM_S3_ENDPOINT
                  value: "${S3URL}"           # verify: AWS-SDK endpoint form, no s3: prefix
                - name: USE_PATH_STYLE
                  value: "true"               # MinIO needs path-style addressing
                - name: BUCKET
                  value: "${S3PREFIX}-etcd"   # must pre-exist on MinIO
                - name: S3_PREFIX
                  value: "etcd-snapshots"
                - name: CLUSTER_NAME
                  value: "${CLUSTERNAME}"
                # CRITICAL: correct env name = AGE_RECIPIENT_PUBLIC_KEY. If unset/wrong the
                # snapshot (contains ALL cluster secrets) uploads UNENCRYPTED. This is the
                # SOPS age public key (.sops.yaml) → decrypt with the 1Password private key.
                - name: AGE_RECIPIENT_PUBLIC_KEY
                  value: "age1xuryc2afg7fh6tg2d85mydr05rh93xf8dhrcq4xata7ec33t8uvs6kl3yw"
                - name: ENABLE_COMPRESSION
                  value: "true"
              volumeMounts:
                - name: talos-secrets
                  mountPath: /var/run/secrets/talos.dev
                  readOnly: true
                - name: talos
                  mountPath: /.talos          # talosctl working dir (needed w/ readOnlyRootFilesystem)
                - name: tmp
                  mountPath: /tmp
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: talos-secrets
              secret:
                secretName: talos-backup-secrets   # minted by the talos.dev ServiceAccount
            - name: talos
              emptyDir:
                sizeLimit: 64Mi
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
