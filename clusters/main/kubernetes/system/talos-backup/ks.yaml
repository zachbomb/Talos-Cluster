---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: talos-backup
  namespace: flux-system
spec:
  interval: 10m
  path: clusters/main/kubernetes/system/talos-backup/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
  # decryption + substituteFrom (cluster-config/cluster-secrets) are injected by the
  # flux-entry patch (targets all Kustomizations), so ${S3ID}/${S3KEY}/${S3URL}/
  # ${S3PREFIX}/${CLUSTERNAME} resolve automatically.
