apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: goodmem-db
  namespace: goodmem
spec:
  instances: 1
  # Tensorchord's CNPG operand image — postgres 17 + pgvector + vchord baked in.
  # Same vendor used by media/immich-cnpg-main, so it's proven in this cluster.
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18-1.1.1
  postgresql:
    parameters:
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      max_connections: "100"
    pg_hba:
      - host all all 10.0.0.0/8 md5
      - host all all 172.16.0.0/16 md5
  bootstrap:
    initdb:
      database: goodmem
      owner: goodmem_user
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS "vector"
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp"
        - CREATE EXTENSION IF NOT EXISTS "pgcrypto"
  storage:
    size: 10Gi
  # 2026-09-07: separate WAL volume, applied after sonarqube-db deadlocked
  # itself for four months on exactly this exposure. See
  # docs/dr/sonarqube-wal-deadlock-2026-09-07.md
  #
  # If WAL archiving fails, PostgreSQL MAY NOT recycle unarchived segments, so
  # WAL grows without bound. Sharing the data volume makes that terminal: the
  # volume fills, PostgreSQL refuses to start, and a stopped PostgreSQL cannot
  # archive -- so it never drains. On a separate volume the same failure fills
  # only THIS volume; PostgreSQL still stops, but the data volume stays healthy
  # and the fault is isolated and legible rather than self-sealing.
  #
  # 8Gi, not 2Gi (2Gi fills in days on an active cluster). Current WAL here is
  # 577MB, and sonarqube's four-month stranded backlog peaked at 9.7GB, so 8Gi
  # is sized against a real observed worst case.
  #
  # Adding walStorage to a live cluster provisions a new PVC and recycles the
  # instance -- expect a brief outage on reconcile (measured ~3.5 min on
  # sonarqube, single-instance).
  walStorage:
    size: 8Gi
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-goodmem/
      endpointURL: ${S3URL}
      s3Credentials:
        accessKeyId:
          name: goodmem-db-s3-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: goodmem-db-s3-creds
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"
  monitoring:
    # Postgres server metrics (cnpg_*/pg_*) via CNPG native exporter :9187;
    # Prometheus podMonitorSelector={} auto-scrapes the operator PodMonitor.
    enablePodMonitor: true
