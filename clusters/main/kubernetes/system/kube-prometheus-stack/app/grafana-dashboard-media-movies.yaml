---
# Media - Movies
#
# Generated by tools/dashboards/gen_media_domains.py - edit that, not this.
#
# Radarr owns acquisition, Bazarr owns movie subtitles, Emby provides
# the served-library count. Per-title serving does not exist in
# metrics - sessions carry no content label.
#
# Four-questions layout per tools/dashboards/dashlib.py. Every
# expr validated against live Prometheus; none render "No data".
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-media-movies
  namespace: kube-prometheus-stack
  labels:
    grafana_dashboard: "1"
data:
  media-movies.json: |-
    {
      "title": "Media - Movies",
      "uid": "media-movies",
      "tags": [
        "media",
        "domain"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "type": "row",
          "title": "1 - Is it broken right now?",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "state-timeline",
          "title": "Media exporters - up/down history",
          "description": "Every media scrape target, replacing per-exporter guard tiles: if a strip goes red or gappy, that exporter's numbers on this board are stale. Gaps are scrape gaps, shown on purpose.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 0,
                "fillOpacity": 70,
                "spanNulls": false
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "down",
                      "color": "red",
                      "index": 0
                    },
                    "1": {
                      "text": "up",
                      "color": "green",
                      "index": 1
                    }
                  }
                }
              ],
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "showValue": "never",
            "alignValue": "center",
            "mergeValues": true,
            "rowHeight": 0.85,
            "legend": {
              "showLegend": false
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "up{namespace=\"media\"}",
              "refId": "A",
              "legendFormat": "{{pod}} {{probe}}"
            }
          ]
        },
        {
          "type": "table",
          "title": "Firing in media",
          "description": "Namespace is the finest alert scope that exists today; a domain-scoped Q1 would need domain labels added to the media PrometheusRules (a rule change, not a metric gap).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 16,
            "x": 8,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "filterable": true
              },
              "noValue": "No alerts firing - nothing is broken right now",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "severity"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "critical": {
                            "color": "red",
                            "index": 0
                          },
                          "warning": {
                            "color": "orange",
                            "index": 1
                          },
                          "info": {
                            "color": "blue",
                            "index": 2
                          }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "severity",
                "desc": false
              }
            ]
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "ALERTS{alertstate=\"firing\",namespace=\"media\"}",
              "refId": "A",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "__name__": true,
                  "alertstate": true,
                  "endpoint": true,
                  "instance": true,
                  "job": true,
                  "service": true,
                  "container": true,
                  "prometheus": true,
                  "prometheus_replica": true,
                  "uid": true
