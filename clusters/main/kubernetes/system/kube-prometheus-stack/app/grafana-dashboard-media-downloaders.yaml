---
# Media - Downloaders
#
# Generated by tools/dashboards/gen_media_services.py - edit that, not this.
#
# Moving the bytes: SABnzbd, NZBGet, Deluge. Paused state gets its own
# tile because a paused downloader is indistinguishable from an idle
# one on every throughput graph.
#
# Four-questions layout per tools/dashboards/dashlib.py. Every
# expr validated against live Prometheus; none render "No data".
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-media-downloaders
  namespace: kube-prometheus-stack
  labels:
    grafana_dashboard: "1"
data:
  media-downloaders.json: |-
