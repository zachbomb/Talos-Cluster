                      {
                        "type": "value",
                        "options": {
                          "critical": {
                            "color": "red",
                            "index": 0
                          },
                          "warning": {
                            "color": "orange",
                            "index": 1
                          },
                          "info": {
                            "color": "blue",
                            "index": 2
                          }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "severity",
                "desc": false
              }
            ]
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "ALERTS{alertstate=\"firing\",namespace=\"media\"}",
              "refId": "A",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "__name__": true,
                  "alertstate": true,
                  "endpoint": true,
                  "instance": true,
                  "job": true,
                  "service": true,
                  "container": true,
                  "prometheus": true,
                  "prometheus_replica": true,
                  "uid": true
                },
                "indexByName": {
                  "alertname": 0,
                  "severity": 1,
                  "namespace": 2
                },
                "renameByName": {}
              }
            }
          ]
        },
