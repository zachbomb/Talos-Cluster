---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: kube-prometheus-stack
spec:
  interval: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 86.3.2
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    crds:
      enabled: true
      upgradeJob:
        enabled: true
        forceConflicts: true
    cleanPrometheusOperatorObjectNames: true
    defaultRules:
      disabled:
        # The chart's KubeJobFailed is `kube_job_failed > 0` with NO time bound.
        # A Job object that failed once keeps that series forever, and CronJob
        # failedJobsHistoryLimit retains those objects indefinitely, so the alert
        # never clears on its own.
        #
        # On 2026-08-06 it was firing 8 times for failures dated Jul 26 - Aug 6.
        # Every single one had already been followed by a successful run of the
        # same CronJob; the count was purely a function of history limits
        # (3 ddns + 2 longhorn + 3 unifi = 8), not of anything being broken.
        # An alert that stays lit for two weeks after the problem resolved is an
        # alert people learn to scroll past -- and three genuine CRITICALs were
        # sitting underneath it.
        #
        # Replaced by KubeJobFailedRecent in prometheusrule-cronjobs.yaml, which
        # is the same signal bounded to 24h so it cannot rot. NOT simply deleted:
        # 3 of the Jobs tracked here have owner_kind=None (VolSync movers and
        # other one-shot Jobs), which the CronJobStale* rules do not cover.
        KubeJobFailed: true
      # Disable the 30-day apiserver SLO recording rules. They compute availability
      # over a 30d window and CANNOT KEEP UP WITH THEIR OWN SCHEDULE on this cluster:
      #
      #   kube-apiserver-availability.rules   interval=180s   evaluationTime=319s
      #   -> DUTY CYCLE 177% (measured again later the same day at 145%)
      #
      # A group whose evaluation takes longer than its interval never finishes before
      # the next run is due, so Prometheus evaluates it CONTINUOUSLY. Measured effect:
      # a sustained 56-66 MB/s read off the single shared SSD -- 3.7x the next-busiest
      # volume -- because both offending rules are 30-day range scans over
      # high-cardinality apiserver histograms (215,024 series):
      #
      #   code_verb:apiserver_request_total:increase30d                            165.6s
      #   cluster_verb_scope_le:apiserver_request_sli_duration_seconds_bucket:..30d 152.7s
      #
      # That starved Plex's SQLite into BIMODAL latency: the same POST /playQueues
      # answered in 0.86s and in 40.6s depending on whether a 30d scan was mid-flight.
      # At 40.6s the client's ~30s timeout fired and playback failed outright.
      #
      # This is hard to find because an overrunning job does not look like a job --
      # no start, no finish, no log line. It presents as ambient load with no owner,
      # and the victim looks healthy in every dimension because it is simply waiting
      # on a saturated disk. See memory: prometheus-rule-group-duty-cycle-starves-disk.
      #
      # WHAT IS LOST: 30-day apiserver availability SLO numbers. Meaningful on a
      # multi-tenant production cluster; near-worthless on a single node where the
      # apiserver's health is already covered by KubeAPIDown and the burnrate rules
      # (kept -- those are 38% duty, not 145%). Re-enable if this ever becomes
      # multi-node AND the series count is brought under control.
      rules:
        kubeApiserverAvailability: false
        # 2026-09-03: the burnrate rules had to go too, and the reason is a WARNING
        # about the comment directly above this one.
        #
        # That comment says burnrate was deliberately KEPT because "those are 38%
        # duty, not 145%". That was true when measured in August. It is no longer:
        #
        #   kube-apiserver-burnrate.rules   interval=30s   evaluationTime=215.2s
        #   -> DUTY CYCLE 717%   (38% -> 717%, roughly 19x, as apiserver series
        #      cardinality grew; the rules multi-window burn-rate math scans the
        #      same high-cardinality histograms the availability rules did)
        #
        # Same continuous-evaluation failure, same 56-66 MB/s signature: measured
        # 60.9 MB/s sustained off the prometheus volume, ~3x the next-busiest.
        # Same victim: Plex /hubs went BIMODAL at 9.5-55s for identical requests
        # (7 samples: 55.07, 22.15, 13.39, 39.15, 26.86, 25.15, 9.49) while cheap
        # endpoints stayed fast (/library/sections 0.05-0.19s, /identity 0.02s).
        # Clients time out and fail with FailedToCreateSession; playback never starts.
        #
        # THE LESSON: the August fix did not fail - its stated PREMISE EXPIRED. A
        # config comment that justifies keeping something by citing a measured
        # number is only valid while that number holds. If a duty-cycle problem
        # recurs here, RE-MEASURE every apiserver group rather than trusting the
        # numbers written above; check with:
        #   curl -s localhost:9091/api/v1/rules | jq '.data.groups[]
        #     | select(.evaluationTime > .interval) | {name,interval,evaluationTime}'
        #
        # WHAT IS LOST: apiserver error-budget burn-rate SLO alerting. That is a
        # multi-tenant production concern; on a single node the apiserver's health
        # is already covered by KubeAPIDown. Re-enable only if this becomes
        # multi-node AND series cardinality is brought under control.
        kubeApiserverBurnrate: false
    alertmanager:
      enabled: true
      # Override default inhibit_rules to exempt the Watchdog heartbeat from
      # info-severity suppression. Chart's default rules suppress ALL alerts
      # with severity=info (including the always-firing Watchdog heartbeat
      # that's supposed to reach Uptime Kuma every minute). Adding
      # 'watchdog!="true"' to target_matchers preserves the noise suppression
      # for other info alerts but lets the heartbeat through. 2026-05-27.
      config:
        inhibit_rules:
          - source_matchers:
              - 'severity = critical'
            target_matchers:
              - 'severity =~ warning|info'
              - 'watchdog!="true"'
            equal:
              - namespace
              - alertname
          - source_matchers:
              - 'severity = warning'
            target_matchers:
              - 'severity = info'
              - 'watchdog!="true"'
            equal:
              - namespace
              - alertname
          - source_matchers:
              - 'alertname = InfoInhibitor'
            target_matchers:
              - 'severity = info'
              - 'watchdog!="true"'
            equal:
              - namespace
          - target_matchers:
              - 'alertname = InfoInhibitor'
      # U4: internal-only ingress at alert.sf.${BASE_DOMAIN} via Traefik internal-secure-chain.
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
          traefik.ingress.kubernetes.io/router.middlewares: traefik-internal-secure-chain@kubernetescrd
          cert-manager.io/cluster-issuer: wethecommon-prod-cert
        hosts:
          - alert.sf.${BASE_DOMAIN}
        paths:
          - /
        pathType: Prefix
        tls:
          - secretName: alertmanager-tls
            hosts:
              - alert.sf.${BASE_DOMAIN}
      alertmanagerSpec:
        # Cluster-wide AlertmanagerConfig discovery — matcher strategy `None`
        # disables the operator's default per-namespace matcher injection so the
        # CRD-rooted route applies as authored. See plan U1 + U3.
        alertmanagerConfigSelector: {}
        alertmanagerConfigMatcherStrategy:
          type: None
        retention: 120h
        replicas: 1
        externalLabels:
          cluster: cluster_main
          env: prod
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
    kubeEtcd:
      service:
        selector:
          component: kube-apiserver
      enabled: true
    kubeProxy:
      enabled: false
    prometheus:
      ingress:
        enabled: false
      prometheusSpec:
        disableCompaction: true
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        enableAdminAPI: true
        walCompression: true
        enableFeatures:
          - memory-snapshot-on-shutdown
        # Prometheus metrics retention time in PV.
        # retentionSize is the WAL+blocks cap Prometheus enforces; keep it
        # below the PVC size so head writes never run out of space. 2026-06-10:
        # PVC 60Gi → 100Gi, retentionSize 50GB → 80GB after WAL filled and
        # CrashLoopBacked off with "no space left on device" on /prometheus/wal.
        #
        # 2026-08-06: 14d → 60d. Trend panels on the new cluster-overview
        # dashboard were capped at two weeks, which is too short to see a PVC
        # fill-rate or a slow memory creep develop.
        #
        # THE MEASUREMENT (taken before changing anything):
        #   blocks on disk      13.77 GiB
        #   oldest sample       10.2 days   <- NEITHER limit was binding; the
        #                                      TSDB had simply only been
        #                                      accumulating since ~Jul 27
        #   growth              ~1.35 GiB/day
        #   PVC                 14.3 GiB used of 98.1 GiB (14.6%)
        #   head series         211,995 at ~6,770 samples/sec
        #
        # WHY 60d AND NOT THE 90d ORIGINALLY SCOPED: 90d × 1.35 GiB/day is
        # ~122 GiB, which does not fit the 100Gi volume. 90d was reachable only
        # by expanding the PVC (Longhorn has the headroom - 1507 GiB provisioned
        # of 3832 GiB) or by dropping series. 60d fits with room to spare and is
        # still a 4x improvement, so the volume stays as it is.
        #
        # WHY retentionSize STAYS BELOW THE TIME TARGET: 85GB is 79.2 GiB, and
        # 60 days at current growth is ~81 GiB of blocks plus WAL. So the SIZE
        # cap will bind first, around day ~57, and that is deliberate. The two
        # failure modes are not symmetric: too small costs a couple of days of
        # history, while too large reproduces the 2026-06-10 disk-full
        # CrashLoop on /prometheus/wal. Err small.
        #
        # Growth is extrapolated from 10.2 days and assumes series count holds.
        # Re-measure prometheus_tsdb_storage_blocks_bytes before trusting it for
        # any further increase.
        retention: 60d
        retentionSize: 85GB
        # External labels to add to any time series or
        # alerts when communicating with external systems
        externalLabels:
          cluster: cluster_main
          env: prod
        # High availability
        replicas: 1
        resources:
          requests:
            cpu: 100m
            memory: 500Mi
          limits:
            memory: 4Gi
            # storageSpec:
            #   volumeClaimTemplate:
            #     spec:
            #       resources:
            #         requests:
            #           storage: 60Gi
        # storageSpec:
        #   volumeClaimTemplate:
        #     spec:
        #       resources:
        #         requests:
        #           storage: 60Gi

        storageSpec:
          volumeClaimTemplate:
            spec:
              resources:
                requests:
                  # Bumped 60Gi → 100Gi 2026-06-10 after PVC filled.
                  # Prometheus Operator handles online PVC expansion via the
                  # Prometheus CR; underlying StorageClass (longhorn) supports
                  # online expansion.
                  storage: 100Gi
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      # 2026-08-03: node-exporter ran BestEffort (chart default leaves resources
      # unset), so it was starved first whenever the node came under pressure. At
      # 22 restarts it went to `up=0` while still reporting 1/1 Running -- the pod
      # looks healthy, the scrape endpoint simply stops answering. metrics-server
      # (0/1) went with it, so `node_load1` and `kubectl top` both returned EMPTY
      # during the media restore, exactly when load was highest and visibility
      # mattered most.
      #
      # Same failure as prometheus-operator earlier the same day: no CPU request ->
      # BestEffort -> starved -> observability dies precisely when it is needed.
      # A blank metric reads as "fine" unless you notice it is blank, which makes
      # this worse than an outright crash.
      #
      # No CPU limit, deliberately: CFS throttling would reintroduce the same
      # starvation it is meant to prevent. Memory is not compressible, so a cap
      # there is safe. Requests are small -- node-exporter is genuinely cheap; the
      # point is a scheduling guarantee, not capacity.
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 192Mi
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      # 2026-08-04 (SQ-5), Tier 2 — observability that fails SILENTLY.
      # kube-state-metrics is the sole source of kube_pod_*, kube_deployment_* and
      # kube_persistentvolumeclaim_* series, so nearly every alert in this cluster
      # depends on it. When it is starved it does not crash loudly — the scrape just
      # stops answering and every dependent alert evaluates against no data, which
      # reads as "nothing is wrong". node-exporter did exactly this on 2026-08-03:
      # `up=0` while still reporting 1/1 Running, and `kubectl top` returned EMPTY at
      # the moment load was highest. A blank metric is worse than a crash because it
      # looks like health. Observed usage 9m CPU / 50Mi.
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 384Mi
      # metricLabelsAllowlist:
      #   - pods=[*]
      #   - deployments=[*]
      #   - persistentvolumeclaims=[*]
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
      metricLabelsAllowlist:
        - pods=[*]
        - deployments=[*]
        - persistentvolumeclaims=[*]
    grafana:
      enabled: true
      # 2026-08-04 (SQ-5), Tier 2. Grafana ran BestEffort along with both of its
      # sidecars. Memory is sized from measurement, not convention: it is actually
      # using 371Mi, so a 256Mi limit (the value that "looks reasonable") would OOM
      # it on the next dashboard load. 512Mi gives real headroom.
      # The sc-dashboard/sc-datasources sidecars are tiny but share the pod, and QoS
      # is computed PER POD — leaving them at zero would let them be share-starved
      # inside an otherwise-Burstable pod.
      resources:
        requests:
          cpu: 25m
          memory: 384Mi
        limits:
          memory: 768Mi
      sidecar:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
      forceDeployDashboards: true
      defaultDashboardsEnabled: true
      forceDeployDatasources: true
      adminPassword: admin
      persistence:
        enabled: true
        size: 2Gi
      ingress:
        enabled: true
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
          traefik.ingress.kubernetes.io/router.middlewares: traefik-internal-secure-chain@kubernetescrd
          cert-manager.io/cluster-issuer: wethecommon-prod-cert
        hosts:
          - grafana.${BASE_DOMAIN}
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.${BASE_DOMAIN}
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki.loki.svc.cluster.local:3100
          access: proxy
          isDefault: false
          jsonData:
            maxLines: 250
      imageRenderer:
        enabled: true
        replicas: 1
        image:
          repository: grafana/grafana-image-renderer
          tag: latest
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
    prometheusOperator:
      # 2026-08-03: the operator had restarted 68 times (49 on Jul 30 → 68 on Aug 3,
      # ~4.5/day and accelerating). It was NOT crashing — every termination was
      # exitCode 0 / reason "Completed", and the final log line each time was
      # "received SIGTERM, exiting gracefully". The kubelet was killing a healthy
      # process:
      #   1. the chart defaults prometheusOperator.resources to {} → BestEffort QoS,
      #      so on a contended node (82% CPU requests, 1320% CPU limits) this
      #      container is first in line to be starved of CPU, and
      #   2. the chart defaults both probes to timeoutSeconds: 1 — a 1s budget for a
      #      TLS handshake plus an HTTPS /healthz round trip. Under starvation the
      #      probe client gave up ("context deadline exceeded ... while awaiting
      #      headers"), 3 consecutive failures tripped the liveness threshold, and the
      #      container was SIGTERM'd.
      # This matters beyond the restart count: while the operator is down it does not
      # reconcile ServiceMonitors or PrometheusRules, so a rule can be correctly
      # committed to git and silently never reach Prometheus.
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
      # No cpu limit on purpose. CPU limits enforce CFS throttling even when the node
      # has idle cores, which would make probe timeouts MORE likely — the opposite of
      # the fix. Memory is not compressible, so capping memory is safe.
      livenessProbe:
        timeoutSeconds: 5
        failureThreshold: 5
      readinessProbe:
        timeoutSeconds: 5
    kubeControllerManager:
      enabled: true
      service:
        port: 10257
        targetPort: 10257
      serviceMonitor:
        enabled: true
        https: true
        insecureSkipVerify: true
    kubeScheduler:
      enabled: true
      service:
        port: 10259
        targetPort: 10259
      serviceMonitor:
        enabled: true
        https: true
        insecureSkipVerify: true
    autoscaling:
      vpa:
        enabled: false
