---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: kube-prometheus-stack
spec:
  interval: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 86.3.2
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    crds:
      enabled: true
      upgradeJob:
        enabled: true
        forceConflicts: true
    cleanPrometheusOperatorObjectNames: true
    alertmanager:
      enabled: true
      # Override default inhibit_rules to exempt the Watchdog heartbeat from
      # info-severity suppression. Chart's default rules suppress ALL alerts
      # with severity=info (including the always-firing Watchdog heartbeat
      # that's supposed to reach Uptime Kuma every minute). Adding
      # 'watchdog!="true"' to target_matchers preserves the noise suppression
      # for other info alerts but lets the heartbeat through. 2026-05-27.
      config:
        inhibit_rules:
          - source_matchers:
              - 'severity = critical'
            target_matchers:
              - 'severity =~ warning|info'
              - 'watchdog!="true"'
            equal:
              - namespace
              - alertname
          - source_matchers:
              - 'severity = warning'
            target_matchers:
              - 'severity = info'
              - 'watchdog!="true"'
            equal:
              - namespace
              - alertname
          - source_matchers:
              - 'alertname = InfoInhibitor'
            target_matchers:
              - 'severity = info'
              - 'watchdog!="true"'
            equal:
              - namespace
          - target_matchers:
              - 'alertname = InfoInhibitor'
      # U4: internal-only ingress at alert.sf.${BASE_DOMAIN} via Traefik internal-secure-chain.
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
          traefik.ingress.kubernetes.io/router.middlewares: traefik-internal-secure-chain@kubernetescrd
          cert-manager.io/cluster-issuer: wethecommon-prod-cert
        hosts:
          - alert.sf.${BASE_DOMAIN}
        paths:
          - /
        pathType: Prefix
        tls:
          - secretName: alertmanager-tls
            hosts:
              - alert.sf.${BASE_DOMAIN}
      alertmanagerSpec:
        # Cluster-wide AlertmanagerConfig discovery — matcher strategy `None`
        # disables the operator's default per-namespace matcher injection so the
        # CRD-rooted route applies as authored. See plan U1 + U3.
        alertmanagerConfigSelector: {}
        alertmanagerConfigMatcherStrategy:
          type: None
        retention: 120h
        replicas: 1
        externalLabels:
          cluster: cluster_main
          env: prod
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
    kubeEtcd:
      service:
        selector:
          component: kube-apiserver
      enabled: true
    kubeProxy:
      enabled: false
    prometheus:
      ingress:
        enabled: false
      prometheusSpec:
        disableCompaction: true
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        enableAdminAPI: true
        walCompression: true
        enableFeatures:
          - memory-snapshot-on-shutdown
        # Prometheus metrics retention time in PV.
        # retentionSize is the WAL+blocks cap Prometheus enforces; keep it
        # below the PVC size so head writes never run out of space. 2026-06-10:
        # PVC 60Gi → 100Gi, retentionSize 50GB → 80GB after WAL filled and
        # CrashLoopBacked off with "no space left on device" on /prometheus/wal.
        retention: 14d
        retentionSize: 80GB
        # External labels to add to any time series or
        # alerts when communicating with external systems
        externalLabels:
          cluster: cluster_main
          env: prod
        # High availability
        replicas: 1
        resources:
          requests:
            cpu: 100m
            memory: 500Mi
          limits:
            memory: 4Gi
            # storageSpec:
            #   volumeClaimTemplate:
            #     spec:
            #       resources:
            #         requests:
            #           storage: 60Gi
        # storageSpec:
        #   volumeClaimTemplate:
        #     spec:
        #       resources:
        #         requests:
        #           storage: 60Gi

        storageSpec:
          volumeClaimTemplate:
            spec:
              resources:
                requests:
                  # Bumped 60Gi → 100Gi 2026-06-10 after PVC filled.
                  # Prometheus Operator handles online PVC expansion via the
                  # Prometheus CR; underlying StorageClass (longhorn) supports
                  # online expansion.
                  storage: 100Gi
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      # 2026-08-03: node-exporter ran BestEffort (chart default leaves resources
      # unset), so it was starved first whenever the node came under pressure. At
      # 22 restarts it went to `up=0` while still reporting 1/1 Running -- the pod
      # looks healthy, the scrape endpoint simply stops answering. metrics-server
      # (0/1) went with it, so `node_load1` and `kubectl top` both returned EMPTY
      # during the media restore, exactly when load was highest and visibility
      # mattered most.
      #
      # Same failure as prometheus-operator earlier the same day: no CPU request ->
      # BestEffort -> starved -> observability dies precisely when it is needed.
      # A blank metric reads as "fine" unless you notice it is blank, which makes
      # this worse than an outright crash.
      #
      # No CPU limit, deliberately: CFS throttling would reintroduce the same
      # starvation it is meant to prevent. Memory is not compressible, so a cap
      # there is safe. Requests are small -- node-exporter is genuinely cheap; the
      # point is a scheduling guarantee, not capacity.
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 192Mi
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      # metricLabelsAllowlist:
      #   - pods=[*]
      #   - deployments=[*]
      #   - persistentvolumeclaims=[*]
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
      metricLabelsAllowlist:
        - pods=[*]
        - deployments=[*]
        - persistentvolumeclaims=[*]
    grafana:
      enabled: true
      forceDeployDashboards: true
      defaultDashboardsEnabled: true
      forceDeployDatasources: true
      adminPassword: admin
      persistence:
        enabled: true
        size: 2Gi
      ingress:
        enabled: true
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
          traefik.ingress.kubernetes.io/router.middlewares: traefik-internal-secure-chain@kubernetescrd
          cert-manager.io/cluster-issuer: wethecommon-prod-cert
        hosts:
          - grafana.${BASE_DOMAIN}
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.${BASE_DOMAIN}
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki.loki.svc.cluster.local:3100
          access: proxy
          isDefault: false
          jsonData:
            maxLines: 250
      imageRenderer:
        enabled: true
        replicas: 1
        image:
          repository: grafana/grafana-image-renderer
          tag: latest
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
    prometheusOperator:
      # 2026-08-03: the operator had restarted 68 times (49 on Jul 30 → 68 on Aug 3,
      # ~4.5/day and accelerating). It was NOT crashing — every termination was
      # exitCode 0 / reason "Completed", and the final log line each time was
      # "received SIGTERM, exiting gracefully". The kubelet was killing a healthy
      # process:
      #   1. the chart defaults prometheusOperator.resources to {} → BestEffort QoS,
      #      so on a contended node (82% CPU requests, 1320% CPU limits) this
      #      container is first in line to be starved of CPU, and
      #   2. the chart defaults both probes to timeoutSeconds: 1 — a 1s budget for a
      #      TLS handshake plus an HTTPS /healthz round trip. Under starvation the
      #      probe client gave up ("context deadline exceeded ... while awaiting
      #      headers"), 3 consecutive failures tripped the liveness threshold, and the
      #      container was SIGTERM'd.
      # This matters beyond the restart count: while the operator is down it does not
      # reconcile ServiceMonitors or PrometheusRules, so a rule can be correctly
      # committed to git and silently never reach Prometheus.
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
      # No cpu limit on purpose. CPU limits enforce CFS throttling even when the node
      # has idle cores, which would make probe timeouts MORE likely — the opposite of
      # the fix. Memory is not compressible, so capping memory is safe.
      livenessProbe:
        timeoutSeconds: 5
        failureThreshold: 5
      readinessProbe:
        timeoutSeconds: 5
    kubeControllerManager:
      enabled: true
      service:
        port: 10257
        targetPort: 10257
      serviceMonitor:
        enabled: true
        https: true
        insecureSkipVerify: true
    kubeScheduler:
      enabled: true
      service:
        port: 10259
        targetPort: 10259
      serviceMonitor:
        enabled: true
        https: true
        insecureSkipVerify: true
    autoscaling:
      vpa:
        enabled: false
