# Unit tests for prometheusrule-crowdsec.yaml (CrowdSec edge-security availability).
# CI (.github/workflows/prometheus-rules-ci.yaml) extracts that rule's .spec to
# prometheusrule-crowdsec-extracted.yaml in this directory, which this fixture loads.
# exp_annotations MUST match the rule's folded (>-) annotations byte-for-byte.
rule_files:
  - prometheusrule-crowdsec-extracted.yaml
evaluation_interval: 1m
tests:
  # LAPI at 0 available replicas for >5m → CrowdSecLapiDown (critical) fires.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="crowdsec", deployment="crowdsec-lapi"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: CrowdSecLapiDown
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: crowdsec
              deployment: crowdsec-lapi
            exp_annotations:
              summary: "CrowdSec LAPI is down — Traefik bouncer fails closed, all domains 403"
              description: "crowdsec-lapi has 0 available replicas. The Traefik CrowdSec bouncer runs in live mode and fails CLOSED: with no LAPI to query it returns 403 for every ingress request, taking down ALL internal domains. Fix: kubectl -n crowdsec scale deploy crowdsec-lapi --replicas=1 (it is drift — git declares LAPI running). Runbook: memory reference_crowdsec_lapi_zero_replica_403."

  # LAPI healthy (1 available) → no alert.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="crowdsec", deployment="crowdsec-lapi"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: CrowdSecLapiDown
        exp_alerts: []

  # Agent DaemonSet at 0 available for >15m → CrowdSecAgentDown (warning) fires.
  - interval: 1m
    input_series:
      - series: 'kube_daemonset_status_number_available{namespace="crowdsec", daemonset="crowdsec-agent"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 16m
        alertname: CrowdSecAgentDown
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: crowdsec
              daemonset: crowdsec-agent
            exp_annotations:
              summary: "CrowdSec agent is down — no new threat decisions"
              description: "crowdsec-agent (DaemonSet) has 0 available pods. Existing ban decisions still enforce, but no new Traefik-log-based detections are made. Often a downstream symptom of LAPI being down (the agent blocks on its wait-for-lapi init container). Check CrowdSecLapiDown first."
