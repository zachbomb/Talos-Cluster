groups:
  - name: ingress-health
    rules:
      # Traefik is the sole ingress for every app. If its metrics vanish the
      # dashboards go quiet rather than red, which is the failure mode that
      # let three CRITICALs run for nine hours earlier today.
      - alert: TraefikMetricsAbsent
        expr: absent(traefik_open_connections)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Traefik metrics have disappeared"
          description: >-
            No traefik_open_connections series. Either Traefik is down or its ServiceMonitor stopped matching. Every ingress dashboard is now blank rather than alarming, so treat a quiet board as suspect until this clears.
      - alert: TraefikHigh5xxRate
        expr: sum(rate(traefik_service_requests_total{code=~"5.."}[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Traefik is serving {{ $value | humanize }} 5xx/sec"
          description: >-
            Sustained server errors through the ingress. Check which service with `sum by (service) (rate(traefik_service_requests_total{code=~"5.."}[5m]))`.
  - name: dns-health
    rules:
      # Blocky can be running, healthy and answering while ad-blocking is
      # switched off - the failure is invisible from every liveness probe and
      # from uptime monitoring, because DNS still resolves. Only this flag
      # distinguishes "working" from "working as configured".
      - alert: BlockyBlockingDisabled
        expr: blocky_blocking_enabled == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Blocky DNS blocking is DISABLED"
          description: >-
            Blocky is resolving normally but not blocking. Nothing else in the stack can detect this: probes pass, queries succeed, uptime is green. Re-enable via the API or check whether a temporary disable was left in place.
      # Denylists that stop refreshing decay silently - the blocklist keeps
      # working with stale data and slowly stops matching new domains.
      - alert: BlockyListRefreshStale
        expr: (time() - max(blocky_last_list_group_refresh_timestamp_seconds)) > 172800
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Blocky denylists have not refreshed in over 2 days"
          description: >-
            Last successful list-group refresh was {{ $value | humanizeDuration }} ago. Blocking still works but against an ageing list.
      - alert: BlockyListDownloadFailing
        expr: sum(increase(blocky_failed_downloads_total[1h])) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Blocky failed to download a denylist"
          description: >-
            {{ $value }} failed list downloads in the last hour. Usually an upstream list host being unreachable; persistent failures lead to BlockyListRefreshStale.
      - alert: CoreDNSHighServfail
        expr: sum(rate(coredns_dns_responses_total{rcode="SERVFAIL"}[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CoreDNS returning {{ $value | humanize }} SERVFAIL/sec"
          description: >-
            In-cluster DNS is failing to resolve. This breaks service discovery for everything, and usually presents as unrelated apps throwing connection errors rather than as a DNS problem.
  - name: loadbalancer-health
    rules:
      # The MetalLB pool is 192.168.10.193-254 and every service IP is
      # pre-assigned in clusterenv.yaml. Exhaustion does not degrade - the
      # next LoadBalancer service simply never gets an address and sits
      # pending, which reads as an app deployment problem.
      - alert: MetalLBPoolNearExhausted
        expr: >-
          sum(metallb_allocator_addresses_in_use_total) / sum(metallb_allocator_addresses_total) > 0.9
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "MetalLB address pool {{ $value | humanizePercentage }} allocated"
          description: >-
            Was 63% when this rule was written. At exhaustion the next LoadBalancer service stays Pending forever with no error that names MetalLB.
      - alert: MetalLBConfigStale
        expr: max(metallb_k8s_client_config_stale_bool) == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "MetalLB is running on stale configuration"
          description: >-
            MetalLB could not load current config and is serving the last known good one. IP assignments will not reflect the repo until this clears.
      - alert: MetalLBUpdateErrors
        expr: sum(increase(metallb_k8s_client_update_errors_total[1h])) > 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "MetalLB has {{ $value }} k8s update errors in the last hour"
  - name: tunnel-health
    rules:
      # cloudflared runs 4 HA connections. Losing some is survivable and
      # invisible to users; losing all takes external access down.
      - alert: CloudflaredTunnelDegraded
        expr: sum(cloudflared_tunnel_ha_connections) < 4
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Cloudflare tunnel down to {{ $value }} of 4 HA connections"
          description: >-
            Still serving, with less redundancy. Sustained degradation usually precedes a full tunnel drop.
      - alert: CloudflaredTunnelDown
        expr: sum(cloudflared_tunnel_ha_connections) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Cloudflare tunnel has NO connections"
          description: >-
            All external access through the tunnel is down. Internal access via Traefik is unaffected, so this can go unnoticed from inside the network entirely.
  - name: unifi-telemetry-health
    rules:
      # 2026-08-17: a UDM firmware/application update took the UniFi Network
      # application down for ~2h (~21:20Z-23:20Z). unpoller could not
      # re-authenticate (502 from /proxy/network/status) but kept serving its
      # last good snapshot, so up{job="unpoller"} stayed 1 the entire time,
      # nothing alerted, and dashboards showed confident, partly-stale
      # numbers. A scrape-health alert is structurally blind to this failure
      # mode - the exporter is healthy, its UPSTREAM is not.
      #
      # Detector: unpoller_device_uptime_seconds for the UDM advances 1s/s
      # while data is live. Measured against real Prometheus data,
      # delta(...[15m]) was 899.99 healthy (~900 = 100% of wall clock) and
      # 602.14 mid-outage (~67% - roughly 1 in 3 collection cycles failing).
      # The snapshot was DEGRADED, not frozen, so `== 0` or
      # `changes() == 0` detectors would have missed the incident entirely.
      # The threshold must sit between 602 and 900; 765 fires below 85% of
      # wall clock. Do NOT "tidy" this to == 0 - that silently reverts it to
      # a detector proven to miss the real incident.
      #
      # Selector: type="udm", NOT the name label - the device name contains
      # a Unicode right single quotation mark (U+2019), so an exact name
      # match is a churn trap. Verified live 2026-08-17: {type="udm"}
      # returns exactly one series.
      #
      # The resets() gate deliberately excludes device reboots: a reboot
      # resets uptime, driving the delta hugely negative for the 15m the
      # reset stays in the window. That is a different event with different
      # meaning, so it gets its own alert (UDMRebooted below) instead of
      # false-firing this one. If telemetry stays degraded after the reset
      # leaves the window, this rule fires on its own.
      - alert: UnifiTelemetryStale
        expr: >-
          delta(unpoller_device_uptime_seconds{type="udm"}[15m]) < 765 and resets(unpoller_device_uptime_seconds{type="udm"}[15m]) == 0
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: "UniFi telemetry is stale — unpoller is re-serving old controller data"
          description: >-
            UDM uptime advanced less than 765s over 15m (measured: ~900 healthy, 602 during the 2026-08-17 Network application outage this rule exists to catch). The UniFi Network application is failing some or all of unpoller's collection cycles while unpoller re-serves its last good snapshot, so up stays 1 and dashboards keep rendering stale numbers. Observability degradation ONLY - the router is still routing and the internet is fine. Check the Network application on the UDM; last time this was a UniFi OS application update mid-install.
      # A reboot is worth knowing about (brief connectivity blip, and it
      # suppresses UnifiTelemetryStale while the uptime reset is in-window),
      # but it is not stale telemetry, so it gets its own alert and text
      # rather than false-firing the staleness rule on a negative delta.
      # info severity: expected during planned firmware updates.
      - alert: UDMRebooted
        expr: resets(unpoller_device_uptime_seconds{type="udm"}[15m]) > 0
        labels:
          severity: info
        annotations:
          summary: "UDM rebooted — uptime counter reset"
          description: >-
            unpoller-reported UDM uptime decreased within the last 15m, i.e. the router restarted. Auto-resolves once the reset leaves the 15m window. While this fires, UnifiTelemetryStale is deliberately suppressed; if telemetry stays degraded after the reboot it will fire on its own.
      # If unpoller stops exporting the UDM series altogether, delta()
      # returns no samples and UnifiTelemetryStale silently never fires -
      # the same silent-gap class this group exists to close.
      - alert: UnifiTelemetryAbsent
        expr: absent(unpoller_device_uptime_seconds{type="udm"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "UniFi UDM telemetry series is missing entirely"
          description: >-
            No unpoller_device_uptime_seconds series with type="udm" at all. Either unpoller is down or unscraped, or the device labels changed. Staleness detection is blind until this clears. Observability only - no evidence of user impact by itself.
