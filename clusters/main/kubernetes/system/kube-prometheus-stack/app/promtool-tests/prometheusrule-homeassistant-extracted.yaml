groups:
  - name: homeassistant-battery-low
    rules:
      # ---- Locks: warn <=35%, critical <=15%. Garage excluded (retired
      # hardware, nonsense -100 reading — see file header).
      - alert: HomeAssistantLockBatteryLow
        expr: >-
          (homeassistant_sensor_battery_percent{entity=~"sensor\\.device_lock_.*_battery", entity!~"sensor\\.device_lock_garage_house_door_lock_battery"} <= 35) unless on() (up{job="homeassistant"} == 0)
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.friendly_name }} is at {{ $value }}% — replace soon"
          description: >-
            A door/gate lock battery has been at or below 35% for 6h straight. Lock batteries decline gradually, so this is an early warning with weeks of runway, not an emergency — but a dead lock battery is a physical-access failure, so don't let it slide. Replace the battery in {{ $labels.friendly_name }}.
      - alert: HomeAssistantLockBatteryCritical
        expr: >-
          (homeassistant_sensor_battery_percent{entity=~"sensor\\.device_lock_.*_battery", entity!~"sensor\\.device_lock_garage_house_door_lock_battery"} <= 15) unless on() (up{job="homeassistant"} == 0)
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.friendly_name }} is at {{ $value }}% — replace now"
          description: >-
            A door/gate lock battery has been at or below 15% for 1h straight. This is the class this ticket exists to protect: the garage lock's battery reached -100% with nothing having ever alerted on its way down. Replace the battery in {{ $labels.friendly_name }} before it fails.
      # ---- Zigbee/RF control accessories: warn <=15%, critical <=5%.
      - alert: HomeAssistantControlBatteryLow
        expr: >-
          (homeassistant_sensor_battery_percent{entity=~"sensor\\.device_remote.*|sensor\\.device_remotes.*|sensor\\..*dimmer.*_battery.*|sensor\\..*module.*_battery.*|sensor\\.curtain_2_3_5fb59b_w070160x_batt|sensor\\.0x001788010cc1d8af_battery", entity!~"sensor\\.home_house_first_floor_living_room_device_switch_wall_switch_wall_module_entry_module_battery_2"} <= 15) unless on() (up{job="homeassistant"} == 0)
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.friendly_name }} is at {{ $value }}% — replace soon"
          description: >-
            A Zigbee/RF control accessory (dimmer, wall module, remote, or curtain motor) battery has been at or below 15% for 6h straight. Losing this degrades a light or blind control, not security — replace at your convenience.
      - alert: HomeAssistantControlBatteryCritical
        expr: >-
          (homeassistant_sensor_battery_percent{entity=~"sensor\\.device_remote.*|sensor\\.device_remotes.*|sensor\\..*dimmer.*_battery.*|sensor\\..*module.*_battery.*|sensor\\.curtain_2_3_5fb59b_w070160x_batt|sensor\\.0x001788010cc1d8af_battery", entity!~"sensor\\.home_house_first_floor_living_room_device_switch_wall_switch_wall_module_entry_module_battery_2"} <= 5) unless on() (up{job="homeassistant"} == 0)
        for: 2h
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.friendly_name }} is at {{ $value }}% — replace now"
          description: >-
            A Zigbee/RF control accessory battery has been at or below 5% for 2h straight and is about to stop responding. Replace {{ $labels.friendly_name }}'s battery.
      # ---- Catch-all: anything numeric that isn't excluded and isn't
      # already classified above. Warn <=20%, critical <=10%. Keeps a
      # future battery sensor from being silently uncovered.
      - alert: HomeAssistantBatteryLow
        expr: >-
          ((homeassistant_sensor_battery_percent{entity!~"sensor\\.device_lock_garage_house_door_lock_battery|sensor\\.living_room_cat_feeder_battery_ac|sensor\\.device_phone_.*|sensor\\.max_jr_battery_level|sensor\\.home_house_first_floor_living_room_device_switch_wall_switch_wall_module_entry_module_battery_2|sensor\\.bluetooth_bbq_thermometer_.*_batt|sensor\\.service_data_3971fa_servicedata_batt"} unless homeassistant_sensor_battery_percent{entity=~"sensor\\.device_lock_.*_battery"} unless homeassistant_sensor_battery_percent{entity=~"sensor\\.device_remote.*|sensor\\.device_remotes.*|sensor\\..*dimmer.*_battery.*|sensor\\..*module.*_battery.*|sensor\\.curtain_2_3_5fb59b_w070160x_batt|sensor\\.0x001788010cc1d8af_battery"}) <= 20) unless on() (up{job="homeassistant"} == 0)
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.friendly_name }} is at {{ $value }}% — replace soon"
          description: >-
            An unclassified Home Assistant battery sensor has been at or below 20% for 6h straight. This entity doesn't match the lock or control-accessory class regexes in prometheusrule-homeassistant.yaml — worth adding it to a class next time this file is touched, but the catch-all threshold covers it in the meantime.
      - alert: HomeAssistantBatteryCritical
        expr: >-
          ((homeassistant_sensor_battery_percent{entity!~"sensor\\.device_lock_garage_house_door_lock_battery|sensor\\.living_room_cat_feeder_battery_ac|sensor\\.device_phone_.*|sensor\\.max_jr_battery_level|sensor\\.home_house_first_floor_living_room_device_switch_wall_switch_wall_module_entry_module_battery_2|sensor\\.bluetooth_bbq_thermometer_.*_batt|sensor\\.service_data_3971fa_servicedata_batt"} unless homeassistant_sensor_battery_percent{entity=~"sensor\\.device_lock_.*_battery"} unless homeassistant_sensor_battery_percent{entity=~"sensor\\.device_remote.*|sensor\\.device_remotes.*|sensor\\..*dimmer.*_battery.*|sensor\\..*module.*_battery.*|sensor\\.curtain_2_3_5fb59b_w070160x_batt|sensor\\.0x001788010cc1d8af_battery"}) <= 10) unless on() (up{job="homeassistant"} == 0)
        for: 2h
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.friendly_name }} is at {{ $value }}% — replace now"
          description: >-
            An unclassified Home Assistant battery sensor has been at or below 10% for 2h straight. Replace {{ $labels.friendly_name }}'s battery.
  - name: homeassistant-battery-unavailable
    rules:
      # Separate rule/metric/`for:` from the LOW group above by design —
      # contract #4. Matches any battery-named entity (not just the ones
      # with a numeric class above) so binary_sensor battery-status
      # entities are covered too. Retirement-excluded entities are dropped
      # here too, or this would immediately re-fire forever on the PetKit
      # feeder and the same "mute it before it ever reports something
      # real" trap the ticket warns about.
      - alert: HomeAssistantBatteryUnavailable
        expr: >-
          (homeassistant_entity_available{entity=~".*battery.*"} == 0 unless on(entity) homeassistant_entity_available{entity=~"sensor\\.device_lock_garage_house_door_lock_battery|sensor\\.living_room_cat_feeder_battery_ac|binary_sensor\\.living_room_cat_feeder_battery_status|sensor\\.bluetooth_bbq_thermometer_.*_batt|sensor\\.service_data_3971fa_servicedata_batt|sensor\\.home_house_first_floor_living_room_device_switch_wall_switch_wall_module_entry_module_battery_2"}) unless on() (up{job="homeassistant"} == 0)
        for: 4h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.friendly_name }} battery sensor has been unavailable for 4h+"
          description: >-
            {{ $labels.friendly_name }} has reported no usable battery value for at least 4h — long enough to rule out a routine HA restart. This is a device that has left the mesh, not a low battery — check whether it's reachable before assuming a battery swap will fix it.
  - name: homeassistant-battery-disappeared
    rules:
      # Disappearance is a THIRD failure mode, distinct from "unavailable"
      # above: the entity's metric series stops existing in Prometheus at
      # all, rather than reporting available=0. This is what actually
      # happened to the garage lock's `lock.` entity. Hardcoded count (2:
      # front door + front gate) rather than absent() over the class regex
      # — see file header for why absent() over multiple entities is the
      # wrong tool here. Update the count AND the regex together if a lock
      # is added or removed.
      - alert: HomeAssistantLockBatteryDisappeared
        expr: >-
          (count(homeassistant_sensor_battery_percent{entity=~"sensor\\.device_lock_.*_battery", entity!~"sensor\\.device_lock_garage_house_door_lock_battery"} or homeassistant_entity_available{entity=~"sensor\\.device_lock_.*_battery", entity!~"sensor\\.device_lock_garage_house_door_lock_battery"}) < 2) unless on() (up{job="homeassistant"} == 0)
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "A tracked lock battery sensor has disappeared from Home Assistant"
          description: >-
            Fewer than 2 of the tracked lock battery sensors (front door, front gate) are present in Home Assistant's state machine — one has dropped out entirely rather than reporting a value. This is the garage-lock failure mode: the entity stops existing rather than reading low. Check Settings → Devices in Home Assistant for a removed or renamed lock device.
