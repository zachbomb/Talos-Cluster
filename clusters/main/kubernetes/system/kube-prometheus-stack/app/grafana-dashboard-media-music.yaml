---
# Media - Music
#
# Generated by tools/dashboards/gen_media_domains.py - edit that, not this.
#
# Lidarr only (three instances: Main, FLAC, Liz - summed). No
# serving-side metrics exist for music: Emby exports no music counts
# and sessions are unlabelled. The library is majority-holes by
# construction, so missing-counts are deliberately uncoloured and the
# completeness ratio carries the health signal.
#
# Four-questions layout per tools/dashboards/dashlib.py. Every
# expr validated against live Prometheus; none render "No data".
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-media-music
  namespace: kube-prometheus-stack
  labels:
    grafana_dashboard: "1"
data:
  media-music.json: |-
    {
      "title": "Media - Music",
      "uid": "media-music",
      "tags": [
        "media",
        "domain"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "type": "row",
          "title": "1 - Is it broken right now?",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "state-timeline",
          "title": "Media exporters - up/down history",
          "description": "Every media scrape target, replacing per-exporter guard tiles: if a strip goes red or gappy, that exporter's numbers on this board are stale. Gaps are scrape gaps, shown on purpose.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 0,
                "fillOpacity": 70,
                "spanNulls": false
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "down",
                      "color": "red",
                      "index": 0
                    },
                    "1": {
                      "text": "up",
                      "color": "green",
                      "index": 1
                    }
                  }
                }
              ],
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "showValue": "never",
            "alignValue": "center",
            "mergeValues": true,
            "rowHeight": 0.85,
            "legend": {
              "showLegend": false
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "up{namespace=\"media\"}",
              "refId": "A",
              "legendFormat": "{{pod}} {{probe}}"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Lidarr health issues",
          "description": "Lidarr is the only *arr exporting its own health-check count (summed across the three instances). Non-zero means it is telling you something in its UI. vector(0) legal: metric confirmed; empty means no issues, which must render green.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(lidarr_system_health_issues) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ]
        },
        {
          "type": "table",
          "title": "Firing in media",
          "description": "Namespace is the finest alert scope that exists today; a domain-scoped Q1 would need domain labels added to the media PrometheusRules (a rule change, not a metric gap).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "filterable": true
              },
              "noValue": "No alerts firing - nothing is broken right now",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "severity"
                },
                "properties": [
