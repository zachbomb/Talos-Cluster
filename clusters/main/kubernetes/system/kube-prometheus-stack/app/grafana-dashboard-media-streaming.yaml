# Media - Streaming
#
# Generated by tools/dashboards/gen_media_services.py - edit that, not this.
#
# Delivery to a human: Plex, Emby, Tunarr. The purpose metric here is streams and how many are transcoding - a Plex at 3% CPU with every
# stream failing looks perfectly healthy on an infrastructure board.
#
# Four-questions layout per tools/dashboards/dashlib.py. Every
# expr validated against live Prometheus; none render "No data".
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-media-streaming
  namespace: kube-prometheus-stack
  labels:
    grafana_dashboard: "1"
data:
  media-streaming.json: |-
