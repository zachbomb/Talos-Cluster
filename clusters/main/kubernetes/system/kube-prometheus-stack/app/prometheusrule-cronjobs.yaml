---
# CronJob health. The cluster ran 12 scheduled jobs with ZERO alerting on any of
# them until 2026-08-06.
#
# WHY THIS EXISTS: talos-backup (etcd snapshots) failed every run for an unknown
# period — the MinIO bucket it uploaded to did not exist — and nothing noticed.
# It was found by accident during unrelated post-cutover triage. See SQ-38.
#
# WHY STALENESS, NOT FAILURE COUNT: kube_job_status_failed lingers on completed
# Job objects long after the fact (8 such series were present when this was
# written, some days old), so `> 0` would fire permanently and be ignored within
# a week. Time-since-last-success cannot rot that way and is exactly the signal
# that was missing.
#
# WHY THRESHOLDS KEY OFF THE SCHEDULE LABEL: kube_cronjob_info carries the cron
# expression. Matching its shape rather than a hardcoded job list means a new
# CronJob is covered the moment it is created, with no rule edit. Character
# classes ([*]) are used instead of backslash escapes so the regex survives YAML
# and Flux substitution unmangled.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cronjobs
  namespace: kube-prometheus-stack
  labels:
    app.kubernetes.io/part-of: kube-prometheus-stack
spec:
  groups:
    - name: cronjob-health
      rules:
        # The strongest signal, and the one that would have caught talos-backup at
        # its worst: the CronJob exists but has NO successful run on record at all.
        - alert: CronJobNeverSucceeded
          expr: >-
            kube_cronjob_info
            unless on (namespace, cronjob)
            kube_cronjob_status_last_successful_time
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has NEVER succeeded"
            description: >-
              No successful completion is recorded for this CronJob (schedule
              {{ $labels.schedule }}). This is the talos-backup failure mode: the job
              runs on time, fails every time, and looks scheduled-and-healthy from the
              outside. Check `kubectl logs -n {{ $labels.namespace }} -l job-name=...`
              for the most recent attempt.

        # Sub-hourly: */N * * * *  — cloudflare-ddns, udm-memory-guard, tunarr-token-heal.
        # These run at least every 15 minutes, so an hour of silence is several misses.
        - alert: CronJobStaleFrequent
          expr: >-
            (
              (time() - kube_cronjob_status_last_successful_time) > 3600
            )
            and on (namespace, cronjob)
            kube_cronjob_info{schedule=~"^[*]/.*"}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has not succeeded in over an hour"
            description: >-
              Scheduled {{ $labels.schedule }} but last succeeded
              {{ $value | humanizeDuration }} ago. cloudflare-ddns failing silently
              breaks remote access; tunarr-token-heal failing lets Plex tokens expire.

        # N-hourly: e.g. 0 */6 * * * — talos-backup. 13h is two missed runs.
        - alert: CronJobStaleHourly
          expr: >-
            (
              (time() - kube_cronjob_status_last_successful_time) > 46800
            )
            and on (namespace, cronjob)
            kube_cronjob_info{schedule=~"^[0-9]+ [*]/.*"}
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has missed multiple runs"
            description: >-
              Scheduled {{ $labels.schedule }} but last succeeded
              {{ $value | humanizeDuration }} ago — at least two consecutive misses.
              For talos-backup this means the cluster has no fresh etcd snapshot.

        # Daily: e.g. 40 2 * * * — longhorn snapshot/trim family, node-fstrim,
        # unifi-reconcile. 26h allows one late run without crying wolf.
        - alert: CronJobStaleDaily
          expr: >-
            (
              (time() - kube_cronjob_status_last_successful_time) > 93600
            )
            and on (namespace, cronjob)
            kube_cronjob_info{schedule=~"^[0-9]+ [0-9]+ [*] [*] [*]$"}
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Daily CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has not succeeded in over a day"
            description: >-
              Scheduled {{ $labels.schedule }} but last succeeded
              {{ $value | humanizeDuration }} ago. The longhorn snapshot jobs failing
              means volume snapshots are silently not being taken.

        # Weekly: e.g. 0 4 * * 0 — node-image-prune, instance-manager-rotation.
        # 8 days allows a full missed window plus slack.
        - alert: CronJobStaleWeekly
          expr: >-
            (
              (time() - kube_cronjob_status_last_successful_time) > 691200
            )
            and on (namespace, cronjob)
            kube_cronjob_info{schedule=~"^[0-9]+ [0-9]+ [*] [*] [0-9]"}
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "Weekly CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has skipped a week"
            description: >-
              Scheduled {{ $labels.schedule }} but last succeeded
              {{ $value | humanizeDuration }} ago.

    # Replacement for the chart's KubeJobFailed, which is disabled in
    # helm-release.yaml (defaultRules.disabled).
    #
    # THE PROBLEM WITH THE ORIGINAL: `kube_job_failed > 0` with no time bound.
    # A Job object that failed once carries that series for as long as the
    # object exists, and CronJob failedJobsHistoryLimit keeps failed Jobs
    # indefinitely. On 2026-08-06 it was firing 8 times for failures dated
    # Jul 26 - Aug 6; every one had already been followed by a successful run
    # of the same CronJob. The count tracked history limits (3 ddns + 2
    # longhorn + 3 unifi), not anything broken. Three genuine CRITICALs were
    # sitting underneath that noise.
    #
    # TWO ARMS, because the two kinds of Job fail differently:
    #
    #   Arm 1 (CronJob-owned): fire only if the owning CronJob has NOT
    #     succeeded since this Job was created. A */5 job that blipped once
    #     and has succeeded 60 times since is not an incident. The join walks
    #     kube_job_owner to attach owner_name, then label_replace renames
    #     `cronjob` to `owner_name` so the two can be compared.
    #
    #   Arm 2 (everything else): VolSync movers and other one-shot Jobs have
    #     owner_kind=None and no CronJob to check for recovery, so they use a
    #     plain 24h window. This arm is why the chart rule was replaced rather
    #     than simply deleted - the CronJobStale* rules above do not cover
    #     these, and 3 such Jobs exist in this cluster.
    #
    # VALIDATED when written: the full expression returned 0 series against
    # all 8 stale failures, and the same join WITHOUT the recovery suppression
    # returned all 8 - a positive control proving the join matches rather than
    # silently failing to.
    - name: job-health
      rules:
        - alert: KubeJobFailedRecent
          expr: |-
            (
              (
                kube_job_created
                * on(namespace, job_name) group_left(owner_name)
                (
                  kube_job_owner{owner_kind="CronJob"}
                  and on(namespace, job_name) (kube_job_status_failed > 0)
                )
              )
              > on(namespace, owner_name) group_left()
              label_replace(kube_cronjob_status_last_successful_time, "owner_name", "$1", "cronjob", "(.*)")
            )
            or
            (
              kube_job_status_failed > 0
              and on (namespace, job_name) (time() - kube_job_created < 86400)
              unless on (namespace, job_name) kube_job_owner{owner_kind="CronJob"}
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed and has not recovered"
            description: >-
              This Job failed and, if it belongs to a CronJob, that CronJob has
              not had a successful run since. Unlike the chart's KubeJobFailed
              this cannot rot: it clears as soon as a later run succeeds, or
              after 24h for one-shot Jobs. Check
              `kubectl describe job -n {{ $labels.namespace }} {{ $labels.job_name }}`
              and note that failed Job pods are often garbage-collected, so logs
              may already be gone.
