# Media - Acquisition
#
# Generated by tools/dashboards/gen_media_services.py - edit that, not this.
#
# Deciding what is missing and getting it: Sonarr, Radarr, Lidarr,
# Readarr, Bazarr. These metrics existed in Prometheus for months while
# thousands of missing episodes and cutoff-unmet films went unshown.
#
# Four-questions layout per tools/dashboards/dashlib.py. Every
# expr validated against live Prometheus; none render "No data".
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-media-acquisition
  namespace: kube-prometheus-stack
  labels:
    grafana_dashboard: "1"
data:
