---
# Cluster overview dashboard -- the "is anything wrong right now" board.
#
# WHY THE ALERT TABLE IS PANEL ONE: on 2026-08-06 three CRITICAL alerts
# (TrueNASDiskCountDrop, TrueNASCriticalAlerts, TrueNASPoolDegraded) fired for
# roughly nine hours while cluster health was being reported as green from
# hand-picked metrics. The alerting was correct the whole time; nothing
# surfaced it. Any board that puts curated metrics above ALERTS repeats that.
#
# EVERY expr here was run against live Prometheus before being committed --
# the standing rule for this dashboard is no `No data` panels.
#
# `or vector(0)` appears only on metrics CONFIRMED to exist. It turns "empty
# because nothing is broken" into a green zero. It must never be added to an
# unverified metric: gotk_resource_info{ready="False"} does not exist in this
# cluster, and with the same fallback it reported a confident, meaningless 0.
#
# No `$` appears in the JSON below (fixed [5m] windows, hardcoded datasource
# uid). Flux's postBuild substitution is applied to this Kustomization via the
# flux-entry patch; undefined vars are verifiably passed through untouched,
# but a future cluster-config key could collide with a Grafana token, and
# avoiding `$` entirely removes that whole class of breakage.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cluster-overview
  namespace: kube-prometheus-stack
  labels:
    grafana_dashboard: "1"
data:
  cluster-overview.json: |-
