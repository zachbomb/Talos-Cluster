---
# Availability alerts for the CrowdSec edge-security path (Traefik bouncer → LAPI).
#
# WHY THIS EXISTS: the Traefik CrowdSec bouncer runs in `live` mode, which FAILS
# CLOSED — if it cannot reach CrowdSec LAPI it returns HTTP 403 for EVERY request
# before it reaches any app. On 2026-07-27 `crowdsec-lapi` was found scaled to 0
# (drift, unnoticed for days) and every internal domain 403'd, yet nothing alerted.
# These are that missing backstop. See memory
# reference_crowdsec_lapi_zero_replica_403 + .claude/rules/traefik-crowdsec.md.
#
# Unit-tested by promtool-tests/crowdsec-availability-test.yaml (CI:
# .github/workflows/prometheus-rules-ci.yaml). Keep annotations byte-identical
# between this file and that fixture's exp_annotations.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: crowdsec-availability
  namespace: kube-prometheus-stack
spec:
  groups:
    - name: crowdsec-availability
      rules:
        - alert: CrowdSecLapiDown
          expr: |
            kube_deployment_status_replicas_available{namespace="crowdsec", deployment="crowdsec-lapi"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CrowdSec LAPI is down — Traefik bouncer fails closed, all domains 403"
            description: >-
              crowdsec-lapi has 0 available replicas. The Traefik CrowdSec bouncer
              runs in live mode and fails CLOSED: with no LAPI to query it returns 403
              for every ingress request, taking down ALL internal domains. Fix: kubectl
              -n crowdsec scale deploy crowdsec-lapi --replicas=1 (it is drift — git
              declares LAPI running). Runbook: memory
              reference_crowdsec_lapi_zero_replica_403.
        - alert: CrowdSecAgentDown
          expr: |
            kube_daemonset_status_number_available{namespace="crowdsec", daemonset="crowdsec-agent"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "CrowdSec agent is down — no new threat decisions"
            description: >-
              crowdsec-agent (DaemonSet) has 0 available pods. Existing ban decisions
              still enforce, but no new Traefik-log-based detections are made. Often a
              downstream symptom of LAPI being down (the agent blocks on its
              wait-for-lapi init container). Check CrowdSecLapiDown first.
