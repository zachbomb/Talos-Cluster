apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb
spec:
  interval: 5m
  chart:
    spec:
      chart: metallb
      version: 0.16.1
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    prometheus:
      serviceAccount: metallb-controller
      namespace: metallb
      serviceMonitor:
        enabled: true
    # Phase 0 of the MetalLB→Cilium consolidation (2026-06-10).
    # MetalLB is kept ONLY for IPAM (the controller allocates LoadBalancer
    # IPs from the IPAddressPools in core/metallb-config). Both announcement
    # backends are disabled because they are inert and redundant:
    #   - speaker (L2/ARP): announces nothing — no L2Advertisement exists
    #     (removed 2026-05-05). Cilium L2 (default-l2-policy) is the sole
    #     announcer, with per-service cilium-l2announce-* leases.
    #   - frrk8s (BGP): 0 BGPPeers/Advertisements, "BGP instance not found".
    #     Cilium BGP (CiliumBGPClusterConfig udm-bgp) handles BGP, session
    #     established to the UDM-SE advertising the LB /32s.
    # frrk8s was the source of chronic restart churn (427 over 15d).
    # Full removal (migrate IPAM to Cilium LB-IPAM) is the planned phases
    # 1-3 in docs/runbooks/metallb-to-cilium-migration-assessment.md.
    controller:
      enabled: true
      # 2026-08-04 (SQ-5): the controller ran BestEffort (chart default
      # `controller.resources: {}`) and had 13 restarts. With speaker and frrk8s
      # both disabled above, this single pod IS MetalLB — it is the sole allocator
      # of LoadBalancer IPs from the IPAddressPools. Starving it means new/changed
      # LoadBalancer services never get an address, and every ingress path in the
      # cluster terminates on a MetalLB-assigned IP.
      #
      # Sized from measurement: observed 3m CPU / 85Mi. The request is a scheduling
      # guarantee, not a capacity reservation. No CPU limit — CFS throttling would
      # recreate the starvation this prevents. See
      # [[besteffort-control-plane-starvation]].
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 256Mi
    speaker:
      enabled: false
    frrk8s:
      enabled: false