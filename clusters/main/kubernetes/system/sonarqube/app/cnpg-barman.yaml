---
apiVersion: v1
kind: Secret
metadata:
  name: sonarqube-db-s3-creds
  namespace: sonarqube
type: Opaque
stringData:
  ACCESS_KEY_ID: ${S3ID}
  ACCESS_SECRET_KEY: ${S3KEY}
---
# 03:30 daily — staggered from goodmem (03:00) per plan to avoid MinIO contention.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: sonarqube-db-daily
  namespace: sonarqube
spec:
  # 2026-09-07: 5-field -> 6-FIELD cron. CNPG's ScheduledBackup does NOT use
  # Kubernetes CronJob syntax -- the CRD's own field description says it
  # "includes an additional seconds specifier" (robfig/cron), i.e.
  #   sec min hour dom mon dow
  #
  # Written 5-field, "30 3 * * *" parsed as sec=30 min=3 hour=* and fired
  # EVERY HOUR instead of daily. Measured, not inferred: triparr-bot created
  # 24 backup objects in 24 hours, all at a fixed minute, one per hour.
  #
  # Consequence: 24x the intended backup I/O, and goodmem + immich both landed
  # on :03 so THREE databases (one of them 120GB) backed up simultaneously every
  # hour. This saturated the single shared SSD and is the most likely trigger of
  # the repeated Longhorn instance-manager cascades on 2026-09-05 and 09-07.
  # See docs/dr/sonarqube-wal-deadlock-2026-09-07.md for the surrounding work.
  schedule: "0 30 3 * * *"
  backupOwnerReference: self
  cluster:
    name: sonarqube-db
  method: barmanObjectStore
  # 2026-09-07: prefer-standby -> primary. The cluster runs `instances: 1`, so
  # there has never BEEN a standby to prefer. CNPG does fall back to the
  # primary, so this is not proven to be the cause of the 117 consecutive
  # backup failures (0 of 118 have ever succeeded, since 2026-05-14) -- but on
  # a single-instance cluster it is a misleading no-op, and removing it takes
  # one variable out of the diagnosis. Restore prefer-standby if this ever
  # gains a replica.
  target: primary
