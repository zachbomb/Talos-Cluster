---
# CNPG Postgres 17 cluster backing SonarQube.
#
# Plan: docs/plans/2026-05-05-001-feat-cluster-network-roadmap-plan.md (U10)
#
# SonarQube only stores metadata in Postgres (issues, projects, users); the
# bulk of its analysis state lives in its own filesystem PVC. Storage 10Gi
# is generous; tune later based on backup-audit history.
#
# Standard CNPG image (no pgvector / no vchord) — SonarQube doesn't need
# vector extensions. uuid-ossp is the only extension required.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sonarqube-db
  namespace: sonarqube
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5-bookworm@sha256:89e09df1966a124cd8e015d16f8e888809e5560a3df2900c91433f73176a0b2d
  postgresql:
    parameters:
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      max_connections: "100"
    pg_hba:
      - host all all 10.0.0.0/8 md5
      - host all all 172.16.0.0/16 md5
  bootstrap:
    initdb:
      database: sonarqube
      owner: sonarqube_user
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp"
  # 2026-09-07: 10Gi -> 20Gi. The cluster wedged itself SHUT at 101% full
  # ("Not enough disk space" / "Not enough WAL disk space, avoid starting
  # PostgreSQL"). Mechanism, and it is a deadlock:
  #
  #   WAL archiving stopped 2026-05-14T23:12Z (47 WAL objects archived that
  #   day, then nothing for ~4 months) -> PostgreSQL cannot recycle a WAL
  #   segment until it is archived -> WAL accumulated on THIS volume, because
  #   there is no separate walStorage -> volume hit 100% on 2026-09-05 ->
  #   PostgreSQL refuses to start on low disk -> it cannot archive -> WAL
  #   never drains. Self-sustaining.
  #
  # Ruled out with evidence: MinIO is up (health 200), bucket cnpg-sonarqube
  # exists, the credentials work, and goodmem/triparr/immich all archive to
  # the SAME endpoint successfully. The fault is specific to this cluster.
  #
  # 20Gi is headroom, not a sizing decision. After the fix the real footprint
  # is tiny: 707MB total (base 66MB + WAL 641MB) = 4% of the volume. The 9.7GB
  # was ALL stranded WAL.
  storage:
    size: 20Gi

  # THE RECURRENCE FIX. Without a separate WAL volume, unarchivable WAL grows
  # on the DATA volume until PostgreSQL cannot start -- which is exactly the
  # deadlock described above, and it took four months to arrive silently.
  #
  # With WAL on its own volume the same archiving failure fills only THIS
  # volume. PostgreSQL still stops, but the data volume stays healthy and the
  # failure is isolated and obvious rather than terminal.
  #
  # 8Gi, not 2Gi: a 2Gi WAL volume fills in days on an active cluster (learned
  # the hard way elsewhere in this cluster). 8Gi held the entire 4-month
  # stranded backlog here (9.7GB peak) with only a little to spare, so it is
  # sized against a real observed worst case rather than a guess.
  #
  # Verified accepted by the CNPG 1.30 validating webhook via
  # `kubectl apply --dry-run=server` before committing. Adding walStorage to a
  # live cluster makes the operator provision a new PVC and recycle the
  # instance, so expect a brief sonarqube outage on reconcile.
  #
  # NOTE: no other CNPG cluster here (goodmem, triparr, immich) has walStorage.
  # They are exposed to the same failure mode. Not changed in this commit --
  # they are healthy, and one blast radius at a time.
  walStorage:
    size: 8Gi
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-sonarqube/
      endpointURL: ${S3URL}
      s3Credentials:
        accessKeyId:
          name: sonarqube-db-s3-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: sonarqube-db-s3-creds
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"
  monitoring:
    # Postgres server metrics (cnpg_*/pg_*) via CNPG native exporter :9187;
    # Prometheus podMonitorSelector={} auto-scrapes the operator PodMonitor.
    enablePodMonitor: true
