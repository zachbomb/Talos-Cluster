apiVersion: v1
kind: ConfigMap
metadata:
  name: truenas-exporter-script
  namespace: truenas-exporter
data:
  exporter.py: |
    #!/usr/bin/env python3
    """TrueNAS pool-health Prometheus exporter.
    
    Polls the TrueNAS REST API and serves Prometheus metrics on :9100/metrics.
    Stdlib only - no pip installs at runtime.
    
    Exists because TrueNAS 25.04 has NO native Prometheus exporter (only Graphite),
    and pool Pibbs-Horde ran DEGRADED with zero RAIDZ2 redundancy for three days with
    nothing alerting anyone.
    
    Design rules:
      * NEVER crash and NEVER serve a 500. On any API failure set truenas_scrape_success
        to 0 and keep serving the LAST KNOWN values, so a transient API blip does not
        look identical to "pool is fine".
      * pool size/allocated/free from the API are RAW bytes INCLUDING PARITY. They are
        exported as _raw_ and alerting uses allocated/size, which is parity-independent.
    """
    import json
    import os
    import ssl
    import threading
    import time
    import urllib.request
    import urllib.error
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    
    URL = os.environ.get("TRUENAS_URL", "").rstrip("/")
    # Scoped, revocable TrueNAS API key - preferred over basic auth with a user
    # password, which would put reusable account credentials on the wire.
    API_KEY = os.environ.get("TRUENAS_API_KEY", "")
    INTERVAL = int(os.environ.get("TRUENAS_POLL_INTERVAL", "60"))
    # NOT named TRUENAS_EXPORTER_PORT: Kubernetes injects legacy Docker-link vars for
    # every Service in the namespace, and the Service `truenas-exporter` produces
    # TRUENAS_EXPORTER_PORT="tcp://<clusterIP>:9100". That collides with our own name,
    # the Service value wins, and int() dies at import. The Deployment also sets
    # enableServiceLinks: false to stop the injection at source; this rename means the
    # exporter is safe even if that is ever dropped.
    PORT = int(os.environ.get("LISTEN_PORT", "9100"))
    
    # FULL TLS verification - deliberately NOT disabled.
    #
    # The obvious-looking move here is verify_mode=CERT_NONE, because connecting to
    # https://192.168.10.122:444 fails validation. But TrueNAS is NOT serving a
    # self-signed cert - it serves a real Let's Encrypt cert for *.wethecommon.com.
    # Validation failed only because we were connecting by IP, which no cert covers.
    #
    # Fix: the Deployment carries a hostAliases entry mapping
    # truenas-api.wethecommon.com -> 192.168.10.122, so we connect by a name the
    # wildcard cert actually covers and verification succeeds normally. No disabled
    # checks, no cert pinning, no custom trust store.
    #
    # Verified: that hostname validates (ssl_verify_result=0) while a name outside the
    # wildcard is correctly REJECTED - i.e. verification is genuinely active, not
    # silently passing. These are admin credentials on the wire; they get a verified
    # channel.
    CTX = ssl.create_default_context()
    
    _lock = threading.Lock()
    _payload = "# exporter starting\ntruenas_scrape_success 0\n"
    
    
    def esc(v):
        return str(v).replace("\\", "\\\\").replace('"', '\\"').replace("\n", " ")
    
    
    def api(path, method="GET", body=None):
        req = urllib.request.Request(URL + path, method=method)
        req.add_header("Authorization", "Bearer " + API_KEY)
        data = None
        if body is not None:
            data = json.dumps(body).encode()
            req.add_header("Content-Type", "application/json")
        with urllib.request.urlopen(req, data=data, timeout=25, context=CTX) as r:
            return json.loads(r.read().decode())
    
    
    def walk_vdevs(nodes, pool, out, depth=0):
        """Recurse the topology tree. Every node carries status + error stats."""
        for n in nodes or []:
            if not isinstance(n, dict):
                continue
            name = n.get("name") or n.get("device") or n.get("guid") or "unknown"
            vtype = n.get("type") or "DISK"
            status = n.get("status") or "UNKNOWN"
            healthy = 1 if status == "ONLINE" else 0
            out.append(f'truenas_vdev_healthy{{pool="{esc(pool)}",vdev="{esc(name)}",'
                       f'type="{esc(vtype)}",status="{esc(status)}"}} {healthy}')
            st = n.get("stats") or {}
            for kind, key in (("read", "read_errors"), ("write", "write_errors"),
                              ("checksum", "checksum_errors")):
                v = st.get(key)
                if isinstance(v, (int, float)):
                    out.append(f'truenas_vdev_errors_total{{pool="{esc(pool)}",'
                               f'vdev="{esc(name)}",kind="{kind}"}} {int(v)}')
            walk_vdevs(n.get("children"), pool, out, depth + 1)
    
    
    def collect():
        out = []
        t0 = time.time()
        pools = api("/api/v2.0/pool")
        for p in pools:
            if not isinstance(p, dict):
                continue
            name = p.get("name", "?")
            status = p.get("status", "UNKNOWN")
            healthy = 1 if p.get("healthy") else 0
            out.append(f'truenas_pool_healthy{{pool="{esc(name)}"}} {healthy}')
            out.append(f'truenas_pool_status_info{{pool="{esc(name)}",status="{esc(status)}"}} 1')
            size = p.get("size") or 0
            alloc = p.get("allocated") or 0
            free = p.get("free") or 0
            out.append(f'truenas_pool_raw_size_bytes{{pool="{esc(name)}"}} {int(size)}')
            out.append(f'truenas_pool_raw_allocated_bytes{{pool="{esc(name)}"}} {int(alloc)}')
            out.append(f'truenas_pool_raw_free_bytes{{pool="{esc(name)}"}} {int(free)}')
            if size:
                out.append(f'truenas_pool_used_ratio{{pool="{esc(name)}"}} {alloc / size:.6f}')
            scan = p.get("scan") or {}
            fn = scan.get("function") or "NONE"
            stt = scan.get("state") or "NONE"
            out.append(f'truenas_pool_scan_state_info{{pool="{esc(name)}",'
                       f'function="{esc(fn)}",state="{esc(stt)}"}} 1')
            pct = scan.get("percentage")
            if isinstance(pct, (int, float)):
                out.append(f'truenas_pool_scan_percentage{{pool="{esc(name)}"}} {pct:.4f}')
            # Scan start/end as unix timestamps. Needed to alert on a scrub that never
            # RAN, which percentage alone cannot express: an interrupted scrub still
            # stamps the last-scrub clock, and pool.scrub.run defaults to
            # threshold=35 DAYS and returns null - indistinguishable from success -
            # when it declines. That combination silently skipped the 2026-08-02
            # scheduled run entirely, with nothing reporting it.
            # API returns these as {"$date": <milliseconds>}.
            for src, label in (("start_time", "start"), ("end_time", "end")):
                tv = scan.get(src)
                if isinstance(tv, dict) and isinstance(tv.get("$date"), (int, float)):
                    out.append(f'truenas_pool_scan_{label}_timestamp_seconds'
                               f'{{pool="{esc(name)}"}} {tv["$date"] / 1000:.0f}')
            # Errors found by the scan itself. Distinct from truenas_vdev_errors_total,
            # which is per-device read/write/checksum counters: a scrub can surface
            # data errors while every vdev counter reads zero, and the 2026-08-03 link
            # failure was the inverse - devices gone, zero scan errors. Both matter.
            serr = scan.get("errors")
            if isinstance(serr, (int, float)):
                out.append(f'truenas_pool_scan_errors{{pool="{esc(name)}"}} {int(serr)}')
            # A PAUSED scrub still reports state=SCANNING with a frozen percentage,
            # which is indistinguishable from a wedged one unless pause is exposed.
            # TrueNASScrubStalled false-fired on exactly this within an hour of being
            # deployed, when the Aug 3 scrub was paused to restore the media stack.
            # `pause` is null when running and a {"$date": ...} object when paused.
            out.append(f'truenas_pool_scan_paused{{pool="{esc(name)}"}} '
                       f'{1 if scan.get("pause") else 0}')
            for grp, nodes in (p.get("topology") or {}).items():
                walk_vdevs(nodes, name, out)
    
        # non-dismissed alerts by level
        try:
            counts = {}
            for a in api("/api/v2.0/alert/list"):
                if isinstance(a, dict) and not a.get("dismissed"):
                    counts[a.get("level", "UNKNOWN")] = counts.get(a.get("level", "UNKNOWN"), 0) + 1
            for lvl in ("CRITICAL", "WARNING", "INFO"):
                out.append(f'truenas_alerts{{level="{lvl}"}} {counts.get(lvl, 0)}')
        except Exception:
            pass  # best effort - must never break the scrape
    
        # disk inventory, SMART visibility, and temperatures - best effort
        #
        # WHY PRESENCE IS ITS OWN METRIC: the disk alert used to count
        # temperature series as a proxy for "the disk is still attached".
        # That proxy broke on 2026-08-06. The six JBOD Seagates moved to
        # per-disk scsi-block passthrough and now present the ENCLOSURE's
        # SCSI identity (model reads "QNAP", not ST18000NE000) while their
        # real serials still come through. They stay fully present and in the
        # pool, but SAT/SMART attribute passthrough does not survive that
        # layer, so their temperature vanished. The alert then declared that
        # disks had "disappeared from the OS entirely" about six disks that
        # were sitting right there, serving a scrub.
        #
        # Presence and SMART-visibility are different facts. Conflating them
        # meant a monitoring regression masqueraded as a transport failure,
        # and the real transport check was lost. They are separate now:
        #   truenas_disk_present         - the disk enumerates at all
        #   truenas_disk_smart_available - it also answers SMART
        try:
            all_disks = [d for d in api("/api/v2.0/disk")
                         if isinstance(d, dict) and (d.get("name") or "").startswith("sd")]
            for d in all_disks:
                out.append(
                    'truenas_disk_present{{disk="{}",serial="{}",model="{}"}} 1'.format(
                        esc(d.get("name") or ""),
                        esc(d.get("serial") or "unknown"),
                        esc(d.get("model") or "unknown")))
            names = [d.get("name") for d in all_disks]
            temps = api("/api/v2.0/disk/temperatures", method="POST",
                        body={"names": names}) if names else {}
            for d in all_disks:
                dn = d.get("name") or ""
                t = (temps or {}).get(dn)
                # Skip 0/None: the QEMU virtual disks (sda/sdb) report 0, which would
                # otherwise publish as a literal 0 C and look like a frozen drive.
                reports = isinstance(t, (int, float)) and t > 0
                if reports:
                    out.append(f'truenas_disk_temperature_celsius{{disk="{esc(dn)}"}} {t}')
                # Only spinning disks are expected to answer SMART here; the two
                # QEMU virtual disks legitimately do not, and must not be counted
                # as a SMART regression.
                if (d.get("type") or "") == "HDD":
                    out.append(
                        f'truenas_disk_smart_available{{disk="{esc(dn)}"}} {1 if reports else 0}')
        except Exception:
            pass
    
        out.append(f"truenas_scrape_duration_seconds {time.time() - t0:.4f}")
        out.append("truenas_scrape_success 1")
        return "\n".join(out) + "\n"
    
    
    def poller():
        global _payload
        while True:
            try:
                body = collect()
                with _lock:
                    _payload = body
            except Exception as e:
                # Keep last-known values, but flip the success flag so
                # TrueNASExporterDown fires and we do not read stale data as healthy.
                with _lock:
                    lines = [l for l in _payload.split("\n")
                             if not l.startswith("truenas_scrape_success")
                             and not l.startswith("# scrape_error")]
                    lines.append(f"# scrape_error {esc(e)}")
                    lines.append("truenas_scrape_success 0")
                    _payload = "\n".join(lines) + "\n"
            time.sleep(INTERVAL)
    
    
    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path.rstrip("/") not in ("/metrics", ""):
                self.send_response(404)
                self.end_headers()
                return
            with _lock:
                body = _payload.encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)
    
        def log_message(self, *a):
            pass  # keep scrape noise out of pod logs
    
    
    if __name__ == "__main__":
        threading.Thread(target=poller, daemon=True).start()
        ThreadingHTTPServer(("0.0.0.0", PORT), Handler).serve_forever()
