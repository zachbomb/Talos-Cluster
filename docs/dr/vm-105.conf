# Proxmox VM 105 (Talos control-plane node) — spec snapshot for disaster recovery.
# Captured 2026-07-27. NOT auto-synced — re-capture (`qm config 105`) after any VM change.
# Proxmox is NOT repo-managed (see reference_proxmox_not_repo_controlled memory), so this
# is the only place the VM's disk/GPU/NIC layout is recorded. Used by the single-node DR
# runbook (docs/runbooks/single-node-disaster-recovery.md) to recreate the VM.
#
# ===== VERBATIM `qm config 105` (2026-07-27, post etcd disk-move) =====
agent: 1
boot: order=scsi0
cores: 8
cpu: x86-64-v2-AES,flags=+aes
cpuunits: 4096
efidisk0: local-zfs:vm-105-disk-1,efitype=4m,pre-enrolled-keys=1,size=1M
hostpci0: 0000:00:02
hostpci1: 0000:01:00
memory: 49152
meta: creation-qemu=9.2.0,ctime=1747373969
name: Talos-Cluster
net0: virtio=bc:24:11:8d:f4:39,bridge=vmbr0,firewall=1
numa: 0
ostype: l26
scsi0: solidigm:vm-105-disk-0,cache=writeback,discard=on,iothread=1,size=2T,ssd=1
scsi2: /dev/disk/by-id/ata-INTEL_SSDSC2KB019T8_PHYF116200LF1P9DGN,discard=on,size=1875374424K,ssd=1
scsihw: virtio-scsi-single
smbios1: uuid=c05f5ac0-0664-4624-adca-ea1465d953f9
sockets: 1
tags: apps;docker;kubernetes;services;talos;vm;linux
unused0: local-zfs:vm-105-disk-0
#
# ===== DR ANNOTATIONS (what each line means for a rebuild) =====
# - scsi0  = Talos SYSTEM disk (boot + etcd + EPHEMERAL). Post-2026-07-27 it lives on the
#            `solidigm` ZFS pool (single Solidigm S4520). Must satisfy talconfig
#            installDiskSelector (size <= 2400GB). On a full rebuild, create/point this at
#            the install target; Talos installs BOOT/META/STATE/EPHEMERAL here.
# - scsi2  = Intel D3-S4510 1.92TB RAW passthrough = LONGHORN hot-tier (all app volumes).
#            by-id: ata-INTEL_SSDSC2KB019T8_PHYF116200LF1P9DGN. If this disk survives a
#            node loss, Longhorn re-discovers its replicas here → apps recover WITHOUT a
#            VolSync restore. Mounted in Talos via patches/uservolume-longhorn-ssd.yaml.
# - efidisk0 = UEFI NVRAM (1M) on local-zfs (QLC). Small/idle.
# - unused0  = the PRE-migration QLC system disk (local-zfs:vm-105-disk-0) — the rollback
#            for the 2026-07-27 disk-move. Safe to destroy once the move is trusted
#            (was pending as of capture). Not needed for a fresh rebuild.
# - hostpci0: 0000:00:02 = Intel UHD P630 iGPU (Tunarr VAAPI/QSV transcode). Needs the
#            i915 system extension + kernel module.
# - hostpci1: 0000:01:00 = NVIDIA A4000 (Ollama). Needs nonfree-kmod-nvidia + toolkit exts.
# - net0 MAC bc:24:11:8d:f4:39 on vmbr0 — keep the MAC (DHCP/reservations depend on it).
# - cpuunits: 4096 = host CPU-priority weight for the Talos VM (helps under contention).
# - 8 cores / 49152MB (48GB) RAM. QEMU 9.2. SMBIOS uuid must match if anything pins to it.
#
# Talos install schematic (extensions) is defined in clusters/main/talos/talconfig.yaml
# controlPlane.schematic — util-linux, iscsi-tools, qemu-guest-agent, gasket-driver, i915,
# intel-ucode, mei, thunderbolt, nonfree-kmod-nvidia-lts, nvidia-container-toolkit-lts.
